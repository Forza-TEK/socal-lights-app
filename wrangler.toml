# Cloudflare Pages project config. The IDs below are filled in during setup (see README).
name = "socal-lights"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "socal-lights"
database_id = "789bcc2e-76b8-4b6e-9007-29311d506fb2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "socal-lights-photos"

[vars]
# Cloudflare Access (protects /admin). Fill in after setting up Access; see README step 6.
ACCESS_TEAM_DOMAIN = "still-rice-29b5.cloudflareaccess.com"      # e.g. "yourteam.cloudflareaccess.com"
ACCESS_AUD = "a129de805c2dfbbc50b934ea12afe86921d58260e366e8aedd686db6878e1e3a"              # the Application Audience (AUD) tag
# Cloudflare Turnstile public site key (the secret goes in a Pages secret named TURNSTILE_SECRET)
TURNSTILE_SITE_KEY = "0x4AAAAAAFkk14dBx3bEsnCn"
