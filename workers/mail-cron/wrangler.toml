# A tiny Cloudflare Worker whose only job is a clock: it calls the site on schedule for every job that only needs to call the site (mail outbox every 5 minutes, usage check every 30, Stripe reconcile, sponsor renewals, contest reminders daily, the weekly lights email).
# (Cloudflare Pages, where the site runs, has no scheduler of its own; a Worker does. GitHub's scheduler is unreliable: it ran the old hourly job every 4 to 8 hours.)
# Deployed by .github/workflows/deploy-mail-cron.yml. Secret: ALERT_CRON_KEY (the same key the site checks), set by that workflow from the GitHub secret of the same name.
name = "socal-lights-mail-cron"
main = "index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["*/5 * * * *", "7,37 * * * *", "47 14 * * *", "17 15 * * *", "15 17 * * *", "30 17 * * 4"]
