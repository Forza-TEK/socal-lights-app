# One-time helper: makes the Android upload key. Run it once, download the artifact, then store the values as secrets and keep a copy somewhere safe.
name: Android upload key (one time)
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create the key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -alias socallights -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=SoCal Lights, O=Forza-TEK, C=US"
          base64 -w0 upload.jks > upload.jks.b64
          printf "ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=socallights\n" "$PASS" > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key-KEEP-PRIVATE
          path: |
            upload.jks
            upload.jks.b64
            secrets.txt
          retention-days: 1
