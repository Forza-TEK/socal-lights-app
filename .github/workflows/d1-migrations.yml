# Applies new database migrations (files in migrations/) to the live D1 database
# whenever they're pushed to main. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  – a Cloudflare API token with "D1: Edit" on this account
#   CLOUDFLARE_ACCOUNT_ID – the Cloudflare account id
# Without them the job skips itself, so nothing breaks before they're added.
name: Apply database migrations

on:
  push:
    branches: [main]
    paths: ["migrations/**"]
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Apply migrations to the live database
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply socal-lights --remote
      - name: Event counts by season
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 execute socal-lights --remote --command "SELECT season, COUNT(*) AS n, SUM(status='confirmed') AS confirmed FROM events GROUP BY season"
