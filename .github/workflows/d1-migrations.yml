# Applies new database migrations (files in migrations/) to the live D1 database
# whenever they're pushed to main. Needs one repository secret:
#   CLOUDFLARE_API_TOKEN – a Cloudflare API token with "D1: Edit" on this account
# Without it the job skips itself, so nothing breaks before it's added.
name: Apply database migrations

on:
  push:
    branches: [main]
    paths: ["migrations/**"]
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  # Deploy gate: refuse migrations with HARD errors (bad ids, counties, seasons/types, dates, coordinates outside
  # Southern California, unguarded DELETE/UPDATE/DROP, edits to existing migrations). It checks every migration
  # added since the last successful deploy, so a rejected file cannot slip out with a later push.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find the last deployed commit
        id: base
        run: |
          SHA=$(gh run list --workflow d1-migrations.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$SHA" ] || ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then SHA="${{ github.event.before }}"; fi
          echo "Checking migrations added since $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Check the new migrations
        run: node --no-warnings scripts/validate-migrations.mjs --gate --base "${{ steps.base.outputs.sha }}"

  migrate:
    needs: [validate]
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 52d622850c5e367e319d35143c43a275  # account id (not a secret)
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tolerate a pasted secret with extra lines/spaces: keep just the token itself.
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n 1)
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN doesn't look like a Cloudflare token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Apply migrations to the live database
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply socal-lights --remote
      - name: Event counts by season
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 execute socal-lights --remote --command "SELECT season, COUNT(*) AS n, SUM(status='confirmed') AS confirmed FROM events GROUP BY season"

  # A rejected or failed migration must not wait for someone to read the Actions tab: open (or update) an issue, which emails the owner.
  alert:
    needs: [validate, migrate]
    if: ${{ always() && (needs.validate.result == 'failure' || needs.migrate.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the issue
        run: |
          T="Database migration failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "Failed again: $URL"; else gh issue create --title "$T" --body "A push to main changed migrations/ and the check or the apply to the live database failed. See $URL. The live data was not changed by a failed migration unless the log says otherwise. Fix with a NEW migration (never edit an old one). Close this issue when the next run is green."; fi
