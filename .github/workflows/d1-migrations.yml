# Applies new database migrations (files in migrations/) to the live D1 database
# whenever they're pushed to main. Needs one repository secret:
#   CLOUDFLARE_API_TOKEN – a Cloudflare API token with "D1: Edit" on this account
# Without it the job skips itself, so nothing breaks before it's added.
name: Apply database migrations

on:
  push:
    branches: [main]
    paths: ["migrations/**"]
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  # Deploy gate: refuse migrations with HARD errors (bad ids, counties, seasons/types, dates, coordinates outside
  # Southern California, unguarded DELETE/UPDATE/DROP, edits to existing migrations). It checks every migration
  # added since the last successful deploy, so a rejected file cannot slip out with a later push.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job must not hold the queue (audit F-47)
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find the last deployed commit
        id: base
        run: |
          SHA=$(gh run list --workflow d1-migrations.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$SHA" ] || ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then SHA="${{ github.event.before }}"; fi
          echo "Checking migrations added since $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: List the events an admin deleted in Admin (so a migration cannot bring one back by accident)
        continue-on-error: true   # never blocks: without the secret, or before migration 0268 reaches the live database, the check simply has nothing to compare with
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52d622850c5e367e319d35143c43a275
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No token: skipping the deleted-events list."; exit 0; fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n 1)
          CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler d1 execute socal-lights --remote --json --command "SELECT id FROM deleted_events" > "$RUNNER_TEMP/deleted.json" || exit 0
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const r=(j[0]&&j[0].results)||[];require("fs").writeFileSync(process.argv[2],JSON.stringify(r.map(x=>x.id)));console.log(r.length+" admin-deleted event(s) listed")' "$RUNNER_TEMP/deleted.json" "$RUNNER_TEMP/deleted-ids.json" || true
      - name: List the events an organizer manages (so a migration cannot overwrite their edits by accident)
        continue-on-error: true   # never blocks: without the secret the check simply has nothing to compare with
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52d622850c5e367e319d35143c43a275
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No token: skipping the owned-events list."; exit 0; fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n 1)
          CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler d1 execute socal-lights --remote --json --command "SELECT event_id AS id FROM event_submissions WHERE status = 'published' AND event_id IS NOT NULL AND event_id != '' UNION SELECT event_id FROM event_claims WHERE status = 'approved'" > "$RUNNER_TEMP/owned.json" || exit 0
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const r=(j[0]&&j[0].results)||[];require("fs").writeFileSync(process.argv[2],JSON.stringify(r.map(x=>x.id)));console.log(r.length+" organizer-managed event(s) listed")' "$RUNNER_TEMP/owned.json" "$RUNNER_TEMP/owned-ids.json" || true
      - name: Check the new migrations
        run: |
          EXTRA=""
          if [ -s "$RUNNER_TEMP/deleted-ids.json" ]; then EXTRA="--deleted-file $RUNNER_TEMP/deleted-ids.json"; fi
          if [ -s "$RUNNER_TEMP/owned-ids.json" ]; then EXTRA="$EXTRA --owned-file $RUNNER_TEMP/owned-ids.json"; fi
          node --no-warnings scripts/validate-migrations.mjs --gate --base "${{ steps.base.outputs.sha }}" $EXTRA

  migrate:
    needs: [validate]
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job must not hold the queue (audit F-47)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 52d622850c5e367e319d35143c43a275  # account id (not a secret)
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tolerate a pasted secret with extra lines/spaces: keep just the token itself.
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n 1)
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN doesn't look like a Cloudflare token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Remember how many events the live database holds (for the smoke check below)
        id: before
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true   # never blocks: without a count the smoke check only tests the live site
        run: |
          npx wrangler d1 execute socal-lights --remote --json --command "SELECT COUNT(*) AS n FROM events" > "$RUNNER_TEMP/before.json"
          echo "n=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j[0].results[0].n)' "$RUNNER_TEMP/before.json")" >> "$GITHUB_OUTPUT"
      - name: Apply migrations to the live database
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply socal-lights --remote
      - name: Smoke check after the migration (event count within 5 percent; the events API request is a warning only); a count failure opens the same issue as a failed migration
        if: steps.check.outputs.skip != 'true'
        run: |
          npx wrangler d1 execute socal-lights --remote --json --command "SELECT COUNT(*) AS n FROM events" > "$RUNNER_TEMP/after.json"
          AFTER=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j[0].results[0].n)' "$RUNNER_TEMP/after.json")
          BEFORE="${{ steps.before.outputs.n }}"
          echo "Events before: ${BEFORE:-unknown}, after: $AFTER"
          if [ -n "$BEFORE" ] && [ "$AFTER" -lt $(( BEFORE * 95 / 100 )) ]; then echo "::error::The migration removed more than 5 percent of the events ($BEFORE to $AFTER). It is applied; check it now."; exit 1; fi
          # The live-site request is a warning only: Cloudflare's bot protection answers GitHub's runners with a 403 (it did on 2026-11-24), and we do not work around that.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://socallights.app/api/events?head=1")
          if [ "$CODE" != "200" ]; then echo "::warning::https://socallights.app/api/events answered $CODE from the runner (a 403 is the bot protection; check the site yourself if the event count above also looks wrong)."; fi
      - name: Also bring the PREVIEW database up to date (previews use their own database, see docs/runbooks/preview-isolation.md)
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true   # never blocks the live migration; a failure only means previews may show errors until it is fixed
        run: npx wrangler d1 migrations apply DB --remote --env preview
      - name: Event counts by season
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 execute socal-lights --remote --command "SELECT season, COUNT(*) AS n, SUM(status='confirmed') AS confirmed FROM events GROUP BY season"

  # A rejected or failed migration must not wait for someone to read the Actions tab: open (or update) an issue, which emails the owner.
  alert:
    needs: [validate, migrate]
    if: ${{ always() && (needs.validate.result == 'failure' || needs.migrate.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job must not hold the queue (audit F-47)
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the issue
        run: |
          T="Database migration failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "Failed again: $URL"; else gh issue create --title "$T" --body "A push to main changed migrations/ and the check or the apply to the live database failed. See $URL. The live data was not changed by a failed migration unless the log says otherwise. Fix with a NEW migration (never edit an old one). Close this issue when the next run is green."; fi
