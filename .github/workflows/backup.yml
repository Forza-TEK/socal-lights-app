# Nightly private backup of the live D1 database (and a weekly copy of the photos) to a PRIVATE R2 bucket.
# This repository is PUBLIC, so the backup is never stored as a workflow artifact or committed: it contains emails and private data.
# Needs the repository secret CLOUDFLARE_API_TOKEN with: D1 Edit (already there) and Workers R2 Storage Edit (add it once; see docs/runbooks/backup-restore.md).
# If the token cannot reach R2 the run fails with the exact steps and opens a GitHub issue, so a missing backup is never silent.
name: Nightly backup

on:
  schedule:
    - cron: "17 10 * * *"   # about 2-3 am Pacific
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 52d622850c5e367e319d35143c43a275  # account id (not a secret)
      BACKUP_BUCKET: socal-lights-backups
      PHOTO_BUCKET: socal-lights-photos
    steps:
      - name: Check the token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | head -n 1)
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN doesn't look like a Cloudflare token"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Make sure the private backup bucket exists
        run: |
          if npx wrangler r2 bucket list 2>/tmp/list.err | grep -q "name:[[:space:]]*$BACKUP_BUCKET"; then echo "bucket $BACKUP_BUCKET exists"; exit 0; fi
          if npx wrangler r2 bucket create "$BACKUP_BUCKET" 2>/tmp/create.err; then echo "created $BACKUP_BUCKET (private: no public access or custom domain is ever set on it)"; exit 0; fi
          cat /tmp/list.err /tmp/create.err
          echo "::error::The API token cannot create or list R2 buckets. Owner: Cloudflare dashboard > My Profile > API Tokens > the token used for GitHub > Edit > add 'Account > Workers R2 Storage > Edit' > Continue > Update token. (Or create a PRIVATE R2 bucket named $BACKUP_BUCKET by hand: R2 Object Storage > Create bucket.) Then re-run this workflow."
          exit 1
      - name: Keep dated backups for 35 days (monthly ones for 400 days)
        run: |
          # Lifecycle rules are idempotent by name; failures here must not stop the backup itself
          npx wrangler r2 bucket lifecycle add "$BACKUP_BUCKET" daily daily/ --expire-days 35 -y 2>&1 | tail -2 || true
          npx wrangler r2 bucket lifecycle add "$BACKUP_BUCKET" monthly monthly/ --expire-days 400 -y 2>&1 | tail -2 || true
      - name: Export the live database
        run: |
          npx wrangler d1 export socal-lights --remote --output backup.sql
          size=$(wc -c < backup.sql); echo "export is $size bytes"
          # Sanity check: a truncated or empty export must never overwrite a good backup's place in the rotation
          if [ "$size" -lt 200000 ]; then echo "::error::The export is suspiciously small ($size bytes)"; exit 1; fi
          grep -q "CREATE TABLE.*events" backup.sql || { echo "::error::The export has no events table"; exit 1; }
          grep -q "CREATE TABLE.*users" backup.sql || { echo "::error::The export has no users table"; exit 1; }
          grep -c "^INSERT INTO" backup.sql | sed 's/^/insert statements: /'
          gzip -9 backup.sql
          sha256sum backup.sql.gz | tee backup.sha256
      - name: Upload to the private bucket
        run: |
          D=$(date -u +%F); M=$(date -u +%Y-%m)
          npx wrangler r2 object put "$BACKUP_BUCKET/daily/socal-lights-$D.sql.gz" --file backup.sql.gz --content-type application/gzip --remote
          npx wrangler r2 object put "$BACKUP_BUCKET/daily/socal-lights-$D.sha256" --file backup.sha256 --content-type text/plain --remote
          npx wrangler r2 object put "$BACKUP_BUCKET/latest.sql.gz" --file backup.sql.gz --content-type application/gzip --remote
          if [ "$(date -u +%d)" = "01" ]; then npx wrangler r2 object put "$BACKUP_BUCKET/monthly/socal-lights-$M.sql.gz" --file backup.sql.gz --content-type application/gzip --remote; fi
          # Read it back: the backup only counts if it can be fetched and is the same file
          npx wrangler r2 object get "$BACKUP_BUCKET/daily/socal-lights-$D.sql.gz" --file check.sql.gz --remote
          cmp backup.sql.gz check.sql.gz && echo "verified: the uploaded copy matches"
      - name: Copy new photos (Sundays and on demand)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then echo "Photos are copied on Sundays; skipping"; exit 0; fi
          node scripts/backup-photos.mjs "$PHOTO_BUCKET" "$BACKUP_BUCKET"
      - name: Open or update a GitHub issue when the backup fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          T="Nightly backup failed"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "Failed again: $URL"; else gh issue create --title "$T" --body "The nightly D1 backup did not complete. See $URL. If the log says the token cannot reach R2, follow docs/runbooks/backup-restore.md (Setup). Close this issue once a run succeeds."; fi
