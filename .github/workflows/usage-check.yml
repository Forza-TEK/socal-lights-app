name: Cloudflare usage check
# Scheduled by the Cloudflare cron Worker (workers/mail-cron), not by GitHub: this workflow only runs by hand (Actions > Run workflow) as a fallback. docs/runbooks/monitoring.md.

# Every 30 minutes (GitHub's schedule can run late or skip a run: the three-a-day admin digest runs the same check too, and the digest email has a
# "Cloudflare usage" section). Asks the site for its Cloudflare plan usage (read-only) and opens ONE issue, "Cloudflare usage limit reached or near",
# when any metric is at 90% or more of its limit (free plan) or included amount (Workers Paid, where 100% means extra charges start, not that the site stops)
# or a quota error was logged; it closes the issue when everything is back under 90%. The plan comes from CLOUDFLARE_PLAN on the site (default paid). GitHub emails the owner on issue creation.
# Uses the same repository secret as the digest (ALERT_CRON_KEY) and the pages.dev address (socallights.app challenges GitHub's servers).
# Needs the Pages secrets CF_ANALYTICS_TOKEN and CF_ACCOUNT_ID for the Cloudflare numbers (see docs/runbooks/cloudflare-limits.md); without them only email counts and logged quota errors are checked.
on:
  workflow_dispatch:

permissions:
  issues: write    # only to open, update or close the usage issue and the stale-job issue
  actions: write   # only so the stale-job check can start a late nightly backup

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check usage and update the issue
        env:
          ALERT_CRON_KEY: ${{ secrets.ALERT_CRON_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/usage-issue.sh
      - name: Check that the scheduled jobs are reporting in (opens or closes the issue "Scheduled job stopped reporting"; starts a late backup)
        if: always()
        env:
          ALERT_CRON_KEY: ${{ secrets.ALERT_CRON_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/stale-issue.sh
      - name: Report to the heartbeat (dead-man's switch; see docs/runbooks/monitoring.md)
        if: always()
        continue-on-error: true
        env:
          ALERT_CRON_KEY: ${{ secrets.ALERT_CRON_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$ALERT_CRON_KEY" ] || exit 0
          s=ok; [ "$JOB_STATUS" = success ] || s=fail
          curl -sS -m 20 --retry 2 -X POST "https://socal-lights.pages.dev/api/heartbeat?job=usage-check&status=$s" -H "x-alert-key: $ALERT_CRON_KEY" -o /dev/null -w "heartbeat: HTTP %{http_code}\n"
