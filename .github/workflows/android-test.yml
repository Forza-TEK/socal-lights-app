# Starts a virtual Android phone (and tablet) on GitHub, installs a debug build of the SoCal Lights app, opens it and saves screenshots plus the error log.
# No Android device needed. Run it by hand: Actions > "Android test" > Run workflow, then download the artifact "android-screens-<device>".
name: Android test
on:
  workflow_dispatch:
jobs:
  emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: phone, profile: pixel_6, api: 34 }
          - { name: tablet, profile: pixel_c, api: 34 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and sync
        working-directory: app
        run: npm ci && npx cap sync android
      - name: Build the debug app
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app on a virtual ${{ matrix.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash .github/scripts/android-screens.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens-${{ matrix.name }}
          path: shots
