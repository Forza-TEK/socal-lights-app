# Starts a virtual Android phone (and tablet) on GitHub, installs a debug build of the SoCal Lights app, opens it and saves screenshots plus the error log.
# No Android device needed. Run it by hand: Actions > "Android test" > Run workflow, then download the artifact "android-screens-<device>".
name: Android test
on:
  workflow_dispatch:
jobs:
  emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: phone, profile: pixel_6, api: 34 }
          - { name: tablet, profile: pixel_c, api: 34 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Cloudflare's bot check blocks GitHub's datacenter addresses (the first run only saw "Verify you are human"), and we do not get around it.
      # So the test serves its own copy of the site on this machine (same files, local database) and points the debug app at it. Nothing is committed.
      - name: Start a local copy of the site
        run: |
          npm ci
          yes | npx wrangler d1 migrations apply socal-lights --local
          nohup npx wrangler pages dev public --port 8788 --ip 0.0.0.0 --local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8788/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8788/api/events | head -c 200
      - name: Install and sync (debug app points at the local copy)
        working-directory: app
        run: |
          npm ci
          python3 - <<'PY'
          import json
          c = json.load(open("capacitor.config.json"))
          c["server"]["url"] = "http://10.0.2.2:8788"
          c["server"]["cleartext"] = True
          json.dump(c, open("capacitor.config.json", "w"), indent=2)
          PY
          npx cap sync android
      - name: Build the debug app
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app on a virtual ${{ matrix.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash .github/scripts/android-screens.sh shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens-${{ matrix.name }}
          path: |
            shots
            wrangler.log
