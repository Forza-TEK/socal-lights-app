<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoCal Lights Finder</title>
<meta name="description" content="Year-round Southern California events on one map: New Year's and Lunar New Year, spring blooms, Fourth of July fireworks and fairs, Halloween haunts and Christmas lights.">
<meta property="og:title" content="SoCal Lights Finder">
<meta property="og:type" content="website">
<meta property="og:url" content="https://socallights.app/">
<meta property="og:image" content="https://socallights.app/img/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:description" content="Holiday and seasonal events across Southern California, all year, on one map.">
<meta name="theme-color" content="#f6f4f0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- day mode is the default; night mode is remembered per device. Set before CSS loads so the page never flashes. -->
<script>try{if(localStorage.getItem("socal-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="map" role="region" aria-label="Street map of Southern California"></div>

<div class="topbar">
  <div class="searchrow">
    <a class="brand" href="https://socallights.app" aria-label="SoCal Lights, socallights.app"><svg class="mark" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="18" y1="6" x2="40" y2="61" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f9b21c"/><stop offset=".5" stop-color="#ee6a1a"/><stop offset="1" stop-color="#d1343f"/></linearGradient></defs><path d="M32 61C32 61 11 42 11 26a21 21 0 1 1 42 0c0 16-21 35-21 35z" fill="url(#lg)"/><path d="M32 14c1.2 7 3.6 10.2 12 12-8.4 1.8-10.8 5-12 12-1.2-7-3.6-10.2-12-12 8.4-1.8 10.8-5 12-12z" fill="#fff"/><path d="M54 5c.5 3 1.5 4.2 5 5-3.5.8-4.5 2-5 5-.5-3-1.5-4.2-5-5 3.5-.8 4.5-2 5-5z" fill="#ffc83d"/><path d="M8 13c.4 2.4 1.2 3.4 4 4-2.8.6-3.6 1.6-4 4-.4-2.4-1.2-3.4-4-4 2.8-.6 3.6-1.6 4-4z" fill="#ffc83d"/></svg><span class="wm">SoCal <b>Lights</b></span></a>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search events or a city" aria-label="Search">
      <button class="fbtn" id="fbtn" type="button" aria-expanded="false" aria-controls="chips" aria-label="Filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span class="fcount" id="fcount" hidden>0</span>
      </button>
    </div>
    <button class="iconbtn" id="themebtn" type="button" aria-label="Switch to night mode" title="Night mode">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="seasonbar" id="seasonbar" role="tablist" aria-label="Season"></div>
  <div class="chips" id="chips">
    <button class="chip" type="button" data-pop="date"><span id="c-date">Any date</span><span class="caret">▾</span></button>
    <button class="chip" type="button" data-pop="city"><span id="c-city">Any city</span><span class="caret">▾</span></button>
    <button class="chip" type="button" data-pop="county"><span id="c-county">All counties</span><span class="caret">▾</span></button>
    <button class="chip" type="button" data-pop="cost"><span id="c-cost">Free or ticketed</span><span class="caret">▾</span></button>
    <button class="chip" type="button" data-pop="type"><span id="c-type">All types</span><span class="caret">▾</span></button>
    <button class="chip" type="button" id="c-conf">Dates confirmed</button>
    <button class="chip" type="button" data-pop="layers"><span>Layers</span><span class="caret">▾</span></button>
  </div>
</div>

<div class="preview" id="preview" hidden></div>

<aside class="panel" id="panel" aria-label="Results">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expand or collapse results"><i></i></div>
  <div class="ptabs" role="tablist">
    <button class="ptab" role="tab" id="t-events" aria-selected="true" type="button">Events<span class="n" id="n-events">0</span></button>
    <button class="ptab" role="tab" id="t-inst" aria-selected="false" type="button">Houses<span class="n" id="n-inst">0</span></button>
    <button class="ptab" role="tab" id="t-plan" aria-selected="false" type="button">My night<span class="n" id="n-plan">0</span></button>
  </div>
  <div class="phead" id="phead"></div>
  <div class="pbody" id="pbody"><div class="empty">Finding festive fun near you…</div></div>
</aside>

<!-- phone: floating tab bar for the same three tabs -->
<nav class="bnav" id="bnav" aria-label="Sections">
  <button type="button" data-tab="events" aria-current="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Explore</span></button>
  <button type="button" data-tab="inst"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9H4z"/><path d="M12 17.5s-2.5-1.5-2.5-3.2a1.3 1.3 0 0 1 2.5-.6 1.3 1.3 0 0 1 2.5.6c0 1.7-2.5 3.2-2.5 3.2z"/></svg><span>Houses</span></button>
  <button type="button" data-tab="plan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span>My night</span><b class="bn-n" id="bn-plan" hidden>0</b></button>
</nav>

<div class="pop" id="pop" hidden></div>
<div class="modal" id="modal" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
