<!-- day mode is the default; night mode is remembered per device. Set before CSS loads so the page never flashes. -->
<script>/* night mode: automatic from 6 pm to 6 am local time; the sun/moon button overrides it until the next switch */try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
<div id="map" role="region" aria-label="Street map of Southern California"></div>

<div class="topbar">
  <div class="searchrow">
    <a class="brand" href="https://socallights.app" aria-label="SoCal Lights, socallights.app"><img class="mark" src="/img/badge-160.webp" width="44" height="44" alt=""><span class="wm">SoCal <b>Lights</b></span></a>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search events or a city" aria-label="Search">
    </div>
    <button class="seasonbtn" id="seasonbtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Season"><span id="seasonlbl">Halloween</span><svg class="caret" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l5 5 5-5"/></svg></button>
    <button class="iconbtn" id="morebtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
</div>

<div class="preview" id="preview" hidden></div>

<aside class="panel" id="panel" aria-label="Results">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Expand or collapse results"><i></i></div>
  <div class="ptabs" role="tablist">
    <button class="ptab" role="tab" id="t-events" aria-selected="true" type="button" title="Places" aria-label="Places"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="lb">Places</span><span class="n" id="n-events">0</span></button>
    <button class="ptab" role="tab" id="t-plan" aria-selected="false" type="button" title="My night" aria-label="My night"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span class="lb">My night</span><span class="n" id="n-plan">0</span></button>
    <button class="ptab" role="tab" id="t-shop" aria-selected="false" type="button" title="Shop" aria-label="Shop" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5h14l-1.2 11a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg><span class="lb">Shop</span></button>
  </div>
  <div class="phead" id="phead"></div>
  <div class="pbody" id="pbody"><div class="empty">Finding festive fun near you…</div></div>
</aside>

<!-- phone: floating tab bar for the same three tabs -->
<nav class="bnav" id="bnav" aria-label="Sections">
  <button type="button" data-tab="events" aria-current="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>Places</span></button>
  <button type="button" data-tab="plan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span>My night</span><b class="bn-n" id="bn-plan" hidden>0</b></button>
  <button type="button" data-tab="shop" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5h14l-1.2 11a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg><span>Shop</span></button>
</nav>
