<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add to SoCal Lights</title>
<meta name="description" content="Add an event, a home decorating contest or your lights display to the SoCal Lights map. It's free.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261102g">
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span></div></div>
<div class="main">
  <h1>What would you like to add?</h1>
  <p class="help">Pick one. Nothing goes public until the last step, and you can go back at any time.</p>
  <div class="tiles" id="opts"></div>
</div>
<script type="module">
import { ICON, esc, themeBtn, mountAcct } from "/addflow.js?v=20261102b";
import { SEASONS, defaultSeason } from "/seasons.js?v=20261101e";
document.getElementById("tb").innerHTML = themeBtn() + '<span id="acct"></span>'; mountAcct(document.getElementById("acct"));
const today = new Date(Date.now() - 8 * 3600_000).toISOString().slice(0, 10);
document.documentElement.dataset.season = defaultSeason(today);
const row = (id, href, t, d, tm) => `<a class="tile opt" ${id ? `id="${id}"` : ""} href="${href}"><span class="ico">${ICON[id === "o-contest" ? "contest" : id === "o-event" ? "event" : "display"]}</span><b style="font-size:20px">${t}</b><span>${d}</span><span style="margin-top:6px;font-size:13px">${tm}</span></a>`;
const qs = new URLSearchParams(location.search).get("s"), s = SEASONS[qs] ? "?s=" + esc(qs) : "";
document.getElementById("opts").innerHTML =
  row("o-event", "/add-event", "An event", "A tree lighting, parade, market, haunted house or other seasonal event.", "Free · about 1 minute") +
  row("o-contest", "/add-contest", "A home decorating contest", "Neighbors enter their homes and the community votes. You get a link and a QR code to share.", "Free · about 3 minutes") +
  row("o-house", "/add-house" + s, "A lighting display", "Homeowners and professional installers: show your lights on the map so families can drive by.", "Free · about 2 minutes");
// Contests need sign-in. Until Google or emailed codes are switched on, hide that choice rather than send people to a dead end.
fetch("/api/auth/me", { cache: "no-store" }).then((r) => r.json()).then((j) => { if (!j.methods || (!j.methods.google && !j.methods.email)) document.getElementById("o-contest")?.remove(); }).catch(() => {});
</script>
</body>
</html>
