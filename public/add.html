<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add to SoCal Lights</title>
<meta name="description" content="Add an event or your lights display to the SoCal Lights map for free, or start a contest.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>try{var h=new Date().getHours(),t=h>=18||h<6||matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/tokens.css?v=20261113m">
<link rel="stylesheet" href="/addflow.css?v=20261111x560">
<script src="/hit.js?v=20261107a" defer></script>
</head>
<body>
<a class="skipl" href="#main">Skip to content</a><div class="hdr" role="banner"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><a class="maplink" href="/" aria-label="Open the map"><span class="long">Open the map</span><span class="short">Map</span></a><span id="tb"></span></div></div>
<main class="main" id="main" tabindex="-1">
  <h1>What would you like to add?</h1>
  <p class="help">Pick one. Nothing goes public until the last step, and you can go back at any time.</p>
  <div class="tiles" id="opts"></div>
  <p class="help"><a href="/pricing" style="color:var(--ink,inherit);text-underline-offset:3px">See pricing</a>: what is free and what is optional.</p>
</main>
<script type="module">
import { ICON, esc, themeBtn, mountAcct } from "/addflow.js?v=20261113a";
import { SEASONS, defaultSeason } from "/seasons.js?v=20261111x553";
document.getElementById("tb").innerHTML = themeBtn() + '<span id="acct"></span>'; mountAcct(document.getElementById("acct"));
const today = new Date(Date.now() - 8 * 3600_000).toISOString().slice(0, 10);
document.documentElement.dataset.season = defaultSeason(today);
const row = (id, href, t, d, tm) => `<a class="tile opt" ${id ? `id="${id}"` : ""} href="${href}"><span class="ico">${ICON[id === "o-contest" ? "contest" : id === "o-event" ? "event" : "display"]}</span><b style="font-size:20px">${t}</b><span>${d}</span><span class="tm" style="margin-top:6px;font-size:13px">${tm}</span><span class="signnote" hidden>You'll sign in first (free, no password).</span></a>`;
const qs = new URLSearchParams(location.search).get("s"), s = SEASONS[qs] ? "?s=" + esc(qs) : "";
const contestTime = "About 3 minutes";
document.getElementById("opts").innerHTML =
  row("o-event", "/add-event", "An event", "A tree lighting, parade, market, haunted house or other seasonal event.", "Free · about 1 minute") +
  row("o-contest", "/add-contest", "A contest", "Neighbors enter their homes and the community votes. You get a link and a QR code to share.", contestTime) +
  row("o-house", "/add-house" + s, "A lighting display", "Homeowners and professional installers: show your lights on the map so families can drive by.", "Free · about 2 minutes");
// The contest tile shows the lowest pass price from /api/config (the only place prices are set). Passes are bought on the website, so the app shows no price.
if (!/SoCalLightsApp/.test(navigator.userAgent)) fetch("/api/config").then((r) => r.json()).then((c) => { const p = Object.values((c.contestPasses || {}).plans || {}).map((x) => x.cents).sort((a, b) => a - b)[0]; if (p) { const t = document.querySelector("#o-contest .tm"); if (t) t.textContent = "From $" + (p % 100 ? (p / 100).toFixed(2) : p / 100) + " · about 3 minutes"; } }).catch(() => {});
// Contests need sign-in. Until Google or emailed codes are switched on, hide that choice rather than send people to a dead end.
fetch("/api/auth/me", { cache: "no-store" }).then((r) => r.json()).then((j) => { if (!j.user) document.querySelectorAll(".signnote").forEach((n) => (n.hidden = false)); if (!j.methods || (!j.methods.google && !j.methods.email)) document.getElementById("o-contest")?.remove(); }).catch(() => {});
</script>
<script src="/footer.js?v=20261111x560" defer></script>
</body>
</html>
