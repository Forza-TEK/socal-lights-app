<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoCal Lights is offline</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:400 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#222;text-align:center;padding:24px}@media(prefers-color-scheme:dark){body{background:#121212;color:#f4f4f4}}img{width:96px;height:96px;border-radius:50%}h1{font-weight:300;font-size:32px;letter-spacing:-.025em;margin:18px 0 8px}p{margin:0 0 24px;color:#6a6a6a}@media(prefers-color-scheme:dark){p{color:#a3a3a3}}button{font:500 16px inherit;font-family:inherit;border:1px solid #222;border-radius:8px;padding:14px 26px;min-height:50px;background:#222;color:#fff;cursor:pointer}@media(prefers-color-scheme:dark){button{background:#f4f4f4;color:#121212;border-color:#f4f4f4}}h2{font-size:15px;font-weight:600;margin:34px 0 10px}ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;align-items:center}a{display:inline-block;min-width:220px;padding:12px 18px;border:1px solid currentColor;border-radius:8px;color:inherit;text-decoration:none;opacity:.9}.small{font-size:13px;margin:14px 0 0}section[hidden]{display:none}</style><link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
</head>
<body><button id="th" type="button" aria-label="Switch between light and dark mode" title="Light / dark" style="position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;font-size:20px;cursor:pointer">☾</button><main><img src="/img/icon-192.png" alt=""><h1>You're offline</h1><p id="lead">SoCal Lights needs a connection to load this page.<br>Check your signal and try again.</p><button id="retry" type="button">Try again</button><section id="saved" hidden><h2>Still available on this device</h2><ul id="links"></ul><p id="when" class="small"></p></section></main><script>(function(){var d=document.documentElement,b=document.getElementById("th");function set(t){d.style.colorScheme=t;document.body.style.background=t==="dark"?"#0b0d12":"#fff";document.body.style.color=t==="dark"?"#f5f3ee":"#14161b";b.textContent=t==="dark"?"☀":"☾"}var h=new Date().getHours(),t=h>=18||h<6?"dark":"light";try{var o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o}catch(e){}set(t);b.onclick=function(){t=t==="dark"?"light":"dark";set(t);try{localStorage.setItem("socal-theme",t);localStorage.setItem("socal-theme-until",String(Date.now()+6*3600*1000))}catch(e){}}})()</script><script>(function(){
var NAMES={"/":"Map and event list","/contests":"Contests","/pricing":"Pricing","/privacy":"Privacy","/terms":"Terms","/tutorials":"Tutorials","/add":"Add something"};
function nice(p){if(NAMES[p])return NAMES[p];var m=p.match(/^\/in\/([^\/]+)$/);if(m)return"Events in "+m[1].replace(/-/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()});m=p.match(/^\/c\/([^\/]+)$/);if(m)return"Contest: "+m[1].replace(/-/g," ");m=p.match(/^\/installer\/([^\/]+)$/);if(m)return"Installer: "+m[1].replace(/-/g," ");return p.replace(/^\//,"").replace(/[-\/]/g," ")}
document.getElementById("retry").onclick=function(){location.reload()};
addEventListener("online",function(){location.reload()}); // the address bar still shows the page that was asked for, so this retries it
if(!window.caches)return;
caches.keys().then(function(ks){var k=ks.filter(function(x){return/^scl-/.test(x)}).sort().pop();return k&&caches.open(k)}).then(function(c){
 if(!c)return;return c.keys().then(function(reqs){
  var here=location.pathname,seen={},paths=[];
  reqs.forEach(function(r){var u=new URL(r.url);if(u.origin!==location.origin)return;var p=u.pathname;
   if(p===here||seen[p]||p==="/offline.html"||p.indexOf("/api/")===0||/\.[a-z0-9]+$/i.test(p))return;seen[p]=1;paths.push(p)});
  var order=Object.keys(NAMES);paths.sort(function(a,b){var i=order.indexOf(a),j=order.indexOf(b);return(i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
  var ul=document.getElementById("links");
  paths.slice(0,12).forEach(function(p){var li=document.createElement("li"),a=document.createElement("a");a.href=p;a.textContent=nice(p);li.appendChild(a);ul.appendChild(li)});
  document.getElementById("saved").hidden=!paths.length;
  return c.match("/api/events").then(function(res){var d=res&&res.headers.get("date");if(d){var t=new Date(d);if(!isNaN(t))document.getElementById("when").textContent="Event list saved "+t.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+". Dates and details may have changed since."}});
 })}).catch(function(){});
})()</script></body></html>
