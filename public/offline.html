<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoCal Lights is offline</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:400 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#222;text-align:center;padding:24px}@media(prefers-color-scheme:dark){body{background:#121212;color:#f4f4f4}}img{width:96px;height:96px;border-radius:50%}h1{font-weight:300;font-size:32px;letter-spacing:-.025em;margin:18px 0 8px}p{margin:0 0 24px;color:#6a6a6a}@media(prefers-color-scheme:dark){p{color:#a3a3a3}}button{font:500 16px inherit;font-family:inherit;border:1px solid #222;border-radius:8px;padding:14px 26px;min-height:50px;background:#222;color:#fff;cursor:pointer}@media(prefers-color-scheme:dark){button{background:#f4f4f4;color:#121212;border-color:#f4f4f4}}</style><link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
</head>
<body><button id="th" type="button" aria-label="Switch between light and dark mode" title="Light / dark" style="position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;font-size:20px;cursor:pointer">☾</button><main><img src="/img/icon-192.png" alt=""><h1>You're offline</h1><p>SoCal Lights needs a connection to show the map and events.<br>Check your signal and try again.</p><button onclick="location.reload()">Try again</button></main><script>(function(){var d=document.documentElement,b=document.getElementById("th");function set(t){d.style.colorScheme=t;document.body.style.background=t==="dark"?"#0b0d12":"#fff";document.body.style.color=t==="dark"?"#f5f3ee":"#14161b";b.textContent=t==="dark"?"☀":"☾"}var h=new Date().getHours(),t=h>=18||h<6?"dark":"light";try{var o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o}catch(e){}set(t);b.onclick=function(){t=t==="dark"?"light":"dark";set(t);try{localStorage.setItem("socal-theme",t);localStorage.setItem("socal-theme-until",String(Date.now()+6*3600*1000))}catch(e){}}})()</script></body></html>
