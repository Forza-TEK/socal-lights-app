<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Home decorating contest · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261031o">
<link rel="stylesheet" href="/contest.css?v=20261031o">
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<main class="cmain">
<div id="app"><p class="loading">Loading the contest…</p></div>
</main>
<script type="module">
import { signIn, noteSigninResult, esc, toast } from "/auth.js?v=20261030a";
import { themeBtn, mountAcct, refreshAcct } from "/addflow.js?v=20261031o";
const $ = (q) => document.querySelector(q), slug = location.pathname.split("/")[2] || "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = (s) => { const [, m, d] = s.split("-").map(Number); return MON[m - 1] + " " + d; };
const initials = (o) => (o.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "EN").toUpperCase();
let D = null;

async function load() {
  const r = await fetch(`/api/contests/${encodeURIComponent(slug)}`, { cache: "no-store" });
  if (!r.ok) { $("#app").innerHTML = `<div class="card center"><h2>We can't find that contest</h2><p class="muted">The link may be mistyped, or the contest may not be public yet.</p><a class="btn" href="/">Back to the map</a></div>`; return; }
  D = await r.json(); document.title = D.contest.name + " · SoCal Lights"; render();
}

const CROWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>';
function render() {
  const c = D.contest, me = D.me, mine = me.votes || [];
  const pills = [];
  if (c.status !== "live") pills.push(`<span class="pill p-wait">Waiting for approval</span>`);
  else if (c.announced) pills.push(`<span class="pill p-ok">Winners announced</span>`);
  else {
    pills.push(c.entriesOpen ? `<span class="pill p-ok">Entries open until ${fmt(c.entriesClose)}</span>` : `<span class="pill p-wait">Entries closed</span>`);
    pills.push(c.votingOpen ? `<span class="pill p-ok">Voting is open</span>` : new Date().toISOString().slice(0, 10) < c.voteStart ? `<span class="pill p-wait">Voting opens ${fmt(c.voteStart)}</span>` : `<span class="pill p-wait">Voting not open</span>`);
  }
  const voteIn = (cat) => mine.find((v) => v.category === cat), done = c.categories.filter(voteIn).length;
  // One ballot per category: every home is listed in every category, and a voter picks one favorite in each
  const sections = c.categories.map((cat) => {
    const my = voteIn(cat), win = new Set(D.winners[cat] || []);
    const rows = D.entries.map((e) => {
      const isMy = !!my && my.post_id === e.id;
      const label = e.mine ? "Your home" : isMy ? "Your vote ✓" : !c.votingOpen ? (c.announced ? "Voting is over" : "Voting not open") : my ? "Move my vote here" : "Vote";
      const n = e.votes ? e.votes[cat] : null;
      return `<div class="vrow${isMy ? " mine" : ""}">${e.photos[0] ? `<img src="/api/photo/${esc(e.photos[0])}" alt="${esc(e.name)} lights" loading="lazy">` : `<span class="ph"></span>`}
        <div><b>${win.has(e.id) ? CROWN + " " : ""}${esc(e.name)} ${win.has(e.id) ? '<span class="pill p-ok">Winner</span>' : ""}</b><span class="meta">${esc(e.address || e.city)}${n !== null ? ` · ${n} vote${n === 1 ? "" : "s"}` : ""}</span></div>
        <button class="btn ${isMy ? "ghost" : "org"} sm" data-vote="${esc(e.id)}" data-cat="${esc(cat)}" type="button" ${c.votingOpen && !e.mine && !isMy ? "" : "disabled"} aria-label="${esc(label)}: ${esc(e.name)}, ${esc(cat)}">${label}</button></div>`;
    }).join("");
    return `<section class="card" aria-labelledby="cat-${esc(cat.replace(/\W+/g, "-"))}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 id="cat-${esc(cat.replace(/\W+/g, "-"))}">${esc(cat)}</h2>${my ? `<span class="pill p-ok">You voted</span>` : c.votingOpen ? `<span class="pill p-wait">Pick one favorite</span>` : ""}</div>${D.entries.length ? `<div>${rows}</div>` : `<p class="muted small">No homes yet.</p>`}</section>`;
  }).join("");
  $("#app").innerHTML = `${c.status !== "live" ? `<div class="status no">This contest is waiting for approval, so only you can see it. A person usually checks within a day.</div>` : ""}
  <div class="card"><div class="banner"><div class="logo" aria-hidden="true">${esc(initials(c.org))}</div><div><b>${esc(c.name)}</b><span>${esc(c.org)} · ${esc(c.city)}</span></div></div>
  <p>${esc(c.descr)}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${pills.join("")}</div>
  <p class="small muted">Voting runs ${fmt(c.voteStart)} to ${fmt(c.voteEnd)}. Every home is in every category. You get one vote in each category.${c.votingOpen && me.signedIn ? ` You've voted in ${done} of ${c.categories.length}.` : ""}</p>
  <div class="actions">${c.status === "live" ? `<a class="btn org" href="/c/${esc(c.slug)}/enter" ${c.entriesOpen ? "" : 'aria-disabled="true" style="opacity:.55;pointer-events:none"'}>${c.entriesOpen ? "Enter my home" : "Entries are closed"}</a>` : ""}${me.isOwner ? `<a class="btn ghost" href="/c/${esc(c.slug)}/manage">Manage this contest</a>` : ""}<a class="btn ghost" href="/">See it on the map</a></div>${c.rules ? `<details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Official rules</summary><div class="small muted" style="white-space:pre-wrap;margin-top:10px">${esc(c.rules)}</div></details>` : ""}${c.announced && c.frozenAt ? `<p class="small muted">Final results, locked ${fmt(c.frozenAt)}. Winners keep their crown.</p>` : ""}</div>
  ${D.entries.length ? sections : `<div class="card"><h2>No homes yet</h2><p class="muted">Be the first to enter. Approved homes appear here, in every category, and on the map.</p></div>`}`;
  document.querySelectorAll("[data-vote]").forEach((b) => (b.onclick = () => vote(b.dataset.vote, b.dataset.cat)));
}

async function vote(id, category) {
  if (!D.me.signedIn) { const u = await signIn({ title: "Sign in to vote", next: location.pathname }); if (!u) return; await load(); refreshAcct($("#acct")); }
  const r = await fetch(`/api/contests/${encodeURIComponent(slug)}/vote`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ post_id: id, category }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.error || "Couldn't record your vote.");
  toast(j.same ? "That's already your vote." : j.moved ? `${category}: vote moved to ${j.name}` : `${category}: vote recorded for ${j.name}`);
  await load();
}
$("#tb").innerHTML = themeBtn(); mountAcct($("#acct")); noteSigninResult(); load();
</script>
</body>
</html>
