<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contests · SoCal Lights</title>
<meta name="description" content="Home decorating contests in Southern California: vote, enter, run your own, and see past results.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261031t">
<link rel="stylesheet" href="/contest.css?v=20261101f">
<style>.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.win{border:1px solid var(--line);border-radius:12px;overflow:hidden}.win .ph{height:130px;background:var(--tile)}.win img{width:100%;height:100%;object-fit:cover;display:block}.win .b{padding:12px 14px;display:grid;gap:2px}.win .m{color:var(--muted);font-size:14px}.win b{font-weight:500}.entries{display:grid}.entry{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:10px}.entry:first-child{border-top:0}.eh{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}.eh img,.eh .ph{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--tile);display:block}.eh b{font-weight:500;display:block}.eh .m{color:var(--muted);font-size:14px;display:block}.res{display:grid;gap:4px;padding-left:78px}.rline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}@media(max-width:520px){.res{padding-left:0}}.tabsrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabsrow button{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:500;cursor:pointer}.tabsrow button[aria-selected=true]{background:var(--season);border-color:var(--season);color:var(--on-season,#fff)}.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}</style>
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<main class="cmain wide">
<div class="ctop"><div><h1>Contests</h1><p class="help" style="margin-top:8px">Vote for your favorite home, enter your own, or run a contest for your neighborhood.</p></div><a class="btn org" href="/add-contest">Start a contest</a></div>
<div class="tabsrow" role="tablist" aria-label="Contests"><button type="button" role="tab" data-tab="live">Live now</button><button type="button" role="tab" data-tab="mine">Mine</button><button type="button" role="tab" data-tab="past">Past results</button></div>
<div id="live" hidden></div><div id="mine" hidden></div><div id="past" hidden></div>
</main>
<script type="module">
import { me, signIn, esc } from "/auth.js?v=20261101a";
import { themeBtn, mountAcct, refreshAcct } from "/addflow.js?v=20261031z";
const $ = (q) => document.querySelector(q);
const CROWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>';
$("#tb").innerHTML = themeBtn(); mountAcct($("#acct"));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], fmt = (s) => { const [, m, d] = String(s).split("-").map(Number); return MON[m - 1] + " " + d; };
const TABS = ["live", "mine", "past"], loaded = {};
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "live";
function show(t) {
  tab = t; history.replaceState(null, "", "#" + t);
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  for (const k of TABS) $("#" + k).hidden = k !== t;
  if (!loaded[t]) { loaded[t] = true; ({ live: loadLive, mine: loadMine, past: loadPast })[t](); }
}
document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => show(b.dataset.tab)));

// Live now: every live contest, with what you can do in it today
async function loadLive() {
  const box = $("#live"); box.innerHTML = `<p class="loading">Loading…</p>`;
  const L = await fetch("/api/contests").then((r) => r.json()).catch(() => []);
  const open = L.filter((c) => !c.announced);
  box.innerHTML = open.length ? open.map((c) => `<section class="card"><div><h2>${esc(c.name)}</h2><p class="muted small">${esc(c.org)} · ${esc(c.city)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill ${c.entriesOpen ? "p-ok" : "p-wait"}">${c.entriesOpen ? "Entries open until " + fmt(c.entries_close) : "Entries closed"}</span><span class="pill ${c.votingOpen ? "p-ok" : "p-wait"}">${c.votingOpen ? "Voting open until " + fmt(c.vote_end) : "Voting " + (c.vote_start > new Date().toISOString().slice(0, 10) ? "opens " + fmt(c.vote_start) : "closed")}</span></div><div class="actions"><a class="btn org" href="/c/${esc(c.slug)}">${c.votingOpen ? "Vote" : "See the contest"}</a>${c.entriesOpen ? `<a class="btn ghost" href="/c/${esc(c.slug)}/enter">Enter my home</a>` : ""}</div></section>`).join("")
    : `<div class="card"><h2>No contests are running right now</h2><p class="muted">Want one in your neighborhood, school or HOA? It takes about a minute.</p><div class="actions"><a class="btn org" href="/add-contest">Start a contest</a></div></div>`;
}

// Mine: contests you run or help run, and homes you entered
async function loadMine() {
  const box = $("#mine"), i = await me();
  if (!i.user) { box.innerHTML = `<div class="card center"><h2>Sign in to see your contests</h2><p class="muted">Contests you run, help run or entered show up here.</p><button class="btn org" type="button" id="go">Sign in</button></div>`; $("#go").onclick = async () => { if (await signIn({ title: "Sign in to see your contests", next: "/contests#mine" })) { refreshAcct($("#acct")); loaded.mine = false; show("mine"); } }; return; }
  const o = await fetch("/api/me/overview", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (!o) { box.innerHTML = `<div class="card"><p class="muted">Couldn't load your contests. Try again in a moment.</p></div>`; return; }
  const st = (c) => (c.announced ? "Winners announced" : c.status === "pending" ? "Waiting for approval" : c.status === "live" ? "Live" : "Ended");
  box.innerHTML = `<section class="card"><h2>Contests you run</h2>${o.contests.length ? `<div class="list">${o.contests.map((c) => `<div class="rowi"><div><b>${esc(c.name)}</b><br><span class="small muted">${st(c)}${c.role === "staff" ? " · co-organizer" : ""}${c.waiting ? ` · <b>${c.waiting} waiting for your OK</b>` : ""}</span></div><div class="acts"><a class="btn sm" href="/c/${esc(c.slug)}/manage">Manage</a><a class="btn ghost sm" href="/c/${esc(c.slug)}">View</a></div></div>`).join("")}</div>` : `<p class="muted">You aren't running a contest yet.</p>`}<div class="actions"><a class="btn org" href="/add-contest">Start a contest</a></div></section>
  <section class="card"><h2>Homes you entered</h2>${o.entries.length ? `<div class="list">${o.entries.map((e) => `<div class="rowi"><div><b>${esc(e.title || e.biz)}</b><br><span class="small muted">${esc(e.contest)} · ${e.status === "approved" ? "On the map" : e.status === "pending" ? "Waiting for the organizer" : "Not accepted"}</span></div><div class="acts"><a class="btn ghost sm" href="/c/${esc(e.slug)}">Open contest</a></div></div>`).join("")}</div>` : `<p class="muted">You haven't entered a contest. Open one under Live now, or scan a contest's QR code.</p>`}</section>`;
}

// Past results: the season and year archive
let ALL = [], sel = "";
async function loadPast() {
  const app = $("#past"); app.innerHTML = `<p class="loading">Loading…</p>`;
  ALL = await fetch("/api/archive").then((r) => r.json()).catch(() => []);
  if (!ALL.length) { app.innerHTML = `<div class="card"><h2>No finished contests yet</h2><p class="muted">When a contest announces its winners, it appears here by season and year.</p></div>`; return; }
  const labels = [...new Set(ALL.map((c) => c.label))]; sel = labels.includes(sel) ? sel : labels[0]; draw(labels);
}
const rows = (c) => c.entries.map((e) => {
  const won = (cat) => e.won.filter((w) => w.category === cat);
  const line = (r) => { const parts = []; if (c.mode !== "judges") parts.push(`${r.votes ?? 0} vote${r.votes === 1 ? "" : "s"}`); if (c.mode !== "public") parts.push(c.method === "score" ? (r.judges && r.judges.n ? `judges ${Number(r.judges.avg).toFixed(1)} avg (${r.judges.n})` : "no scores") : `${r.judges || 0} judge pick${r.judges === 1 ? "" : "s"}`); const w = won(r.category).length;
    return `<div class="rline"><span>${w ? CROWN + " " : ""}${esc(r.category)}</span><span class="muted">${parts.join(" · ")}${w ? " · " + won(r.category).map((x) => esc(x.label)).join(", ") : ""}</span></div>`; };
  return `<div class="entry"><div class="eh">${e.photo ? `<img src="/api/photo/${esc(e.photo)}" alt="${esc(e.name)} lights" loading="lazy">` : `<span class="ph"></span>`}<div><b>${e.won.length ? CROWN + " " : ""}${esc(e.name)}</b><span class="m">${esc(e.address || e.city || "")}${e.dq ? " · Disqualified" : ""}</span></div></div><div class="res">${e.results.map(line).join("")}</div></div>`;
}).join("");
function draw(labels) {
  const cs = ALL.filter((c) => c.label === sel);
  $("#past").innerHTML = `<div class="field" style="max-width:340px"><label for="arch">Season | Year</label><select class="in" id="arch">${labels.map((l) => `<option ${l === sel ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
  ${cs.map((c) => `<section class="card"><div><h2>${esc(c.name)}</h2><p class="muted small">${esc(c.org)} · ${esc(c.city)} · ${c.entries.length} contestant${c.entries.length === 1 ? "" : "s"} · results locked ${esc(c.at)}</p></div>
    ${c.awards.length ? `<div><h3 style="margin-bottom:10px">Winners</h3><div class="wins">${c.awards.map((a) => a.winners.map((w) => `<div class="win"><div class="ph">${w.photo ? `<img src="/api/photo/${esc(w.photo)}" alt="${esc(w.name)} lights" loading="lazy">` : ""}</div><div class="b"><span class="small" style="display:flex;gap:6px;align-items:center">${CROWN} ${esc(a.category)}</span><span class="m">${esc(a.label)}</span><b>${esc(w.name)}</b><span class="m">${esc(w.address || w.city || "")}</span>${a.prize ? `<span class="m" style="margin-top:6px">Prize: ${esc(a.prize)}</span>` : ""}</div></div>`).join("")).join("")}</div></div>` : ""}
    <div><h3 style="margin-bottom:6px">All contestants and results</h3>${c.entries.length ? `<div class="entries">${rows(c)}</div>` : `<p class="muted">No contestants.</p>`}</div>
    <div><a class="btn ghost sm" href="/c/${esc(c.slug)}">See the full contest</a></div></section>`).join("")}`;
  $("#arch").onchange = (e) => { sel = e.target.value; draw(labels); };
}
show(tab);
</script>
</body>
</html>
