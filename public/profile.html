<script type="module">
import { me, signIn, signOut, noteSigninResult, toast } from "/auth.js?v=20261101a";

document.getElementById("tb").innerHTML = themeBtn();
const $ = (q) => document.querySelector(q), app = $("#app"), cities = Object.keys(CITY).sort();
const KEYS = { house: "scl-house-draft", event: "scl-event-draft", contest: "scl-contest-draft" }, PAGE = { house: "/add-house", event: "/add-event", contest: "/add-contest" }, LABEL = { house: "Lighting display", event: "Event", contest: "Contest", entry: "Contest entry" }, dpage = (d) => (d.kind === "entry" ? (d.slug ? `/c/${d.slug}/enter` : "/add") : PAGE[d.kind] || "/add");
const when = (s) => { try { return new Date(String(s).replace(" ", "T") + "Z").toLocaleDateString("en-US", { month: "short", day: "numeric" }); } catch { return ""; } };

// After Google sign-in comes back with ?save=<kind>, move the draft kept on this device into the account
async function syncLocal() {
  const qs = new URLSearchParams(location.search), kind = qs.get("save"), key = kind === "entry" && /^[a-z0-9-]{1,80}$/.test(qs.get("c") || "") ? "scl-entry-draft-" + qs.get("c") : KEYS[kind]; if (!key) return;
  try {
    const sv = JSON.parse(localStorage.getItem(key) || "null");
    if (sv && sv.d) {
      const c = { ...sv.d }; delete c._draftId; const id = sv.d._draftId;
      const r = await fetch("/api/drafts", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, kind, title: sv.d.title || sv.d.biz || sv.d.name || "", data: c, step: sv.i || 0 }) });
      if (r.ok) { localStorage.removeItem(key); toast("Draft saved to your profile."); }
    }
  } catch {}
  history.replaceState(null, "", "/profile");
}
const head = (h, add) => `<div class="sechead"><h2>${h}</h2>${add ? `<a class="btn out sm" href="${add[1]}">${add[0]}</a>` : ""}</div>`;
const fld = (k, l, v, ex = "") => `<label class="mf"><span>${l}</span><input data-k="${k}" value="${esc(v ?? "")}" ${ex}></label>`;

// A home you posted: edit, take down for the season, put back
const ago = (at) => { const t = new Date(String(at || "").replace(" ", "T") + "Z").getTime(), m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
// The installer and the homeowner share a listing: say so, and show who changed which field
const sharedLine = (h) => (h.inst ? `<div class="small" style="margin-top:4px">${h.inst.ok ? `Shared with <a href="/installer/${esc(h.inst.slug)}">${esc(h.inst.name)}</a>, who can edit it too and is emailed when you change it.` : `Waiting for <a href="/installer/${esc(h.inst.slug)}">${esc(h.inst.name)}</a> to confirm. Once they do, you both can edit this listing.`}</div>` : "") + (h.changes && h.changes[0] ? `<div class="small chgnote">Last change: <b>${esc(h.changes[0].by_name || "Someone")}</b> changed <b>${esc(h.changes[0].field)}</b> · ${esc(ago(h.changes[0].at))}</div>` : "");
const chgList = (cs) => (cs && cs.length ? `<div class="chgbox"><b>Recent changes</b><ul class="chg">${cs.map((c) => `<li><span class="who">${esc(c.by_name || "Someone")}</span> changed <b>${esc(c.field)}</b>: <span class="was">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")} <span class="muted">· ${esc(ago(c.at))}</span></li>`).join("")}</ul></div>` : "");
function homeRow(h) {
  const st = h.status === "approved" ? ["live", "On the map"] : h.status === "paused" ? ["", "Taken down for the season"] : h.status === "pending" ? ["warn", "In review"] : ["", h.status];
  const pro = h.poster_type === "installer";
  return `<div class="rowi mrow" data-home="${esc(h.id)}"><div><b>${esc(h.title || h.biz)}</b><br><span class="small muted">${esc(h.city || "")} · ${dot(h.status, st)}</span>${sharedLine(h)}</div>
   <div class="acts">${h.status === "approved" || h.status === "paused" ? `<button class="btn out sm" type="button" data-medit>Edit</button><button class="btn out sm" type="button" data-hact="${h.status === "paused" ? "resume" : "pause"}">${h.status === "paused" ? "Put back on the map" : "Take down for the season"}</button>` : ""}</div>
   <form class="mform" hidden>${fld("title", "Display name", h.title, 'maxlength="90"')}<label class="mf"><span>About it</span><textarea data-k="desc" rows="3" maxlength="1200">${esc(h.descr || "")}</textarea></label>${fld("where", "Tips for visitors", h.where_txt, 'maxlength="120"')}
    ${fld("lights_on", "Lights are on", h.lights_on, 'maxlength="60" placeholder="e.g. 5 to 10 pm nightly"')}${sel("visit", "How to see it", h.visit || "", [["", "Not sure"], ["drive", "Drive by"], ["walk", "Walk by"], ["both", "Drive or walk"]])}${sel("parking", "Parking", h.parking || "", [["", "Not listed"], ["free", "Free parking nearby"], ["street", "Street parking"], ["none", "Hard to park"]])}

    ${pro ? fld("web", "Website", h.web, 'maxlength="200"') + fld("phone", "Phone for quotes", h.phone, 'maxlength="80"') + fld("area", "Service area", h.service_area, 'maxlength="120"') : ""}
    ${chgList(h.changes)}<p class="err" role="alert" hidden></p><div class="acts"><button class="btn sm" type="submit">Save</button><button class="btn out sm" type="button" data-mcancel>Cancel</button></div></form></div>`;
}
// An event you added: edit, cancelled or postponed tag, run again next year

}
const list = (rows, empty) => (rows.length ? `<div class="list">${rows.join("")}</div>` : `<p class="muted">${empty}</p>`);

function panel() {

    const sh = (s) => bs.filter((b) => on(b.id, s)), l = sh("list"), pp = sh("popup"), d = sh("detail"), t = esc(O.user.name || "Your home");
    return head("Badges") + `<p class="muted" style="margin-top:-8px">Winners keep a crown. Choose where your badges show on your listings. They are on everywhere by default.</p>
      <label class="chk"><input type="checkbox" data-bpm ${BD.master ? "checked" : ""}> <span>Show my badges on my listings</span></label>
      <div class="list">${bs.map((b) => `<div><div style="display:flex;gap:10px;align-items:flex-start">${CR(18)}<div><b style="font-weight:500">${esc(b.a)} · ${esc(b.k)}</b><br><span class="muted small">${esc(b.s)} · ${esc(b.c)}</span></div></div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px">${[["list", "List card"], ["popup", "Map pop-up"], ["detail", "Details page"]].map(([k, lb]) => `<label class="chk" style="font-size:14px"><input type="checkbox" data-bp="${esc(b.id)}|${k}" ${on(b.id, k) ? "checked" : ""} ${BD.master ? "" : "disabled"}> <span>${lb}</span></label>`).join("")}</div></div>`).join("")}</div>
      <h3 style="margin-top:8px">How it looks</h3><div class="surfs"><div><span class="muted small">List card</span><div class="bcard"><div class="ph">${l.length ? `<span class="bpill" role="img" aria-label="Past contest winner">${CR(18)}</span>` : ""}</div><div class="b"><b>${t}</b><span class="muted small">Your address</span></div></div></div>
      <div><span class="muted small">Map pop-up</span><div class="popc"><div class="pi"></div><div><b>${pp.length ? CR(15) + " " : ""}${t}</b>${pp.length ? `<span class="m">${esc(pp[0].a)} · ${esc(pp[0].s)}${pp.length > 1 ? " +" + (pp.length - 1) : ""}</span>` : ""}</div></div></div>
      <div><span class="muted small">Details page</span><div class="detc"><b>${t}</b>${d.map((b) => `<div class="bline">${CR(18)}<div><b>${esc(b.a)} · ${esc(b.k)}</b><span class="m">${esc(b.s)} · ${esc(b.c)}</span></div></div>`).join("") || '<span class="muted small">No badge shown here.</span>'}</div></div></div>`;
  }
  // account
  const pf = { name: u.name || "", street: u.street || "", city: u.city || "", zip: u.zip || "" };
  return head("Account") + `<p class="muted" style="margin-top:-8px">Your name and address are optional. We use them to fill in forms for you; they are never shown publicly.</p>
    <form id="pform" class="main" style="padding:0;gap:18px;max-width:none" novalidate>${input(pf, "name", { label: "Name", opt: true, max: 80, ac: "name", ph: "Your name" })}${select(pf, "city", cities.map((c) => [c, c]), { label: `City ${OPT}`, blank: "Choose a city", ac: "address-level2" })}${input(pf, "street", { label: "Street address", opt: true, max: 120, ac: "address-line1", ph: "e.g. 27 Via Alicia", addr: true })}${input(pf, "zip", { label: "ZIP", opt: true, max: 5, mode: "numeric", ac: "postal-code", ph: "92692" })}
    <p class="err" id="perr" role="alert" hidden></p><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit">Save</button><span class="muted small" id="pok" role="status"></span></div></form>
    <div style="margin-top:8px"><button class="btn out" id="so" type="button">Sign out</button></div>
    <section style="margin-top:12px"><h2>Delete my account</h2><p class="muted small" id="delmsg">Deletes your account, saved drafts, profile picture, contest entries and votes, closes contests you run, and removes your email from homes and events you posted. This can't be undone.</p><p class="err" id="delerr" role="alert" hidden></p><div style="margin-top:10px"><button class="btn out" id="delacct" type="button" style="color:var(--bad);border-color:var(--bad)">Delete my account</button></div></section><p class="small muted">Homes and events are matched by the email you typed on the form.</p>`;
}

function render() {
  const o = O, em = o.user.email, n = { badges: BD.badges.length, drafts: o.drafts.length, contests: o.contests.length, entries: o.entries.length, displays: o.homes.length, events: o.events.length };
  const T = [["drafts", "Drafts"], ["contests", "Contests"], ["displays", "Displays"], ["events", "Events"], ...(BD.badges.length ? [["badges", "Badges"]] : []), ["account", "Account"]];
  if (!T.some((t) => t[0] === tab)) tab = "drafts";
  app.innerHTML = `<div class="who"><span class="avatar" aria-hidden="true">${info && info.user && info.user.avatar ? `<img src="${esc(info.user.avatar)}" alt="">` : esc((o.user.name || em)[0].toUpperCase())}</span><div><h1 style="font-size:clamp(26px,5vw,34px)">${esc(o.user.name || "Your profile")}</h1><span class="muted">${esc(em)}</span><div style="display:flex;gap:14px;margin-top:6px"><label class="link" for="avfile" style="font-size:14px;cursor:pointer">${info && info.user && info.user.avatar ? "Change photo" : "Add a photo"}</label>${info && info.user && info.user.avatar ? '<button class="link" id="avrm" type="button" style="font-size:14px">Remove</button>' : ""}<input id="avfile" type="file" accept="image/*" hidden></div><div style="margin-top:8px"><button class="link" id="editprof" type="button" style="font-size:14px">Edit name &amp; address</button></div><p class="err" id="averr" role="alert" hidden></p></div></div>
    <div class="ptabs2" role="tablist">${T.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}${n[k] ? `<span class="cnt">${n[k]}</span>` : ""}</button>`).join("")}</div>
    <section id="pp">${panel()}</section>`;
  wire();
}
function wire() {
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "#" + tab); render(); }));
  app.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; } await fetch("/api/drafts/" + b.dataset.del, { method: "DELETE" }); load(); }));
  const ep = $("#editprof"); if (ep) ep.onclick = () => { tab = "account"; history.replaceState(null, "", "#account"); render(); window.scrollTo(0, 0); };
  const da = $("#delacct"); if (da) da.onclick = async () => {
    if (!da.dataset.sure) { da.dataset.sure = "1"; da.textContent = "Tap again to permanently delete"; return; }
    da.disabled = true; const r = await fetch("/api/me", { method: "DELETE" });
    if (!r.ok) { const j = await r.json().catch(() => ({})); const er = $("#delerr"); er.textContent = j.error || "Couldn't delete your account. Try again."; er.hidden = false; da.disabled = false; return; }
    location.href = "/?deleted=1";

  app.querySelectorAll("[data-bp]").forEach((c) => (c.onchange = async () => { if (c.checked) delete BD.off[c.dataset.bp]; else BD.off[c.dataset.bp] = true; await save(); render(); }));
  // manage my displays and events
  const post = async (url, body) => { const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "That didn't work."); return j; };
  app.querySelectorAll(".mrow").forEach((row) => {
    const f = row.querySelector(".mform"), er = f && f.querySelector(".err");
    const openF = row.querySelector("[data-medit]"); if (openF) openF.onclick = () => { f.hidden = !f.hidden; };
    const cl = row.querySelector("[data-mcancel]"); if (cl) cl.onclick = () => { f.hidden = true; };
    const collect = () => { const o = {}; f.querySelectorAll("[data-k]").forEach((el) => (o[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value)); return o; };
    if (row.dataset.home) {
      f.onsubmit = async (e) => { e.preventDefault(); er.hidden = true; try { await post("/api/me/homes/" + row.dataset.home, { action: "edit", ...collect() }); toast("Saved."); load(); } catch (x) { er.textContent = x.message; er.hidden = false; } };
      row.querySelectorAll("[data-hact]").forEach((b) => (b.onclick = async () => { try { await post("/api/me/homes/" + row.dataset.home, { action: b.dataset.hact }); toast(b.dataset.hact === "pause" ? "Taken down. Put it back any time." : "Back on the map."); load(); } catch (x) { toast(x.message); } }));
    } else {
      f.onsubmit = async (e) => { e.preventDefault(); er.hidden = true; try { await post("/api/me/events/" + row.dataset.ev, { action: "edit", ...collect() }); toast("Saved."); load(); } catch (x) { er.textContent = x.message; er.hidden = false; } };
      const nt = row.querySelector("[data-notice]"); if (nt) nt.onchange = async () => { try { await post("/api/me/events/" + row.dataset.ev, { action: "notice", notice: nt.value }); toast(nt.value ? "Tag added to the event." : "Tag removed."); load(); } catch (x) { toast(x.message); } };
      const cp = row.querySelector("[data-ecopy]"); if (cp) cp.onclick = async () => { if (!cp.dataset.sure) { cp.dataset.sure = "1"; cp.textContent = "Tap again: copy to next year"; return; } try { await post("/api/me/events/" + row.dataset.ev, { action: "copy" }); toast("Copied. Edit the new dates when you know them."); load(); } catch (x) { toast(x.message); } };
    }

    attachAddress(pf, { getCity: () => $("#f-city").value, onPick: (s) => { $("#f-street").value = s.street; if (cities.includes(s.city)) $("#f-city").value = s.city; if (/^\d{5}/.test(s.zip)) $("#f-zip").value = s.zip.slice(0, 5); } });

      if (!r.ok) { er.textContent = j.error || "Couldn't save that."; er.hidden = false; return; }
      O.user = { ...O.user, name: $("#f-name").value.trim(), street: $("#f-street").value.trim(), city: $("#f-city").value, zip: $("#f-zip").value.trim() }; ok.textContent = "Saved."; const h = app.querySelector("h1"); if (h) h.textContent = O.user.name || "Your profile"; await me(true);
    };
  }
  // profile picture: cropped to a 256px square on this device, then uploaded
  const av = $("#avfile"); if (av) av.onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return; const er = $("#averr"); er.hidden = true;
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: "from-image" }), s = Math.min(bmp.width, bmp.height), c = document.createElement("canvas"); c.width = c.height = 256;
      c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 256, 256);
      const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", 0.85));
      const r = await fetch("/api/me/avatar", { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob }), j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Couldn't save that photo."); load();
    } catch (x) { er.textContent = x.message || "That photo couldn't be read. Try a JPG or PNG."; er.hidden = false; }
  };
  const rm = $("#avrm"); if (rm) rm.onclick = async () => { await fetch("/api/me/avatar", { method: "DELETE" }); load(); };
}
