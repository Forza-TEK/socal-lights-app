// After Google sign-in comes back with ?save=<kind>, move the draft kept on this device into the account
async function syncLocal() {

    const sv = JSON.parse(localStorage.getItem(key) || "null");
    if (sv && sv.d) {
      const c = { ...sv.d }; delete c._draftId; const id = sv.d._draftId;

      <h3 style="margin-top:8px">How it looks</h3><div class="surfs"><div><span class="muted small">List card</span><div class="bcard"><div class="ph">${l.length ? `<span class="bpill" role="img" aria-label="Past contest winner">${CR(18)}</span>` : ""}</div><div class="b"><b>${t}</b><span class="muted small">Your address</span></div></div></div>

// Delete with a clear confirmation and a short Undo. First tap: the button names what will go and a line says it is for good. Second tap: the row disappears and an Undo bar shows for 8 seconds.
// The delete request is sent only when that time runs out (or the page is left), so Undo really brings it back: the database has no soft delete, so nothing is removed before then.
const UNDO_MS = 8000, pendingDeletes = new Set();
const undos = Object.assign(document.createElement("div"), { id: "undos", className: "undos" }); document.body.appendChild(undos);
addEventListener("pagehide", () => pendingDeletes.forEach((send) => send(true)));
function confirmDelete(btn, { name, row, url, extra = "" }) {
  let note = row.querySelector(":scope > .delnote");
  if (!note) { note = document.createElement("p"); note.className = "delnote small"; note.setAttribute("role", "status"); row.appendChild(note); }
  const reset = () => { clearTimeout(btn._t); delete btn.dataset.sure; if (btn.dataset.label) btn.textContent = btn.dataset.label; note.textContent = ""; note.hidden = true; };
  if (!btn.dataset.sure) {
    btn.dataset.sure = "1"; btn.dataset.label = btn.textContent;
    btn.textContent = "Tap again to delete “" + (name.length > 28 ? name.slice(0, 27) + "…" : name) + "”";
    note.textContent = `This deletes “${name}”${extra} for good. After you tap again you have a few seconds to undo it, then it cannot be undone.`; note.hidden = false;
    btn._t = setTimeout(reset, 8000); return;
  }
  clearTimeout(btn._t); row.hidden = true;
  const bar = document.createElement("div"); bar.className = "undobar"; bar.setAttribute("role", "status");
  bar.innerHTML = `<span>Deleted “${esc(name)}”.</span><button class="link" type="button">Undo</button>`; undos.appendChild(bar);
  let done = false, timer = 0;
  const send = async (leaving) => {
    if (done) return; done = true; clearTimeout(timer); pendingDeletes.delete(send); bar.remove();
