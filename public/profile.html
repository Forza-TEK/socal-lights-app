<script type="module">
import { me, signIn, signOut, noteSigninResult, toast } from "/auth.js?v=20261107p";

const shell = mountShell({ page: "prof", title: "Your profile", active: (location.hash || "").slice(1) || "drafts", items: [{ k: "drafts", label: "Drafts", icon: "file" }, { k: "contests", label: "Contests", icon: "trophy" }, { k: "displays", label: "Displays", icon: "home" }, { k: "events", label: "Events", icon: "cal" }, { k: "badges", label: "Badges", icon: "star", hidden: true }, { k: "account", label: "Account", icon: "user" }, { k: "tutorials", label: "Tutorials", icon: "play", href: "/tutorials" }], onPick: (k) => { tab = k; history.replaceState(null, "", "#" + k); render(); window.scrollTo(0, 0); } });
const $ = (q) => document.querySelector(q), app = $("#app"), cities = Object.keys(CITY).sort();
const KEYS = { house: "scl-house-draft", event: "scl-event-draft", contest: "scl-contest-draft" }, PAGE = { house: "/add-house", event: "/add-event", contest: "/add-contest" }, LABEL = { house: "Lighting display", event: "Event", contest: "Contest", entry: "Contest entry" }, dpage = (d) => (d.kind === "entry" ? (d.slug ? `/c/${d.slug}/enter` : "/add") : PAGE[d.kind] || "/add");
const when = (s) => { try { return new Date(String(s).replace(" ", "T") + "Z").toLocaleDateString("en-US", { month: "short", day: "numeric" }); } catch { return ""; } };
const stat = { approved: ["live", "Live"], published: ["live", "Live"], live: ["live", "Live"], pending: ["warn", "In review"], declined: ["", "Declined"], closed: ["", "Ended"] };
const dot = (s, over) => { const [c, l] = over || stat[s] || ["", s]; return `<span class="dot ${c}"></span>${esc(l)}`; };
let O = null, NL = { optin: null, config: null }, BD = { badges: [], master: true, off: {} }, tab = (location.hash || "").slice(1) || "drafts";

// After Google sign-in comes back with ?save=<kind>, move the draft kept on this device into the account
async function syncLocal() {
  const qs = new URLSearchParams(location.search), kind = qs.get("save"), key = kind === "entry" && /^[a-z0-9-]{1,80}$/.test(qs.get("c") || "") ? "scl-entry-draft-" + qs.get("c") : KEYS[kind]; if (!key) return;
  try {
    const sv = JSON.parse(localStorage.getItem(key) || "null");
    if (sv && sv.d) {
      const c = { ...sv.d }; delete c._draftId; const id = sv.d._draftId;
      const r = await fetch("/api/drafts", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, kind, title: sv.d.title || sv.d.biz || sv.d.name || "", data: c, step: sv.i || 0 }) });
      if (r.ok) { localStorage.removeItem(key); toast("Draft saved to your profile."); }
    }
  } catch {}
  history.replaceState(null, "", "/profile");
}
const head = (h, add) => `<div class="sechead"><h2>${h}</h2>${add ? `<a class="btn out sm" href="${add[1]}">${add[0]}</a>` : ""}</div>`;
const fld = (k, l, v, ex = "") => `<label class="mf"><span>${l}</span><input data-k="${k}" value="${esc(v ?? "")}" ${ex}></label>`;
const sel = (k, l, v, opts) => `<label class="mf"><span>${l}</span><select data-k="${k}">${opts.map(([a, b]) => `<option value="${a}" ${String(v) === a ? "selected" : ""}>${b}</option>`).join("")}</select></label>`;
// A home you posted: edit, take down for the season, put back
const ago = (at) => { const t = new Date(String(at || "").replace(" ", "T") + "Z").getTime(), m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
// The installer and the homeowner share a listing: say so, and show who changed which field
const sharedLine = (h) => (h.inst ? `<div class="small" style="margin-top:4px">${h.inst.ok ? `Shared with <a href="/installer/${esc(h.inst.slug)}">${esc(h.inst.name)}</a>, who can edit it too and is emailed when you change it.` : `Waiting for <a href="/installer/${esc(h.inst.slug)}">${esc(h.inst.name)}</a> to confirm. Once they do, you both can edit this listing.`}</div>` : "") + (h.changes && h.changes[0] ? `<div class="small chgnote">Last change: <b>${esc(h.changes[0].by_name || "Someone")}</b> changed <b>${esc(h.changes[0].field)}</b> · ${esc(ago(h.changes[0].at))}</div>` : "");
const chgList = (cs) => (cs && cs.length ? `<div class="chgbox"><b>Recent changes</b><ul class="chg">${cs.map((c) => `<li><span class="who">${esc(c.by_name || "Someone")}</span> changed <b>${esc(c.field)}</b>: <span class="was">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")} <span class="muted">· ${esc(ago(c.at))}</span></li>`).join("")}</ul></div>` : "");
function homeRow(h) {
  const st = h.status === "approved" ? ["live", "On the map"] : h.status === "paused" ? ["", "Taken down for the season"] : h.status === "pending" ? ["warn", "In review"] : ["", h.status];
  const pro = h.poster_type === "installer";
  return `<div class="rowi mrow" data-home="${esc(h.id)}"><div><b>${esc(h.title || h.biz)}</b><br><span class="small muted">${esc(h.city || "")} · ${dot(h.status, st)}</span>${sharedLine(h)}</div>
   <div class="acts">${h.status === "approved" || h.status === "paused" ? `<button class="btn out sm" type="button" data-medit>Edit</button><button class="btn out sm" type="button" data-hact="${h.status === "paused" ? "resume" : "pause"}">${h.status === "paused" ? "Put back on the map" : "Take down for the season"}</button><button class="btn out sm danger" type="button" data-hdel>Delete</button>` : ""}</div>
   ${homeForm(h, { pro, changes: chgList(h.changes) })}</div>`;
}
// A contest you run or help run: where it stands, and the buttons for it
const dshort = (iso) => { try { return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }); } catch { return ""; } };
function contestRow(c) {
  const st = c.announced ? ["", "Winners announced"] : c.status === "live" ? ["live", "Live"] : c.status === "pending" ? ["warn", "In review"] : c.status === "declined" ? ["", "Taken off the map"] : ["", c.status];
  return `<div class="rowi"><div><b>${esc(c.name)}</b><br><span class="small muted">${c.role === "owner" ? "You run it" : "You help run it"} · ${dot(c.status, st)}${c.vote_start ? ` · Voting ${dshort(c.vote_start)} to ${dshort(c.vote_end)}` : ""}${c.waiting ? ` · <span class="waitnote">${c.waiting} ${c.waiting === 1 ? "entry" : "entries"} waiting for you</span>` : ""}</span></div>
   <div class="acts"><a class="btn out sm" href="/c/${esc(c.slug)}/manage">Manage</a><a class="btn out sm" href="/c/${esc(c.slug)}">View page</a></div></div>`;
}
// A home you entered in someone's contest
function entryRow(e) {
  const st = e.status === "approved" ? ["live", "In the contest"] : e.status === "pending" ? ["warn", "Waiting for the organizer"] : e.status === "declined" ? ["", "Not accepted"] : ["", e.status];
  return `<div class="rowi"><div><b>${esc(e.title || e.biz)}</b><br><span class="small muted">${esc(e.contest)} · ${dot(e.status, st)}</span></div>
   <div class="acts"><a class="btn out sm" href="/c/${esc(e.slug)}">Open contest</a></div></div>`;
}
// An event you added: edit, cancelled or postponed tag, run again next year
function eventRow(e) {
  const live = e.status === "published" && e.event_id;
  const st = live ? ["live", e.notice === "cancelled" ? "Cancelled" : e.notice === "postponed" ? "Postponed" : "On the map"] : e.status === "pending" ? ["warn", "In review"] : ["", e.status];
  return `<div class="rowi mrow" data-ev="${esc(e.id)}"><div><b>${esc(e.name)}</b><br><span class="small muted">${esc(e.city)} · ${esc(e.start_date)}${e.end_date !== e.start_date ? " to " + esc(e.end_date) : ""} · ${dot(e.status, st)}</span></div>
   <div class="acts">${live ? `<button class="btn out sm" type="button" data-medit>Edit</button><select class="btn out sm" data-notice aria-label="Event notice"><option value="">No notice</option><option value="cancelled" ${e.notice === "cancelled" ? "selected" : ""}>Cancelled</option><option value="postponed" ${e.notice === "postponed" ? "selected" : ""}>Postponed</option></select>` : ""}${e.status === "published" || e.status === "pending" ? `<button class="btn out sm" type="button" data-ecopy>Run again next year</button><button class="btn out sm danger" type="button" data-edel>Delete</button>` : ""}</div>
   ${eventForm(e)}</div>`;
}
const list = (rows, empty) => (rows.length ? `<div class="list">${rows.join("")}</div>` : `<p class="muted pempty">${empty}</p>`);

// Monthly update: a separate, optional permission. The box is never checked for anyone who has not chosen it. Turning it on needs a role; topics are optional.
function nlTopics(role, picked) {
  const r = NL.config && NL.config.roles.find((x) => x.id === role);
  return r ? r.topics.map((t) => `<label class="chk"><input type="checkbox" data-nl-topic="${esc(t.id)}" ${picked.includes(t.id) ? "checked" : ""}> <span>${esc(t.label)}</span></label>`).join("") : '<p class="muted small">Pick one above to see the topics.</p>';
}
function nlSection() {
  if (!NL.config) return "";
  const o = NL.optin, on = !!(o && o.active), role = on ? o.role : "";
  return `<section id="nlsec" style="margin-top:12px"><h2>Monthly update</h2><p class="muted small" style="margin-top:-6px">One short email a month with seasonal recommendations. It is separate from your account and your listings, and it stays off unless you turn it on.</p>
    <label class="chk"><input type="checkbox" data-nl-on ${on ? "checked" : ""}> <span>Email me a monthly update with seasonal recommendations</span></label>
    <div id="nlopts" style="display:grid;gap:10px;margin:12px 0 0 34px" ${on ? "" : "hidden"}>
      <fieldset style="border:0;margin:0;padding:0;display:grid;gap:4px"><legend class="small" style="padding:0;font-weight:600">I am</legend>${NL.config.roles.map((r) => `<label class="chk"><input type="radio" name="nlrole" value="${esc(r.id)}" ${role === r.id ? "checked" : ""}> <span>${esc(r.label)}</span></label>`).join("")}</fieldset>
      <fieldset style="border:0;margin:0;padding:0;display:grid;gap:4px"><legend class="small" style="padding:0;font-weight:600">I would like <span class="muted" style="font-weight:400">(optional)</span></legend><div id="nltopics" style="display:grid;gap:4px">${nlTopics(role, on ? o.topics : [])}</div></fieldset>
      <p class="err" id="nlerr" role="alert" hidden></p>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" id="nlsave" type="button">${on ? "Save" : "Turn on the monthly update"}</button><span class="muted small" id="nlok" role="status"></span></div>
    </div>
    <p class="muted small" style="margin-top:10px">${esc(NL.config.disclosure)} Unsubscribe here at any time, or from the link in every email.</p></section>`;
}
function panel() {
  const o = O, u = o.user;
  if (tab === "drafts") return head("Saved drafts") + list(o.drafts.map((d) => `<div class="rowi"><div><b>${esc(d.title)}</b><br><span class="muted small">${LABEL[d.kind] || d.kind} · saved ${when(d.updated_at)}</span></div><div class="acts"><a class="btn sm" href="${dpage(d)}?draft=${esc(d.id)}">Continue</a><button class="btn out sm" type="button" data-del="${esc(d.id)}">Delete</button></div></div>`), "No saved drafts. Tap “Save &amp; exit” in any add form to keep your place.");
  if (tab === "contests") return head("Contests you run", ["+ Add a contest", "/add-contest"]) + list(o.contests.map(contestRow), 'You do not run or help run a contest yet. <a href="/add-contest">Create one</a>.')
    + head("Homes you entered") + list(o.entries.map(entryRow), 'You have not entered a home in a contest yet. <a href="/contests">See contests to enter</a>.');
  if (tab === "displays") return head("Lighting displays you posted", ["+ Add a display", "/add-house"]) + (o.installers || []).map((i) => `<p class="small"><a class="btn out sm" href="/installer/${esc(i.slug)}/manage">Manage the ${esc(i.name)} profile</a></p>`).join("") + list(o.homes.map(homeRow), "None yet.");
  if (tab === "events") return head("Events you added", ["+ Add an event", "/add-event"]) + list(o.events.map(eventRow), "None yet.");
  if (tab === "badges") {
    const bs = BD.badges, on = (id, s) => BD.master && !BD.off[id + "|" + s];
    const CR = (n) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;flex:none"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>`;
    const sh = (s) => bs.filter((b) => on(b.id, s)), l = sh("list"), pp = sh("popup"), d = sh("detail"), t = esc(O.user.name || "Your home");
    return head("Badges") + `<p class="muted" style="margin-top:-8px">Winners keep a crown. Choose where your badges show on your listings. They are on everywhere by default.</p>
      <label class="chk"><input type="checkbox" data-bpm ${BD.master ? "checked" : ""}> <span>Show my badges on my listings</span></label>
      <div class="list">${bs.map((b) => `<div><div style="display:flex;gap:10px;align-items:flex-start">${CR(18)}<div><b style="font-weight:500">${esc(b.a)} · ${esc(b.k)}</b><br><span class="muted small">${esc(b.s)} · ${esc(b.c)}</span></div></div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px">${[["list", "List card"], ["popup", "Map pop-up"], ["detail", "Details page"]].map(([k, lb]) => `<label class="chk" style="font-size:14px"><input type="checkbox" data-bp="${esc(b.id)}|${k}" ${on(b.id, k) ? "checked" : ""} ${BD.master ? "" : "disabled"}> <span>${lb}</span></label>`).join("")}</div></div>`).join("")}</div>
      <h3 style="margin-top:8px">How it looks</h3><div class="surfs"><div><span class="muted small">List card</span><div class="bcard"><div class="ph">${l.length ? `<span class="bpill" role="img" aria-label="Past contest winner">${CR(18)}</span>` : ""}</div><div class="b"><b>${t}</b><span class="muted small">Your address</span></div></div></div>
      <div><span class="muted small">Map pop-up</span><div class="popc"><div class="pi"></div><div><b>${pp.length ? CR(15) + " " : ""}${t}</b>${pp.length ? `<span class="m">${esc(pp[0].a)} · ${esc(pp[0].s)}${pp.length > 1 ? " +" + (pp.length - 1) : ""}</span>` : ""}</div></div></div>
      <div><span class="muted small">Details page</span><div class="detc"><b>${t}</b>${d.map((b) => `<div class="bline">${CR(18)}<div><b>${esc(b.a)} · ${esc(b.k)}</b><span class="m">${esc(b.s)} · ${esc(b.c)}</span></div></div>`).join("") || '<span class="muted small">No badge shown here.</span>'}</div></div></div>`;
  }
  // account
  const pf = { name: u.name || "", street: u.street || "", city: u.city || "", zip: u.zip || "" };
  return head("Account") + `<p class="muted" style="margin-top:-8px">Your name and address are optional. We use them to fill in forms for you; they are never shown publicly.</p>
    <form id="pform" class="main" style="padding:0;gap:18px;max-width:none" novalidate>${input(pf, "name", { label: "Name", opt: true, max: 80, ac: "name", ph: "Your name" })}${select(pf, "city", cities.map((c) => [c, c]), { label: `City ${OPT}`, blank: "Choose a city", ac: "address-level2" })}${input(pf, "street", { label: "Street address", opt: true, max: 120, ac: "address-line1", ph: "e.g. 27 Via Alicia", addr: true })}${input(pf, "zip", { label: "ZIP", opt: true, max: 5, mode: "numeric", ac: "postal-code", ph: "92692" })}
    <p class="err" id="perr" role="alert" hidden></p><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit">Save</button><span class="muted small" id="pok" role="status"></span></div></form>
    ${nlSection()}
    <div style="margin-top:8px"><button class="btn out" id="so" type="button">Sign out</button></div>
    <section style="margin-top:12px"><h2>Delete my account</h2><p class="muted small" id="delmsg">Deletes your account, saved drafts, profile picture, contest entries and votes, closes contests you run, and removes your email from homes and events you posted. It also ends the monthly update, and your address goes on our do-not-contact list as a one-way hash (not the address itself) so we do not contact you again. This can't be undone.</p><p class="err" id="delerr" role="alert" hidden></p><div style="margin-top:10px"><button class="btn out" id="delacct" type="button" style="color:var(--bad);border-color:var(--bad)">Delete my account</button></div></section><p class="small muted">Homes and events are matched by the email you typed on the form.</p>`;
}

function render() {
  const o = O, em = o.user.email, n = { badges: BD.badges.length, drafts: o.drafts.length, contests: o.contests.length, entries: o.entries.length, displays: o.homes.length, events: o.events.length };
  const T = [["drafts", "Drafts"], ["contests", "Contests"], ["displays", "Displays"], ["events", "Events"], ...(BD.badges.length ? [["badges", "Badges"]] : []), ["account", "Account"]];
  if (!T.some((t) => t[0] === tab)) tab = "drafts";
  shell.own(true); shell.setHidden("badges", !BD.badges.length); shell.setActive(tab); for (const [k] of T) shell.setCount(k, n[k]);
  app.innerHTML = `<div class="who"><span class="avatar" aria-hidden="true">${info && info.user && info.user.avatar ? `<img src="${esc(info.user.avatar)}" alt="">` : esc((o.user.name || em)[0].toUpperCase())}</span><div><h1 style="font-size:clamp(26px,5vw,34px)">${esc(o.user.name || "Welcome")}</h1><span class="muted">${esc(em)}</span><div style="display:flex;gap:14px;margin-top:6px"><label class="link" for="avfile" style="font-size:14px;cursor:pointer">${info && info.user && info.user.avatar ? "Change photo" : "Add a photo"}</label>${info && info.user && info.user.avatar ? '<button class="link" id="avrm" type="button" style="font-size:14px">Remove</button>' : ""}<input id="avfile" type="file" accept="image/*" hidden><button class="link" id="editprof" type="button" style="font-size:14px">Edit name &amp; address</button></div><p class="err" id="averr" role="alert" hidden></p></div></div>
    <section id="pp">${panel()}</section>`;
  wire();
}
function wire() {
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "#" + tab); render(); }));
  app.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; } await fetch("/api/drafts/" + b.dataset.del, { method: "DELETE" }); load(); }));
  const ep = $("#editprof"); if (ep) ep.onclick = () => { tab = "account"; history.replaceState(null, "", "#account"); render(); window.scrollTo(0, 0); };
  const da = $("#delacct"); if (da) da.onclick = async () => {
    if (!da.dataset.sure) { da.dataset.sure = "1"; da.textContent = "Tap again to permanently delete"; return; }
    da.disabled = true; const r = await fetch("/api/me", { method: "DELETE" });
    if (!r.ok) { const j = await r.json().catch(() => ({})); const er = $("#delerr"); er.textContent = j.error || "Couldn't delete your account. Try again."; er.hidden = false; da.disabled = false; return; }
    location.href = "/?deleted=1";
  };
  const save = () => fetch("/api/me/badges", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ master: BD.master, off: BD.off }) });
  const bm = app.querySelector("[data-bpm]"); if (bm) bm.onchange = async () => { BD.master = bm.checked; await save(); render(); };
  app.querySelectorAll("[data-bp]").forEach((c) => (c.onchange = async () => { if (c.checked) delete BD.off[c.dataset.bp]; else BD.off[c.dataset.bp] = true; await save(); render(); }));
  // manage my displays and events
  const post = async (url, body) => { const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "That didn't work."); return j; };
  app.querySelectorAll(".mrow").forEach((row) => {
    const f = row.querySelector(".mform"), er = f && f.querySelector(".err");
    let closeW = null;
    const openF = row.querySelector("[data-medit]"); if (openF) openF.onclick = () => { closeW = openFormWindow(f, row.dataset.home ? "Edit display" : "Edit event"); };
    const cl = f && f.querySelector("[data-mcancel]"); if (cl) cl.onclick = () => { if (closeW) closeW(); };
    const collect = () => { const o = {}; f.querySelectorAll("[data-k]").forEach((el) => (o[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value)); return o; };
    if (row.dataset.home) {
      f.onsubmit = async (e) => { e.preventDefault(); er.hidden = true; try { await post("/api/me/homes/" + row.dataset.home, { action: "edit", ...collect() }); if (closeW) closeW(); toast("Saved."); load(); } catch (x) { er.textContent = x.message; er.hidden = false; } };
      const hd = row.querySelector("[data-hdel]"); if (hd && !row.dataset.shared) hd.onclick = async () => { if (!hd.dataset.sure) { hd.dataset.sure = "1"; hd.textContent = "Tap again to delete for good"; return; } try { const r = await fetch("/api/me/homes/" + row.dataset.home, { method: "DELETE" }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "That didn't work."); toast("Deleted."); load(); } catch (x) { toast(x.message); } };
      row.querySelectorAll("[data-hact]").forEach((b) => (b.onclick = async () => { try { await post("/api/me/homes/" + row.dataset.home, { action: b.dataset.hact }); toast(b.dataset.hact === "pause" ? "Taken down. Put it back any time." : "Back on the map."); load(); } catch (x) { toast(x.message); } }));
    } else {

      const nt = row.querySelector("[data-notice]"); if (nt) nt.onchange = async () => { try { await post("/api/me/events/" + row.dataset.ev, { action: "notice", notice: nt.value }); toast(nt.value ? "Tag added to the event." : "Tag removed."); load(); } catch (x) { toast(x.message); } };
      const ed = row.querySelector("[data-edel]"); if (ed) ed.onclick = async () => { if (!ed.dataset.sure) { ed.dataset.sure = "1"; ed.textContent = "Tap again to delete for good"; return; } try { const r = await fetch("/api/me/events/" + row.dataset.ev, { method: "DELETE" }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "That didn't work."); toast("Deleted."); load(); } catch (x) { toast(x.message); } };
      const cp = row.querySelector("[data-ecopy]"); if (cp) cp.onclick = async () => { if (!cp.dataset.sure) { cp.dataset.sure = "1"; cp.textContent = "Tap again: copy to next year"; return; } try { await post("/api/me/events/" + row.dataset.ev, { action: "copy" }); toast("Copied. Edit the new dates when you know them."); load(); } catch (x) { toast(x.message); } };
    }
  });
  const nlOn = app.querySelector("[data-nl-on]");
  if (nlOn) {
    const box = $("#nlopts"), er = $("#nlerr"), ok = $("#nlok"), picked = () => [...app.querySelectorAll("[data-nl-topic]:checked")].map((c) => c.dataset.nlTopic), roleNow = () => { const r = app.querySelector("[name=nlrole]:checked"); return r ? r.value : ""; };
    const call = async (body) => { const r = await fetch("/api/me/newsletter", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Couldn't save that. Try again."); NL.optin = j.optin; return j; };
    nlOn.onchange = async () => {
      er.hidden = true; ok.textContent = "";
      if (nlOn.checked) { box.hidden = false; const f = app.querySelector("[name=nlrole]"); if (f) f.focus(); return; } // nothing is saved until they choose a role and press the button
      if (!(NL.optin && NL.optin.active)) { box.hidden = true; return; }
      try { await call({ optin: false }); render(); const s = $("#nlsec"); if (s) s.scrollIntoView({ block: "center" }); const m = $("#nlok"); if (m) m.textContent = "Unsubscribed."; } catch (x) { nlOn.checked = true; er.textContent = x.message; er.hidden = false; }
    };
    app.querySelectorAll("[name=nlrole]").forEach((r) => (r.onchange = () => { $("#nltopics").innerHTML = nlTopics(r.value, picked().filter((t) => NL.config.roles.find((x) => x.id === r.value).topics.some((y) => y.id === t))); }));
    $("#nlsave").onclick = async () => {
      er.hidden = true; ok.textContent = ""; if (!roleNow()) { er.textContent = "Choose whether you are an installer, an event or contest host, or a family."; er.hidden = false; return; }
      try { const was = NL.optin && NL.optin.active; await call({ optin: true, role: roleNow(), topics: picked(), method: "profile checkbox", source_page: "profile" }); render(); const m = $("#nlok"); if (m) m.textContent = was ? "Saved." : "You are signed up. You can turn it off here any time."; } catch (x) { er.textContent = x.message; er.hidden = false; }
    };
  }
  const so = $("#so"); if (so) so.onclick = async () => { await signOut(); location.href = "/"; };
  const pf = $("#pform"); if (pf) {
    attachAddress(pf, { getCity: () => $("#f-city").value, onPick: (s) => { $("#f-street").value = s.street; if (cities.includes(s.city)) $("#f-city").value = s.city; if (/^\d{5}/.test(s.zip)) $("#f-zip").value = s.zip.slice(0, 5); } });
    pf.onsubmit = async (e) => {
      e.preventDefault(); const er = $("#perr"), ok = $("#pok"); er.hidden = true; ok.textContent = "";
      const r = await fetch("/api/me/profile", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: $("#f-name").value, street: $("#f-street").value, city: $("#f-city").value, zip: $("#f-zip").value }) }), j = await r.json().catch(() => ({}));
      if (!r.ok) { er.textContent = j.error || "Couldn't save that."; er.hidden = false; return; }
      O.user = { ...O.user, name: $("#f-name").value.trim(), street: $("#f-street").value.trim(), city: $("#f-city").value, zip: $("#f-zip").value.trim() }; ok.textContent = "Saved."; const h = app.querySelector("h1"); if (h) h.textContent = O.user.name || "Your profile"; await me(true);
    };
  }
  // profile picture: cropped to a 256px square on this device, then uploaded
  const av = $("#avfile"); if (av) av.onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return; const er = $("#averr"); er.hidden = true;
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: "from-image" }), s = Math.min(bmp.width, bmp.height), c = document.createElement("canvas"); c.width = c.height = 256;
      c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 256, 256);

      const r = await fetch("/api/me/avatar", { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob }), j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Couldn't save that photo."); load();
    } catch (x) { er.textContent = x.message || "That photo couldn't be read. Try a JPG or PNG."; er.hidden = false; }
  };
  const rm = $("#avrm"); if (rm) rm.onclick = async () => { await fetch("/api/me/avatar", { method: "DELETE" }); load(); };
}

  BD = await fetch("/api/me/badges", { cache: "no-store" }).then((x) => (x.ok ? x.json() : BD)).catch(() => BD);
  NL = await fetch("/api/me/newsletter", { cache: "no-store" }).then((x) => (x.ok ? x.json() : NL)).catch(() => NL);
