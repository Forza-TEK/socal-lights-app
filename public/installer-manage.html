<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Installer profile · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261102c">
<link rel="stylesheet" href="/contest.css?v=20261101h">
<style>main{max-width:900px}.thumb{width:56px;height:42px;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}</style>
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<div class="crumb wide"><a href="/">← Back to the map</a></div>
<main class="cmain wide">
<div id="app"><p class="loading">Loading your profile…</p></div>
</main>
<script type="module">
import { me, signIn, noteSigninResult, esc, toast } from "/auth.js?v=20261101a";
import { themeBtn, mountAcct, refreshAcct } from "/addflow.js?v=20261031z";
const $ = (q) => document.querySelector(q), slug = location.pathname.split("/")[2] || "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], fmt = (s) => { const [, m, d] = String(s).split("-").map(Number); return MON[m - 1] + " " + d; };
let D = null;
async function load() {
  const i = await me(true);
  if (!i.user) { $("#app").innerHTML = `<div class="card center"><h1>Sign in to manage your profile</h1><p class="muted">Use the email you claimed the profile with.</p><button class="btn org" id="go" type="button">Sign in</button></div>`; $("#go").onclick = async () => { if (await signIn({ title: "Sign in to manage your profile", next: location.pathname })) { refreshAcct($("#acct")); load(); } }; return; }
  const r = await fetch(`/api/installers/${encodeURIComponent(slug)}/manage`, { cache: "no-store" });
  if (!r.ok) { $("#app").innerHTML = `<div class="card center"><h1>This isn't your profile</h1><p class="muted">You're signed in as ${esc(i.user.email)}. Open the company's page and choose "Claim this profile".</p><a class="btn" href="/installer/${esc(slug)}">See the public page</a></div>`; return; }
  D = await r.json(); document.title = "Manage " + D.installer.name; render();
}
const post = async (body) => { const r = await fetch(`/api/installers/${encodeURIComponent(slug)}/manage`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "That didn't work."); return j; };
function render() {
  const x = D.installer, mx = Math.max(1, ...D.views.map((v) => v.n));
  $("#app").innerHTML = `<div class="card"><div class="banner"><div class="logo" aria-hidden="true">${x.hasLogo ? `<img src="/api/installers/${esc(slug)}/logo?${Date.now()}" alt="" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">` : esc(x.name.slice(0, 1))}</div><div><h1>${esc(x.name)}</h1><span>Your installer profile · <a href="/installer/${esc(slug)}">view the public page</a></span></div></div>
   <div class="stats"><div class="stat"><b>${D.viewsTotal}</b><span>Profile views (30 days)</span></div><div class="stat"><b>${D.homes}</b><span>Homes on the map</span></div><div class="stat"><b>${D.leads.length}</b><span>Quote requests</span></div></div></div>
  ${D.claims.length ? `<div class="card"><h2 style="font-size:19px">Homes that name your company</h2><p class="muted small">Homeowners said you installed these. Confirm the ones you did (they get a check mark) or remove the ones you didn't.</p><div class="list">${D.claims.map((c) => `<div class="rowi"><div><b>${esc(c.title)}</b><br><span class="small muted">${esc(c.city)} · posted by ${esc(c.biz)}</span></div><div class="acts"><button class="btn org sm" type="button" data-claim="confirm:${esc(c.id)}">Confirm</button><button class="btn ghost sm" type="button" data-claim="remove:${esc(c.id)}">Not ours</button></div></div>`).join("")}</div></div>` : ""}
  <div class="card"><h2 style="font-size:19px">Your details</h2><form id="df" style="display:grid;gap:12px;max-width:560px"><label style="display:grid;gap:4px">Website<input id="dw" value="${esc(x.web)}" maxlength="200"></label><label style="display:grid;gap:4px">Phone for quotes<input id="dp" value="${esc(x.phone)}" maxlength="80" inputmode="tel"></label><label style="display:grid;gap:4px">Service area<input id="da" value="${esc(x.area)}" maxlength="120"></label><label style="display:grid;gap:4px">About your company<textarea id="db" rows="3" maxlength="600">${esc(x.blurb)}</textarea></label><p class="err" id="de" role="alert" hidden></p><div><button class="btn org" type="submit">Save</button></div></form></div>
  <div class="card"><h2 style="font-size:19px">Logo</h2><p class="muted small">JPG, PNG or WebP under 600 KB. It shows on your profile page.</p><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input id="lf" type="file" accept="image/jpeg,image/png,image/webp">${x.hasLogo ? `<button class="btn ghost sm" type="button" id="lr">Remove logo</button>` : ""}</div><p class="err" id="le" role="alert" hidden></p></div>
  <div class="card"><h2 style="font-size:19px">Profile views</h2>${D.views.length ? `<div style="display:grid;gap:4px">${D.views.slice(-14).map((v) => `<div style="display:grid;grid-template-columns:56px 1fr 30px;gap:8px;align-items:center;font-size:13px"><span class="muted">${esc(fmt(v.day))}</span><div class="rbar"><i style="width:${v.n / mx * 100}%"></i></div><span>${v.n}</span></div>`).join("")}</div>` : `<p class="muted small">Views will show here as people open your page.</p>`}</div>
  <div class="card"><h2 style="font-size:19px">Quote requests</h2>${D.leads.length ? `<div class="list">${D.leads.map((l) => `<div class="rowi"><div><b>${esc(l.name)}</b> <span class="small muted">${esc(l.email)}${l.phone ? " · " + esc(l.phone) : ""} · ${esc((l.created_at || "").slice(0, 10))}</span>${l.note ? `<br><span class="small">${esc(l.note)}</span>` : ""}</div></div>`).join("")}</div>` : `<p class="muted small">None yet. Requests are also emailed to you.</p>`}</div>`;
  document.querySelectorAll("[data-claim]").forEach((b) => (b.onclick = async () => { const [a, id] = b.dataset.claim.split(":"); try { await post({ action: a, post: id }); toast(a === "confirm" ? "Confirmed." : "Removed."); load(); } catch (e) { toast(e.message); } }));
  $("#df").onsubmit = async (e) => { e.preventDefault(); const er = $("#de"); er.hidden = true; try { await post({ action: "edit", web: $("#dw").value, phone: $("#dp").value, area: $("#da").value, blurb: $("#db").value }); toast("Saved."); load(); } catch (x) { er.textContent = x.message; er.hidden = false; } };
  $("#lf").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const er = $("#le"); er.hidden = true; const r = await fetch(`/api/installers/${encodeURIComponent(slug)}/logo`, { method: "POST", body: f }), j = await r.json().catch(() => ({})); if (!r.ok) { er.textContent = j.error || "That didn't upload."; er.hidden = false; return; } toast("Logo saved."); load(); };
  const lr = $("#lr"); if (lr) lr.onclick = async () => { await fetch(`/api/installers/${encodeURIComponent(slug)}/logo`, { method: "DELETE" }); toast("Logo removed."); load(); };
}
$("#tb").innerHTML = themeBtn(); mountAcct($("#acct")); noteSigninResult(); load();
</script>
</body>
</html>
