<style>
.tnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}.tnav button{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:500;cursor:pointer}.tnav button:hover{border-color:var(--season)}.tnav button[aria-selected=true]{background:var(--season);border-color:var(--season);color:var(--on-season,#fff)}.tgroup[hidden]{display:none}

.vfull{position:fixed;inset:0;z-index:2000;background:#000;display:flex;align-items:center;justify-content:center}.vfull video,.vfull iframe{width:100%;height:100%;object-fit:contain;border:0;background:#000}.vfull video{background:transparent}.vclose{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font:400 28px/1 system-ui,sans-serif;cursor:pointer}.vfull video::cue{font-size:13px;line-height:1.25;background:rgba(0,0,0,.72)}.vclose:focus-visible{outline:3px solid #fff;outline-offset:2px}.vers{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ver{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:36px;white-space:nowrap}.ver:hover{background:var(--tile)}.ver:hover{border-color:var(--season)}.ver:focus-visible{outline:3px solid var(--season);outline-offset:2px}.vfull.wide-screen{background:rgba(0,0,0,.88)}.vfull.wide-screen video,.vfull.wide-screen iframe{width:auto;height:min(100vh,900px);aspect-ratio:9/16;max-width:100vw}.vfill{position:absolute;inset:0;width:100%;height:100%;filter:blur(18px) saturate(1.1);transform:scale(1.2);opacity:.9}.vfull video,.vfull iframe{position:relative}</style>

<body class="sh-page">
<main id="content">
<h1>Tutorials</h1>
<p class="tsub">Short how-to videos, grouped by what you want to do. Prefer to read? Every video has written steps in the <a href="/help">Help Center</a>.</p>
<div id="tut"><p class="tsub">Loading…</p></div>
<noscript><p>Turn on JavaScript to see the tutorial list.</p></noscript>
</main>
<script type="module">
import { mountShell } from "/appshell.js?v=20261106zb";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (q) => document.querySelector(q);
// Turns a pasted video link into something we can play: YouTube, Vimeo, Cloudflare Stream, or a direct video file
function player(url, poster, captions) {
  let u; try { u = new URL(url, location.origin); } catch { return ""; }
  const h = u.hostname.replace(/^www\./, "");
  if (h === "youtu.be") return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(u.pathname.slice(1))}?autoplay=1&rel=0" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (h.endsWith("youtube.com")) { const id = u.searchParams.get("v") || u.pathname.split("/").pop(); return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&rel=0" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; }
  if (h === "vimeo.com") return `<iframe src="https://player.vimeo.com/video/${esc(u.pathname.split("/").filter(Boolean)[0])}?autoplay=1" title="Tutorial video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  if (h.endsWith("cloudflarestream.com") || h === "iframe.videodelivery.net") return `<iframe src="${esc(url)}${url.includes("?") ? "&" : "?"}autoplay=true" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (/\.(mp4|webm|mov)$/i.test(u.pathname)) return `<video src="${esc(url)}" ${poster ? `poster="${esc(poster)}"` : ""} controls autoplay playsinline>${captions ? `<track kind="captions" src="${esc(captions)}" srclang="en" label="English" default>` : ""}</video>`;
  return "";
}
const data = await fetch("/tutorials.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => ({ groups: [] }));
const groups = data.groups.filter((g) => g.videos && g.videos.length);
const IC = {"find": "map", "enter": "pencil", "vote": "check", "run": "trophy", "sponsors": "star", "post": "homeplus"};
const shell = mountShell({ page: "tut", title: "Tutorials", items: groups.map((g) => ({ k: g.id, label: g.title, icon: IC[g.id] || "play" })), active: (groups[0] || {}).id, onPick: (k) => show(k, true) });
const card = (v) => `<article class="tcard" id="v-${esc(v.id)}"><div class="th"${v.poster ? ` style="background:#000 url('${esc(v.poster)}') center/cover"` : ""}><button class="play" type="button" data-url="${esc(v.url)}" data-poster="${esc(v.poster || "")}" data-captions="${esc(v.captions || "")}"${v.mobile && v.mobile.url ? ` data-murl="${esc(v.mobile.url)}" data-mposter="${esc(v.mobile.poster || "")}" data-mcaptions="${esc(v.mobile.captions || "")}"` : ""} aria-label="Play: ${esc(v.title)}">&#9654;</button></div><div class="tb"><h3>${esc(v.title)}</h3><p>${esc(v.desc || "")}${v.length ? ` · ${esc(v.length)}` : ""}</p>${v.mobile && v.mobile.url ? `<div class="vers" role="group" aria-label="Choose a version"><button type="button" class="ver" data-ver="wide" data-url="${esc(v.url)}" data-poster="${esc(v.poster || "")}" data-captions="${esc(v.captions || "")}">&#128421; Computer${v.length ? ` ${esc(v.length)}` : ""}</button><button type="button" class="ver" data-ver="phone" data-murl="${esc(v.mobile.url)}" data-mposter="${esc(v.mobile.poster || "")}" data-mcaptions="${esc(v.mobile.captions || "")}">&#128241; Phone${v.mobile.length ? ` ${esc(v.mobile.length)}` : ""}</button></div>` : ""}</div></article>`;
const row = (v) => `<div class="trow" id="v-${esc(v.id)}"><div><h3>${esc(v.title)}</h3><p>${esc(v.desc || "")}</p></div><span class="soon">Coming soon</span></div>`;
$("#tut").innerHTML = groups.map((g) => { const ready = g.videos.filter((v) => v.url && player(v.url)), soon = g.videos.filter((v) => !(v.url && player(v.url)));
  return `<section class="tgroup" id="${esc(g.id)}" role="tabpanel" aria-labelledby="tab-${esc(g.id)}" hidden><h2>${esc(g.title)}</h2><p>${esc(g.blurb || "")}</p>${ready.length ? `<div class="tgrid">${ready.map(card).join("")}</div>` : ""}${soon.length ? `<div class="tlist">${soon.map(row).join("")}</div>` : ""}</section>`; }).join("") || `<p class="tsub">No tutorials yet.</p>`;
// On a phone the vertical (Shorts-shaped, 9:16) version plays full screen; everywhere else the wide version plays in its card
const phone = matchMedia("(max-width: 700px)");
function fullScreen(b) {
  const o = document.createElement("div"); o.className = "vfull" + (phone.matches ? "" : " wide-screen"); o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Tutorial video");
  o.innerHTML = `<canvas class="vfill" aria-hidden="true" width="36" height="64"></canvas>` + player(b.dataset.murl, b.dataset.mposter, b.dataset.mcaptions) + `<button type="button" class="vclose" aria-label="Close video">&times;</button>`;
  const close = () => { o.remove(); document.body.style.overflow = ""; removeEventListener("keydown", esc2); }, esc2 = (e) => { if (e.key === "Escape") close(); };
  o.querySelector(".vclose").onclick = close; addEventListener("keydown", esc2); document.body.style.overflow = "hidden"; document.body.appendChild(o);
  const v = o.querySelector("video"), cv = o.querySelector(".vfill");
  if (v && cv && cv.getContext) { const g = cv.getContext("2d"); let raf = 0; const tick = () => { try { g.drawImage(v, 0, 0, cv.width, cv.height); } catch {} raf = requestAnimationFrame(tick); }; v.addEventListener("play", () => { cancelAnimationFrame(raf); tick(); }); v.addEventListener("pause", () => cancelAnimationFrame(raf)); o.addEventListener("remove", () => cancelAnimationFrame(raf)); const oc = o.querySelector(".vclose"); oc.addEventListener("click", () => cancelAnimationFrame(raf)); } // a blurred copy of the picture fills the screen behind the video, so a taller phone shows no black bars
  if (v) { v.addEventListener("ended", () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }); }
  o.querySelector(".vclose").focus();
}
document.addEventListener("click", (e) => { const vb = e.target.closest(".ver"); if (!vb) return; const th = vb.closest(".tcard").querySelector(".th");
  if (vb.dataset.ver === "phone") { fullScreen({ dataset: { murl: vb.dataset.murl, mposter: vb.dataset.mposter, mcaptions: vb.dataset.mcaptions } }); return; }
  th.innerHTML = player(vb.dataset.url, vb.dataset.poster, vb.dataset.captions); });
document.addEventListener("click", (e) => { const b = e.target.closest(".play"); if (!b) return; if (phone.matches && b.dataset.murl) { fullScreen(b); return; } const th = b.parentElement; th.innerHTML = player(b.dataset.url, b.dataset.poster, b.dataset.captions); });
// Tabs: one group at a time. The link /tutorials#run opens a group; /tutorials#v-vote opens the group that holds that video and plays it.
function show(id, push) {
  if (!groups.some((g) => g.id === id)) id = groups[0] && groups[0].id; if (!id) return;
  document.querySelectorAll(".tgroup").forEach((el) => (el.hidden = el.id !== id));
  shell.setActive(id);
  if (push) history.replaceState(null, "", "#" + id);
}
function fromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith("v-")) { const c = document.getElementById(h); if (c) { show(c.closest(".tgroup").id); c.scrollIntoView(); const b = c.querySelector(".play"); if (b) b.click(); return; } }
  show(h);
}
addEventListener("hashchange", fromHash); fromHash();
</script>
