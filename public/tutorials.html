<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tutorials · SoCal Lights</title>
<meta name="description" content="Short how-to videos for SoCal Lights: finding lights, entering and voting in contests, and running one.">
<meta property="og:title" content="Tutorials · SoCal Lights"><meta property="og:description" content="Short how-to videos for SoCal Lights: finding lights, entering and voting in contests, and running one."><meta property="og:image" content="https://socallights.app/img/share.png"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261102g">
<link rel="stylesheet" href="/info.css?v=20261031t">
<style>
.tnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}.tnav button{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:500;cursor:pointer}.tnav button:hover{border-color:var(--season)}.tnav button[aria-selected=true]{background:var(--season);border-color:var(--season);color:var(--on-season,#fff)}.tgroup[hidden]{display:none}
.tgroup{margin:30px 0 0;scroll-margin-top:16px}.tgroup>p{margin:4px 0 12px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:16px}
.tcard .th{aspect-ratio:16/9;background:var(--tile,#f1ede7);display:grid;place-items:center;position:relative}
.tcard .play{width:56px;height:56px;border-radius:50%;border:0;background:var(--season);color:var(--on-season,#fff);font-size:22px;cursor:pointer;display:grid;place-items:center}
.tcard .soon{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tcard .tb{padding:12px 14px 14px;display:grid;gap:4px}.tcard h3{margin:0;font-size:17px;font-weight:500;line-height:1.3}.tcard p{margin:0;font-size:14px;color:var(--muted)}
.tcard iframe,.tcard video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.tsub{color:var(--muted)}
.tlist{display:grid;gap:8px;margin-top:12px}.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;scroll-margin-top:16px}.trow h3{margin:0;font-size:16px;font-weight:500}.trow p{margin:2px 0 0;font-size:14px;color:var(--muted)}.trow .soon{flex:none;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
</style>
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<main>
<h1>Tutorials</h1>
<p class="tsub">Short how-to videos, grouped by what you want to do. New ones are added as they are finished.</p>
<div class="tnav" id="tnav" role="tablist" aria-label="Tutorial groups"></div>
<div id="tut"><p class="tsub">Loading…</p></div>
<noscript><p>Turn on JavaScript to see the tutorial list.</p></noscript>
</main>
<script type="module">
import { themeBtn, mountAcct } from "/addflow.js?v=20261102b";
document.getElementById("tb").innerHTML = themeBtn(); mountAcct(document.getElementById("acct"));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (q) => document.querySelector(q);
// Turns a pasted video link into something we can play: YouTube, Vimeo, Cloudflare Stream, or a direct video file
function player(url) {
  let u; try { u = new URL(url); } catch { return ""; }
  const h = u.hostname.replace(/^www\./, "");
  if (h === "youtu.be") return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(u.pathname.slice(1))}?autoplay=1&rel=0" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (h.endsWith("youtube.com")) { const id = u.searchParams.get("v") || u.pathname.split("/").pop(); return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&rel=0" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; }
  if (h === "vimeo.com") return `<iframe src="https://player.vimeo.com/video/${esc(u.pathname.split("/").filter(Boolean)[0])}?autoplay=1" title="Tutorial video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  if (h.endsWith("cloudflarestream.com") || h === "iframe.videodelivery.net") return `<iframe src="${esc(url)}${url.includes("?") ? "&" : "?"}autoplay=true" title="Tutorial video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if (/\.(mp4|webm|mov)$/i.test(u.pathname)) return `<video src="${esc(url)}" controls autoplay playsinline></video>`;
  return "";
}
const data = await fetch("/tutorials.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => ({ groups: [] }));
const groups = data.groups.filter((g) => g.videos && g.videos.length);
$("#tnav").innerHTML = groups.map((g) => `<button type="button" role="tab" id="tab-${esc(g.id)}" data-g="${esc(g.id)}" aria-controls="${esc(g.id)}">${esc(g.title)}</button>`).join("");
const card = (v) => `<article class="tcard" id="v-${esc(v.id)}"><div class="th"><button class="play" type="button" data-url="${esc(v.url)}" aria-label="Play: ${esc(v.title)}">&#9654;</button></div><div class="tb"><h3>${esc(v.title)}</h3><p>${esc(v.desc || "")}${v.length ? ` · ${esc(v.length)}` : ""}</p></div></article>`;
const row = (v) => `<div class="trow" id="v-${esc(v.id)}"><div><h3>${esc(v.title)}</h3><p>${esc(v.desc || "")}</p></div><span class="soon">Coming soon</span></div>`;
$("#tut").innerHTML = groups.map((g) => { const ready = g.videos.filter((v) => v.url && player(v.url)), soon = g.videos.filter((v) => !(v.url && player(v.url)));
  return `<section class="tgroup" id="${esc(g.id)}" role="tabpanel" aria-labelledby="tab-${esc(g.id)}" hidden><h2>${esc(g.title)}</h2><p>${esc(g.blurb || "")}</p>${ready.length ? `<div class="tgrid">${ready.map(card).join("")}</div>` : ""}${soon.length ? `<div class="tlist">${soon.map(row).join("")}</div>` : ""}</section>`; }).join("") || `<p class="tsub">No tutorials yet.</p>`;
document.addEventListener("click", (e) => { const b = e.target.closest(".play"); if (!b) return; const th = b.parentElement; th.innerHTML = player(b.dataset.url); });
// Tabs: one group at a time. The link /tutorials#run opens a group; /tutorials#v-vote opens the group that holds that video and plays it.
function show(id, push) {
  if (!groups.some((g) => g.id === id)) id = groups[0] && groups[0].id; if (!id) return;
  document.querySelectorAll(".tgroup").forEach((el) => (el.hidden = el.id !== id));
  document.querySelectorAll("#tnav [data-g]").forEach((b) => { const on = b.dataset.g === id; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
  if (push) history.replaceState(null, "", "#" + id);
}
$("#tnav").addEventListener("click", (e) => { const b = e.target.closest("[data-g]"); if (b) show(b.dataset.g, true); });
$("#tnav").addEventListener("keydown", (e) => { if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return; const t = [...document.querySelectorAll("#tnav [data-g]")], i = t.indexOf(document.activeElement); if (i < 0) return; const n = t[(i + (e.key === "ArrowRight" ? 1 : t.length - 1)) % t.length]; n.focus(); show(n.dataset.g, true); });
function fromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith("v-")) { const c = document.getElementById(h); if (c) { show(c.closest(".tgroup").id); c.scrollIntoView(); const b = c.querySelector(".play"); if (b) b.click(); return; } }
  show(h);
}
addEventListener("hashchange", fromHash); fromHash();
</script>
</body>
</html>
