<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Monthly update preferences · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6||matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261110e">
<link rel="stylesheet" href="/info.css?v=20261110y">
<style>.pref{max-width:520px;margin:40px auto;display:grid;gap:16px}.pref h1{margin:0}.pref p{margin:0}.pref fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}.pref legend{padding:0;font-weight:600;margin-bottom:4px}.pref .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pref .btn{min-height:48px;padding:0 26px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-ink);font:700 16px var(--font);cursor:pointer}.pref .btn.out{background:transparent;color:var(--ink);border:1px solid var(--line2)}.pref .err{color:var(--bad,#c0392b)}.pref .ok{color:var(--muted)}.pref .chk{min-height:44px;align-items:center}</style>
<script src="/hit.js?v=20261107a" defer></script>
</head>
<body>
<div class="hdr" role="banner"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a></div>
<main id="content"><div class="pref" id="box"><p class="meta">One moment…</p></div></main>
<script>
(function () {
  var t = new URLSearchParams(location.search).get("t") || "", box = document.getElementById("box"), S = null;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var topicsFor = function (role, picked) {
    var r = S.config.roles.filter(function (x) { return x.id === role; })[0];
    return r ? r.topics.map(function (x) { return '<label class="chk"><input type="checkbox" data-topic="' + esc(x.id) + '"' + (picked.indexOf(x.id) >= 0 ? " checked" : "") + '> <span>' + esc(x.label) + "</span></label>"; }).join("") : "";
  };
  function fail(m) { box.innerHTML = '<h1>That link did not work</h1><p class="err" role="alert">' + esc(m) + '</p><p>Write to <a href="mailto:info@socallights.app">info@socallights.app</a> and we will take you off the list.</p>'; }
  function draw(msg) {
    if (!S.active) { box.innerHTML = '<h1>You are unsubscribed</h1><p>We will not send the monthly update to <b>' + esc(S.email) + '</b>. You will still get service emails, such as sign-in codes and decisions about your listings.</p><p class="ok" role="status">' + esc(msg || "") + '</p><p><a class="btn out" href="/" style="display:inline-flex;align-items:center;text-decoration:none">Open the map</a></p>'; return; }
    box.innerHTML = '<h1>Monthly update preferences</h1><p>For <b>' + esc(S.email) + '</b>. Change what you get, or stop it. No sign-in needed.</p>'
      + '<fieldset><legend>I am</legend>' + S.config.roles.map(function (r) { return '<label class="chk"><input type="radio" name="role" value="' + esc(r.id) + '"' + (S.role === r.id ? " checked" : "") + '> <span>' + esc(r.label) + "</span></label>"; }).join("") + "</fieldset>"
      + '<fieldset><legend>I would like <span class="ok" style="font-weight:400">(optional)</span></legend><div id="topics" style="display:grid;gap:6px">' + topicsFor(S.role, S.topics) + "</div></fieldset>"
      + '<p class="err" id="err" role="alert" hidden></p><div class="row"><button class="btn" id="save" type="button">Save</button><button class="btn out" id="stop" type="button">Unsubscribe</button><span class="ok" id="msg" role="status">' + esc(msg || "") + "</span></div>"
      + '<p class="ok" style="font-size:14px">' + esc(S.config.disclosure) + "</p>";
    var picked = function () { return [].slice.call(box.querySelectorAll("[data-topic]:checked")).map(function (c) { return c.getAttribute("data-topic"); }); };
    [].forEach.call(box.querySelectorAll("[name=role]"), function (r) { r.onchange = function () { S.role = r.value; document.getElementById("topics").innerHTML = topicsFor(r.value, picked().filter(function (x) { return topicsFor(r.value, [x]).indexOf('data-topic="' + x + '"') >= 0; })); }; });
    document.getElementById("save").onclick = function () { send({ action: "save", role: S.role, topics: picked() }, "Saved."); };
    document.getElementById("stop").onclick = function () { send({ action: "unsubscribe" }, "Done."); };
  }
  function send(body, msg) {
    body.t = t;
    fetch("/api/prefs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "Something went wrong."); return j; }); })
      .then(function (j) { S = j; draw(msg); })
      .catch(function (e) { var er = document.getElementById("err"); if (er) { er.textContent = e.message; er.hidden = false; } else fail(e.message); });
  }
  if (!t) return fail("This page needs the link from your email.");
  fetch("/api/prefs?t=" + encodeURIComponent(t)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); }).then(function (j) { S = j; draw(""); }).catch(function (e) { fail(e.message || "Something went wrong."); });
})();
</script>
<script src="/footer.js?v=20261111h" defer></script>
</body>
</html>
