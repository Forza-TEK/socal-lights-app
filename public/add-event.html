<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add your event · SoCal Lights</title>
<meta name="description" content="Put your Halloween, holiday or seasonal event on the SoCal Lights map. It's free.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261031n">
</head>
<body>
<div id="app"></div>
<script type="module">
import { run, ts, esc, input, area, select, tile, sumRow, validSite, isEmail, PRIV, OPT, today, addDays, fmt } from "/addflow.js?v=20261031n";
import { SEASONS, defaultSeason } from "/seasons.js?v=20261029d";
import { CITY } from "/cities.js";
const cities = Object.keys(CITY).sort(), IN_APP = /SoCalLightsApp/.test(navigator.userAgent);
const cfg = await ts.init(), pay = !!cfg.featureCheckout && !IN_APP; // paid placement is offered only when online payment is on, and never inside the store apps
const d = { url: "", name: "", season: defaultSeason(today), type: "", start: "", end: "", hours: "", free: "yes", price: "", venue: "", street: "", city: "", blurb: "", email: "", plan: "" };
const PLANS = [["", "No thanks, just list it", "Free"], ["pin", "Featured pin: $5", "Gold-ringed pin and Featured badge for 30 days"], ["top", "Top of the list: $10", "Everything above, plus listed first for 30 days"], ["season", "Whole season: $15", "Everything above, until your event ends"]];

const steps = [
  { id: "url", sec: "Basics", title: "Do you have a web page for your event?", help: "If the page mentions your event's name and date, it goes live right away. Without one, a person checks it first, usually within a day.",
    body: (x) => `${input(x, "url", { label: "Event web page", type: "text", mode: "url", ph: "yourevent.org/lights", max: 300, opt: true })}<div style="text-align:right;margin-top:-12px"><button class="link" type="button" data-a="skipurl" style="display:inline-flex;align-items:center;gap:6px">No... Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`,
    check: (x) => (x.url.trim() && !validSite(x.url) ? "That doesn't look like a web address. Try something like example.org/event, or tap No... Next." : "") },
  { id: "name", sec: "Basics", title: "What's the event called?", help: "Choose its season and type too, so people can find it.", redraw: true,
    body: (x) => `${input(x, "name", { label: "Event name", max: 120 })}${select(x, "season", Object.entries(SEASONS).map(([k, v]) => [k, v.label]), { label: "Season" })}${select(x, "type", Object.entries(SEASONS[x.season].types).map(([k, l]) => [k, l]), { label: "Type", blank: "Choose a type" })}`,
    check: (x) => (x.name.trim().length < 4 ? "Enter the event's name." : !SEASONS[x.season].types[x.type] ? "Choose the type of event." : "") },
  { id: "dates", sec: "When", title: "When is it?", help: "Pick the first and last day. For a one-day event use the same day twice.", redraw: false,
    body: (x) => `<div class="row2">${input(x, "start", { label: "First day", type: "date" })}${input(x, "end", { label: "Last day", type: "date" })}</div>${input(x, "hours", { label: "Hours", ph: "for example 5–9pm", max: 120, opt: true })}`,
    check: (x) => (!x.start || !x.end ? "Pick the first and last day." : x.end < x.start ? "The last day can't be before the first day." : x.end < today ? "That event has already ended." : "") },
  { id: "price", sec: "When", title: "Is it free to attend?", redraw: true,
    body: (x) => `<div class="tiles g2">${tile(x, "free", "yes", "Free", "", true)}${tile(x, "free", "no", "Paid", "", true)}</div>${x.free === "no" ? input(x, "price", { label: "Price", ph: "for example $15 adults, kids free", max: 80 }) : ""}`,
    check: (x) => (x.free === "no" && !x.price.trim() ? "Add the price, for example $15 adults." : "") },
  { id: "where", sec: "Where", title: "Where is it?", help: "The pin goes on this address. For a parade, use the cross streets.",
    body: (x) => `${input(x, "venue", { label: "Venue or place name", ph: "e.g. Heritage Park", max: 120 })}${select(x, "city", cities.map((c) => [c, c]), { label: "City", blank: "Choose a city", ac: "address-level2" })}${input(x, "street", { label: "Street address", ph: "123 Main St", max: 160, ac: "address-line1", addr: true })}`,
    check: (x) => (x.venue.trim().length < 3 ? "Enter the venue or place name." : x.street.trim().length < 6 ? "Enter the street address (or the two cross streets for a parade)." : !x.city ? "Choose the city." : "") },
  { id: "blurb", sec: "About", title: "Describe it in a sentence or two", help: "In your own words. It shows on the map card.",
    body: (x) => area(x, "blurb", { max: 200, ph: "What families will see and do" }), check: (x) => (x.blurb.trim().length < 20 ? "Add a sentence or two (at least 20 characters)." : "") },
  { id: "review", sec: "Review", title: "Check everything, then add it", cta: "Add my event", redraw: false,
    body: (x) => `<div class="sum">${sumRow("Event", esc(x.name), "name")}${sumRow("Page", x.url.trim() ? esc(x.url) : "None. A person will check it", "url")}${sumRow("When", fmt(x.start) + (x.end !== x.start ? " to " + fmt(x.end) : ""), "dates")}${sumRow("Price", x.free === "yes" ? "Free" : esc(x.price), "price")}${sumRow("Where", `${esc(x.venue)}, ${esc(x.city)}`, "where")}</div>
      ${input(x, "email", { label: `Your email <small>${PRIV}. Only used if something needs fixing.</small>`, type: "email", mode: "email", ac: "email", max: 120 })}
      ${pay ? `<div class="field"><span class="lab">Make it stand out ${OPT}</span><div class="tiles">${PLANS.map(([v, t, s]) => tile(x, "plan", v, t, s, false)).join("")}</div><p class="small muted">You'll pay on Stripe's secure page right after your event is added. If it needs a quick review first, your Featured placement turns on as soon as it's approved.</p></div>` : ""}<div id="ts"></div>`,
    check: (x) => (!isEmail(x.email) ? "Enter your email so we can reach you if something needs fixing." : ""),
    submit: async (x, api) => {
      const body = { name: x.name, url: x.url, season: x.season, type: x.type, start: x.start, end: x.end, hours: x.hours, price: x.free === "yes" ? "" : x.price, free: x.free === "yes", venue: x.venue, address: x.street, city: x.city, blurb: x.blurb, email: x.email, "cf-turnstile-response": ts.token() };
      const r = await fetch("/api/submit-event", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }), j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
      if (x.plan && pay) {
        // Straight on to Stripe. A published event is featured by its id; one in review is held until it is approved.
        const c = await fetch("/api/feature/checkout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(j.status === "published" || j.status === "duplicate" ? { event_id: j.id, plan: x.plan } : { submission_id: j.submission_id, plan: x.plan }) });
        const cd = await c.json().catch(() => ({}));
        if (c.ok && cd.url) { location.href = cd.url; return; }
        api.finish(`<h1>${esc(j.message)}</h1><p class="help">We couldn't open the payment page just now. You can <a href="/feature">feature your event from here</a> any time.</p>`); return;
      }
      api.finish(`<h1>${esc(j.message)}</h1><p class="help">${j.status === "published" ? "It's on the map now." : "A person will take a quick look, usually within a day."}</p><div style="display:flex;gap:12px;flex-wrap:wrap">${j.status === "published" || j.status === "duplicate" ? '<a class="btn" href="/">See it on the map</a>' : ""}${IN_APP ? "" : '<a class="btn out" href="/feature">Feature your event</a>'}<a class="btn out" href="/add-event">Add another event</a></div>`);
    } },
];
run({ steps, data: d, persist: "scl-event-draft", account: { kind: "event", title: (x) => x.name }, noPersist: ["email", "plan"], season: (x) => x.season, addr: { cities },
  onInput: (k, x) => { if (k === "start" && (!x.end || x.end < x.start)) { x.end = x.start; const e = document.getElementById("f-end"); if (e) e.value = x.end; } if (k === "season") { x.type = ""; const t = document.getElementById("f-type"); if (t) t.innerHTML = '<option value="">Choose a type</option>' + Object.entries(SEASONS[x.season].types).map(([a, l]) => `<option value="${esc(a)}">${esc(l)}</option>`).join(""); } },
  actions: { skipurl(_, a) { d.url = ""; a.next(); } },
  after: (s) => { if (s.id === "review") ts.mount(); if (s.id === "dates") { const a = document.getElementById("f-start"), b = document.getElementById("f-end"); if (a) a.min = today; if (b) b.min = d.start || today; } } });
</script>
</body>
</html>
