<script type="module">
import { me, signIn, noteSigninResult, esc, toast } from "/auth.js?v=20261107p";
import { refreshAcct } from "/addflow.js?v=20261111b";
import { mountShell } from "/appshell.js?v=20261110e";
import { fsec, ff } from "/forms.js?v=20261106zb";
import { printable } from "/printables.js?v=20261107a";
import { shrink } from "/shrink.js?v=20261111a";
const $ = (q) => document.querySelector(q), slug = location.pathname.split("/")[2] || "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = (s) => { const [, m, d] = s.split("-").map(Number); return MON[m - 1] + " " + d; };
const initials = (o) => (o.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "EN").toUpperCase();
let panel = (location.hash || "").slice(1) || "overview";
const shell = mountShell({ page: "contest", title: "Contest", active: panel, extra: [["voters", "See it as voters do", "/c/" + slug, "play"], ["list", "All contests", "/contests", "trophy"]],
  items: [{ k: "overview", label: "Overview", icon: "home" }, { k: "entries", label: "Entries", icon: "file" }, { k: "results", label: "Results", icon: "check" }, { k: "judges", label: "Judges", icon: "star", hidden: true }, { k: "details", label: "Details", icon: "pencil" }, { k: "promote", label: "Promote", icon: "add" }, { k: "team", label: "Team", icon: "user" }, { k: "sponsors", label: "Sponsors", icon: "trophy" }],
  onPick: (k) => { panel = k; history.replaceState(null, "", "#" + k); showPanel(); window.scrollTo(0, 0); } });
const showPanel = () => { document.querySelectorAll("#app [data-p]").forEach((el) => (el.hidden = el.dataset.p !== panel)); shell.setActive(panel); };
let D = null, M = null, V = null, J = { judges: [] }, CH = [], SF = { staff: [], owner: "" }, ST = { views: 0, qr: 0, shares: 0, votesByDay: [], voters: 0, leads: [] }, ME = "";
const CROWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>';
const photoUrl = (k) => (k.startsWith("p/") ? "/api/photo/" + k : `/api/contests/${encodeURIComponent(slug)}/photo/${k}`);

// Photos for a home the organizer added herself: add or remove them here, and copy the private link the homeowner can use for the same (until voting closes).
function photosDialog(id) {
  const e = M.entries.find((x) => x.id === id); if (!e) return;
  const base = `/api/contests/${encodeURIComponent(slug)}/entries/${id}`, open = !!M.photosOpen;
  let photos = e.photos.slice(), link = e.photoLink || "", busy = false, note = "";
  const o = document.createElement("div"); o.className = "phscrim"; o.innerHTML = '<div class="phdlg" role="dialog" aria-modal="true" aria-labelledby="ph-t"></div>'; document.body.appendChild(o);
  const dlg = o.firstChild, prevFocus = document.activeElement;
  const close = () => { o.remove(); document.removeEventListener("keydown", onKey); if (prevFocus && prevFocus.focus) prevFocus.focus(); load(); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey); o.addEventListener("click", (ev) => { if (ev.target === o) close(); });
  const say = (m, bad) => { note = m; const n = dlg.querySelector("#ph-note"); if (n) { n.textContent = m; n.className = "small " + (bad ? "bad" : "muted"); } };
  const draw = () => {
    dlg.innerHTML = `<div class="phh"><h2 id="ph-t">Photos for ${esc(e.title || e.biz || "this home")}</h2><button class="btn ghost sm" type="button" id="ph-x" aria-label="Close">Close</button></div>
    <p class="muted small" style="margin:0">${esc(e.address)}</p>
    ${open ? "" : '<p class="small bad">Voting has closed, so photos can no longer be changed.</p>'}
    <div class="phgrid">${photos.length ? photos.map((k) => `<div class="phone"><img src="${esc(photoUrl(k))}" alt="">${open ? `<button type="button" data-rm="${esc(k)}" aria-label="Remove this photo" title="Remove this photo">&times;</button>` : ""}</div>`).join("") : '<p class="muted small">No photos yet.</p>'}</div>
    ${open ? `<label class="btn org phpick"><input type="file" id="ph-files" accept="image/jpeg,image/png,image/webp" multiple hidden>Add photos (${photos.length} of 8)</label>` : ""}
    <p id="ph-note" class="small muted" role="status">${esc(note)}</p>
    ${link ? `<div class="phlink"><b>Link for the homeowner</b><p class="muted small" style="margin:4px 0 8px">Send this to the homeowner so they can add or remove photos of their home themselves, with no sign-in. It works until voting ends on ${esc(fmt(D.contest.voteEnd))}. If it was shared by mistake, make a new link: the old one stops working.</p><div class="copy"><span>${esc(link)}</span><button class="btn ghost sm" type="button" id="ph-copy">Copy link</button></div>${open ? '<button class="btn ghost sm" type="button" id="ph-new" style="margin-top:8px">Make a new link</button>' : ""}</div>` : ""}`;
    dlg.querySelector("#ph-x").onclick = close; dlg.querySelector("#ph-x").focus();
    const f = dlg.querySelector("#ph-files");
    if (f) f.onchange = async () => {
      const list = [...f.files].slice(0, 8 - photos.length); if (!list.length || busy) return; busy = true; say("Uploading…");
      try {
        const fd = new FormData(); for (const file of list) fd.append("photos", await shrink(file), "photo.jpg");
        const r = await fetch(base + "/photos", { method: "POST", body: fd }), j = await r.json().catch(() => ({}));
        if (r.ok) { photos = j.photos; note = list.length === 1 ? "Photo added." : list.length + " photos added."; } else note = j.error || "That didn't upload. Please try again.";
      } catch { note = "Those photos couldn't be read. Try JPG, PNG or WebP photos."; }
      busy = false; draw();
    };
    dlg.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => {
      if (busy || !confirm("Remove this photo?")) return; busy = true;
      const r = await fetch(base + "/photos?key=" + encodeURIComponent(b.dataset.rm), { method: "DELETE" }), j = await r.json().catch(() => ({}));
      if (r.ok) { photos = j.photos; note = "Photo removed."; } else note = j.error || "That didn't work.";
      busy = false; draw();
    }));
    const cp = dlg.querySelector("#ph-copy"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(link); say("Link copied."); } catch { say("Select the link and copy it."); } };
    const nw = dlg.querySelector("#ph-new"); if (nw) nw.onclick = async () => {
      if (!confirm("Make a new link? The old link will stop working.")) return;
      const r = await fetch(base, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "newlink" }) }), j = await r.json().catch(() => ({}));
      if (r.ok) { link = j.link; note = "New link made. The old one no longer works."; } else note = j.error || "That didn't work.";
      draw();
    };
  };
  draw();
}

async function load() {
  const i = await me(true);
  if (!i.user) { shell.own(false); $("#app").innerHTML = `<div class="card center"><h1>Organizer sign-in</h1><p class="muted" style="max-width:44ch">Only the person who created this contest can see its entries and results.</p><button class="btn org" id="go" type="button">Sign in</button></div>`; $("#go").onclick = async () => { if (await signIn({ title: "Sign in to manage your contest", next: location.pathname })) { refreshAcct($("#acct")); load(); } }; return; }
  ME = (i.user.email || "").toLowerCase();
  const [a, b, vv, jj, sf, st, chr] = await Promise.all([fetch(`/api/contests/${encodeURIComponent(slug)}`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/manage`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/votes`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/judges`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/staff`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/stats`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/changes`, { cache: "no-store" })]);
  if (!a.ok || !b.ok || !(D = await a.json()).me.isOwner) { shell.own(false); $("#app").innerHTML = `<div class="card center"><h1>This isn't your contest</h1><p class="muted">You're signed in as ${esc(i.user.email)}. Sign in with the email you used to create the contest.</p><a class="btn" href="/">Back to the map</a></div>`; return; }
  M = await b.json(); V = vv.ok ? await vv.json() : { votes: [], locked: false }; J = jj.ok ? await jj.json() : { judges: [] }; if (sf.ok) SF = await sf.json(); if (st.ok) ST = await st.json(); if (chr.ok) CH = (await chr.json()).changes || []; document.title = "Dashboard: " + D.contest.name; render();
}

async function act(path, body, okMsg) {
  const r = await fetch(path, { method: path.includes("/entries/") || path.endsWith("/votes") ? "POST" : "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.error || "That didn't work. Try again.");
  if (okMsg) toast(okMsg); await load();
}

// Edit the contest's details. Dates, text, prizes and rules until winners are announced; categories only before the first vote.
function editCard() {
  const c = D.contest; if (c.announced) return "";
  const locked = V.votes.length > 0, fld = (l, h, c = "c6") => `<div class="ff ${c}"><label class="ffl"><span class="lt">${l}</span>${h}</label></div>`;
  const inp = (id, v, extra = "") => `<input ${id ? `id="${id}"` : ""} value="${esc(v)}" ${extra}>`;
  const per = c.prizeMode === "each" ? (D.prizes || []).map((p) => `<div class="small muted">${esc(p.category)}${c.mode === "both" ? " · " + esc(p.label) : ""}: ${esc(p.prize)}</div>`).join("") : "";
  return `<details class="card" id="editcard" open><summary style="cursor:pointer;font-size:19px;font-weight:600">Edit contest details</summary>
   <p class="muted small">Change the name, dates, welcome message, prize or rules any time before winners are announced. Entrants see changes right away.</p>
   <form id="editform" class="f" novalidate><fieldset class="fsec"><legend>Contest</legend><div class="fgrid">
    ${fld("Contest name", inp("e-name", c.name, 'maxlength="90"'), "c3")}${fld("Run by", inp("e-org", c.org, 'maxlength="80"'), "c3")}
    ${fld("Welcome message", `<textarea id="e-descr" maxlength="200" rows="3">${esc(c.descr)}</textarea>`)}
    </div></fieldset><fieldset class="fsec"><legend>Schedule</legend><p class="fdesc">Entries and voting open and close on these dates by themselves.</p><div class="fgrid">${fld("Entries close", inp("e-closes", c.entriesClose, 'type="date"'), "c2")}${fld("Voting starts", inp("e-vs", c.voteStart, 'type="date"'), "c2")}${fld("Voting ends", inp("e-ve", c.voteEnd, 'type="date"'), "c2")}</div></fieldset><fieldset class="fsec"><legend>Voting</legend><div class="fgrid">
    ${fld("Voting categories (one per line)", `<textarea id="e-cats" rows="4" ${locked ? "disabled" : ""}>${esc(c.categories.join("\n"))}</textarea>`)}${locked ? `<p class="small muted" style="margin:-6px 0 0">Locked: votes already belong to these categories.</p>` : ""}
    ${fld("Approving entries", `<select id="e-approval"><option value="manual" ${c.approval === "manual" ? "selected" : ""}>I approve each entry first</option><option value="auto" ${c.approval === "auto" ? "selected" : ""}>Entries go on the map right away</option></select>`)}
    </div></fieldset><fieldset class="fsec"><legend>Prize</legend><div class="fgrid">
    ${fld("Prize", `<select id="e-pmode"><option value="none" ${c.prizeMode === "none" ? "selected" : ""}>No prize</option><option value="one" ${c.prizeMode === "one" ? "selected" : ""}>One prize for every winner</option><option value="each" ${c.prizeMode === "each" ? "selected" : ""}>A different prize for each award</option></select>`)}
    <div id="e-onewrap" ${c.prizeMode === "one" ? "" : "hidden"}>${fld("Prize text", inp("e-prize", c.prize, 'maxlength="140"'))}</div>
    <div id="e-eachwrap" ${c.prizeMode === "each" ? "" : "hidden"}>${(D.prizes || []).length ? "" : ""}<div style="display:grid;gap:8px">${c.categories.flatMap((g) => [c.mode !== "judges" ? [g, "public", "People's Choice"] : null, c.mode !== "public" ? [g, "judge", "Judges' Choice"] : null]).filter(Boolean).map(([g, k, l]) => { const p = (D.prizes || []).find((x) => x.category === g && x.kind === k); return fld(esc(g) + (c.mode === "both" ? " · " + l : ""), inp("", p ? p.prize : "", `data-eprize="${esc(g + "|" + k)}" maxlength="100"`)); }).join("")}</div></div>
    ${fld("Prize provided by (optional)", inp("e-sponsor", c.sponsor, 'maxlength="80"'))}
    </div></fieldset><fieldset class="fsec"><legend>Presenting installer (optional)</legend><div class="fgrid"><p class="fdesc ff c6">Adds a "Get a quote" button to the contest page. Visitors who ask must agree to share their details; the request is emailed to the installer and to you.</p>
     ${fld("Installer name", inp("e-iname", (D.installer || {}).name || "", 'maxlength="80"'))}${fld("Where quote requests go (email)", inp("e-iemail", D.installerEmail || "", 'type="email" maxlength="120"'))}${fld("Installer website", inp("e-iurl", (D.installer || {}).url || "", 'maxlength="200"'))}</div></fieldset>
    <fieldset class="fsec"><legend>Official rules</legend><div class="fgrid">${fld("Rules", `<textarea id="e-rules" rows="10" maxlength="4000">${esc(c.rules)}</textarea>`)}</div></fieldset>
    <p class="err" id="e-err" role="alert" hidden></p>
    <div class="mfoot sticky"><button class="btn org" type="submit">Save changes</button></div></form></details>`;
}

const ago = (at) => { const t = new Date(String(at || "").replace(" ", "T") + "Z").getTime(), m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
// The team sees who changed which setting
function teamBanner() {
  const c = CH.find((x) => (x.by_email || "").toLowerCase() !== ME); if (!c || Date.now() - new Date(c.at.replace(" ", "T") + "Z").getTime() > 7 * 86400000) return "";
  return `<div class="status ok" style="display:block"><b>${esc(c.by_name || c.by_email)}</b> changed <b>${esc(c.field)}</b>${c.old || c.new ? `: <span style="text-decoration:line-through;opacity:.7">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")}` : ""} <span class="small muted">· ${esc(ago(c.at))}</span> <a href="#teamact">See all changes</a></div>`;
}
function teamCard() {
  return `<div class="card" id="teamact"><h2 style="font-size:19px">What the team changed</h2><p class="muted small">Everyone who runs this contest is emailed when someone else changes a setting. Here is who changed what, newest first.</p>${CH.length ? `<ul class="chg" style="margin:0">${CH.map((c) => `<li><span class="who">${esc(c.by_name || c.by_email)}${(c.by_email || "").toLowerCase() === ME ? " (you)" : ""}</span> changed <b>${esc(c.field)}</b>${c.old || c.new ? `: <span class="was">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")}` : ""} <span class="muted">· ${esc(ago(c.at))}</span></li>`).join("")}</ul>` : `<p class="muted small">No changes yet.</p>`}</div>`;
}

// Co-organizers (only the creator can add or remove them)
function staffCard() {
  const isOwner = ME && ME === (SF.owner || "").toLowerCase();
  return `<div class="card"><h2 style="font-size:19px">Co-organizers</h2><p class="muted small">People you add sign in with their own email and get this same dashboard. You can add up to 8.</p>
   <div class="list"><div class="rowi"><div><b>${esc(SF.owner || "You")}</b><br><span class="small muted">Creator</span></div></div>${SF.staff.map((x) => `<div class="rowi"><div><b>${esc(x.email)}</b><br><span class="small muted">Co-organizer</span></div>${isOwner ? `<div class="acts"><button class="btn ghost sm" type="button" data-rmstaff="${esc(x.email)}">Remove</button></div>` : ""}</div>`).join("")}</div>
   ${isOwner ? `<div class="f">${fsec("Add a co-organizer", "", ff("Their email", `<input id="newstaff" type="email" inputmode="email" placeholder="name@example.com">`, { hint: "They sign in with this email." }))}<p class="err" id="serr" role="alert" hidden></p><div class="mfoot"><button class="btn org" type="button" id="addstaff">Add co-organizer</button></div></div>` : `<p class="small muted">Only the creator can add or remove co-organizers.</p>`}</div>`;
}
const TIERS = { presenting: "Presenting sponsor", gold: "Gold", silver: "Silver", prize: "Prize sponsor" };
const METHODS = ["Cash", "Check", "Bank transfer", "Card on my own system", "Invoice paid"];
const smoney = (c) => (c == null ? "" : "$" + (c % 100 ? (c / 100).toFixed(2) : c / 100));
const spState = (x) => x.hidden_by_admin ? "Hidden by SoCal Lights" : x.shown ? "Shown on the contest page" : !x.basis ? "Not confirmed: not shown" : !x.show_public ? "Saved, not shown (you chose to keep it off the page)" : "Not shown: permission not ticked";
const chk = (id, text) => `<div class="ff c6"><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="${id}" style="margin-top:4px"><span>${text}</span></label></div>`;
function sponsorsCard() {
  const L = [...(D.sponsors || [])].sort((a, b) => (b.status === "submitted") - (a.status === "submitted"));
  return `<div class="card"><h2 style="font-size:19px">Sponsors</h2><p class="muted small">Record a sponsor who paid you. Their logo, name and link appear on the contest page, labelled "Sponsor", only when you confirm you collected the payment (or that it was donated in kind), tick that you have their permission, and choose to show it. Sponsors do not influence results, and payment never affects who wins.</p>

    if (leftover) { box.value = leftover; leftover = ""; $("#addcard").open = true; }
  }
  document.querySelectorAll("[data-rmadded]").forEach((b) => (b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to remove"; return; } act(`/api/contests/${encodeURIComponent(slug)}/entries/${b.dataset.rmadded}`, { action: "decline" }, "Removed."); }));
  document.querySelectorAll("[data-entry]").forEach((b) => (b.onclick = async () => { const [a, id] = b.dataset.entry.split(":"); let reason = ""; if (a === "decline") { reason = await askReason(); if (reason === null) return; } act(`/api/contests/${encodeURIComponent(slug)}/entries/${id}`, { action: a, reason }, ({ approve: "Approved. It's on the map, and the entrant was emailed.", restore: "Back in the review list.", decline: "Declined. The entrant was emailed.", flag: "Flagged. It stays on the ballot and is removed from the winners when you announce.", unflag: "Flag removed." })[a]); }));
  document.querySelectorAll("[data-void]").forEach((b) => (b.onclick = () => { const [id, v] = b.dataset.void.split(":"); act(`/api/contests/${encodeURIComponent(slug)}/votes`, { vote_id: id, voided: v === "1" }, v === "1" ? "Vote voided. It no longer counts." : "Vote restored."); }));
  document.querySelectorAll("[data-photos]").forEach((b) => (b.onclick = () => photosDialog(b.dataset.photos)));
  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => { const o = b.textContent; try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select it"; } setTimeout(() => (b.textContent = o), 1500); }));
}
noteSigninResult(); load(); { const pq = new URLSearchParams(location.search).get("pass"); if (pq === "paid") toast("Payment received. Your contest pass is active in a moment; then you can run your contest again."); else if (pq === "cancelled") toast("Payment cancelled. Nothing was charged."); }
</script>
