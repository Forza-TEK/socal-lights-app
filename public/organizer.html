<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Contest dashboard · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261102f">
<link rel="stylesheet" href="/contest.css?v=20261102a">
<style>main{max-width:900px}.thumb{width:56px;height:42px;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}</style>
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<div class="crumb wide"><a id="back" href="/">← See it as voters do</a></div>
<main class="cmain wide">
<div id="app"><p class="loading">Loading your dashboard…</p></div>
</main>
<script src="/vendor/qrcode.js"></script>
<script type="module">
import { me, signIn, noteSigninResult, esc, toast } from "/auth.js?v=20261101a";
import { themeBtn, mountAcct, refreshAcct } from "/addflow.js?v=20261102b";
const $ = (q) => document.querySelector(q), slug = location.pathname.split("/")[2] || "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = (s) => { const [, m, d] = s.split("-").map(Number); return MON[m - 1] + " " + d; };
const initials = (o) => (o.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "EN").toUpperCase();
$("#back").href = "/c/" + slug;
let D = null, M = null, V = null, J = { judges: [] }, CH = [], SF = { staff: [], owner: "" }, ST = { views: 0, qr: 0, shares: 0, votesByDay: [], voters: 0, leads: [] }, ME = "";
const CROWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>';
const photoUrl = (k) => (k.startsWith("p/") ? "/api/photo/" + k : `/api/contests/${encodeURIComponent(slug)}/photo/${k}`);

async function load() {
  const i = await me(true);
  if (!i.user) { $("#app").innerHTML = `<div class="card center"><h1>Organizer sign-in</h1><p class="muted" style="max-width:44ch">Only the person who created this contest can see its entries and results.</p><button class="btn org" id="go" type="button">Sign in</button></div>`; $("#go").onclick = async () => { if (await signIn({ title: "Sign in to manage your contest", next: location.pathname })) { refreshAcct($("#acct")); load(); } }; return; }
  ME = (i.user.email || "").toLowerCase();
  const [a, b, vv, jj, sf, st, chr] = await Promise.all([fetch(`/api/contests/${encodeURIComponent(slug)}`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/manage`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/votes`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/judges`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/staff`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/stats`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/changes`, { cache: "no-store" })]);
  if (!a.ok || !b.ok || !(D = await a.json()).me.isOwner) { $("#app").innerHTML = `<div class="card center"><h1>This isn't your contest</h1><p class="muted">You're signed in as ${esc(i.user.email)}. Sign in with the email you used to create the contest.</p><a class="btn" href="/">Back to the map</a></div>`; return; }
  M = await b.json(); V = vv.ok ? await vv.json() : { votes: [], locked: false }; J = jj.ok ? await jj.json() : { judges: [] }; if (sf.ok) SF = await sf.json(); if (st.ok) ST = await st.json(); if (chr.ok) CH = (await chr.json()).changes || []; document.title = "Dashboard: " + D.contest.name; render();
}

async function act(path, body, okMsg) {
  const r = await fetch(path, { method: path.includes("/entries/") || path.endsWith("/votes") ? "POST" : "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.error || "That didn't work. Try again.");
  if (okMsg) toast(okMsg); await load();
}

// Edit the contest's details. Dates, text, prizes and rules until winners are announced; categories only before the first vote.
function editCard() {
  const c = D.contest; if (c.announced) return "";
  const locked = V.votes.length > 0, fld = (l, h) => `<label style="display:grid;gap:4px;font-size:14px;font-weight:600">${l}${h}</label>`;
  const inp = (id, v, extra = "") => `<input ${id ? `id="${id}"` : ""} value="${esc(v)}" ${extra} style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px;min-width:0">`;
  const per = c.prizeMode === "each" ? (D.prizes || []).map((p) => `<div class="small muted">${esc(p.category)}${c.mode === "both" ? " · " + esc(p.label) : ""}: ${esc(p.prize)}</div>`).join("") : "";
  return `<details class="card" id="editcard"><summary style="cursor:pointer;font-size:19px;font-weight:600">Edit contest details</summary>
   <p class="muted small">Change the name, dates, welcome message, prize or rules any time before winners are announced. Entrants see changes right away.</p>
   <form id="editform" style="display:grid;gap:12px;max-width:640px">
    ${fld("Contest name", inp("e-name", c.name, 'maxlength="90"'))}${fld("Run by", inp("e-org", c.org, 'maxlength="80"'))}
    ${fld("Welcome message", `<textarea id="e-descr" maxlength="200" rows="3" style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px">${esc(c.descr)}</textarea>`)}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">${fld("Entries close", inp("e-closes", c.entriesClose, 'type="date"'))}${fld("Voting starts", inp("e-vs", c.voteStart, 'type="date"'))}${fld("Voting ends", inp("e-ve", c.voteEnd, 'type="date"'))}</div>
    ${fld("Voting categories (one per line)", `<textarea id="e-cats" rows="4" ${locked ? "disabled" : ""} style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px">${esc(c.categories.join("\n"))}</textarea>`)}${locked ? `<p class="small muted" style="margin:-6px 0 0">Locked: votes already belong to these categories.</p>` : ""}
    ${fld("Approving entries", `<select id="e-approval" style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px"><option value="manual" ${c.approval === "manual" ? "selected" : ""}>I approve each entry first</option><option value="auto" ${c.approval === "auto" ? "selected" : ""}>Entries go on the map right away</option></select>`)}
    ${fld("Prize", `<select id="e-pmode" style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px"><option value="none" ${c.prizeMode === "none" ? "selected" : ""}>No prize</option><option value="one" ${c.prizeMode === "one" ? "selected" : ""}>One prize for every winner</option><option value="each" ${c.prizeMode === "each" ? "selected" : ""}>A different prize for each award</option></select>`)}
    <div id="e-onewrap" ${c.prizeMode === "one" ? "" : "hidden"}>${fld("Prize text", inp("e-prize", c.prize, 'maxlength="140"'))}</div>
    <div id="e-eachwrap" ${c.prizeMode === "each" ? "" : "hidden"}>${(D.prizes || []).length ? "" : ""}<div style="display:grid;gap:8px">${c.categories.flatMap((g) => [c.mode !== "judges" ? [g, "public", "People's Choice"] : null, c.mode !== "public" ? [g, "judge", "Judges' Choice"] : null]).filter(Boolean).map(([g, k, l]) => { const p = (D.prizes || []).find((x) => x.category === g && x.kind === k); return fld(esc(g) + (c.mode === "both" ? " · " + l : ""), inp("", p ? p.prize : "", `data-eprize="${esc(g + "|" + k)}" maxlength="100"`)); }).join("")}</div></div>
    ${fld("Prize provided by (optional)", inp("e-sponsor", c.sponsor, 'maxlength="80"'))}
    <fieldset style="border:1px solid var(--line,#ddd);border-radius:12px;padding:12px;display:grid;gap:10px"><legend style="font-weight:600;font-size:14px">Presenting installer (optional)</legend>
     <p class="small muted" style="margin:0">Adds a "Get a quote" button to the contest page. Visitors who ask must agree to share their details; the request is emailed to the installer and to you.</p>
     ${fld("Installer name", inp("e-iname", (D.installer || {}).name || "", 'maxlength="80"'))}${fld("Where quote requests go (email)", inp("e-iemail", D.installerEmail || "", 'type="email" maxlength="120"'))}${fld("Installer website", inp("e-iurl", (D.installer || {}).url || "", 'maxlength="200"'))}</fieldset>
    ${fld("Official rules", `<textarea id="e-rules" rows="10" maxlength="4000" style="font:inherit;font-weight:400;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px">${esc(c.rules)}</textarea>`)}
    <p class="err" id="e-err" role="alert" hidden></p>
    <div><button class="btn org" type="submit">Save changes</button></div></form></details>`;
}

const ago = (at) => { const t = new Date(String(at || "").replace(" ", "T") + "Z").getTime(), m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
// The team sees who changed which setting
function teamBanner() {
  const c = CH.find((x) => (x.by_email || "").toLowerCase() !== ME); if (!c || Date.now() - new Date(c.at.replace(" ", "T") + "Z").getTime() > 7 * 86400000) return "";
  return `<div class="status ok" style="display:block"><b>${esc(c.by_name || c.by_email)}</b> changed <b>${esc(c.field)}</b>${c.old || c.new ? `: <span style="text-decoration:line-through;opacity:.7">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")}` : ""} <span class="small muted">· ${esc(ago(c.at))}</span> <a href="#teamact">See all changes</a></div>`;
}
function teamCard() {
  return `<div class="card" id="teamact"><h2 style="font-size:19px">What the team changed</h2><p class="muted small">Everyone who runs this contest is emailed when someone else changes a setting. Here is who changed what, newest first.</p>${CH.length ? `<ul class="chg" style="margin:0">${CH.map((c) => `<li><span class="who">${esc(c.by_name || c.by_email)}${(c.by_email || "").toLowerCase() === ME ? " (you)" : ""}</span> changed <b>${esc(c.field)}</b>${c.old || c.new ? `: <span class="was">${esc(c.old || "(blank)")}</span> &rarr; ${esc(c.new || "(blank)")}` : ""} <span class="muted">· ${esc(ago(c.at))}</span></li>`).join("")}</ul>` : `<p class="muted small">No changes yet.</p>`}</div>`;
}

// Co-organizers (only the creator can add or remove them)
function staffCard() {
  const isOwner = ME && ME === (SF.owner || "").toLowerCase();
  return `<div class="card"><h2 style="font-size:19px">Co-organizers</h2><p class="muted small">People you add sign in with their own email and get this same dashboard. You can add up to 8.</p>
   <div class="list"><div class="rowi"><div><b>${esc(SF.owner || "You")}</b><br><span class="small muted">Creator</span></div></div>${SF.staff.map((x) => `<div class="rowi"><div><b>${esc(x.email)}</b><br><span class="small muted">Co-organizer</span></div>${isOwner ? `<div class="acts"><button class="btn ghost sm" type="button" data-rmstaff="${esc(x.email)}">Remove</button></div>` : ""}</div>`).join("")}</div>
   ${isOwner ? `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px"><input id="newstaff" type="email" inputmode="email" placeholder="name@example.com" style="min-width:0;flex:1 1 200px" aria-label="Co-organizer's email"><button class="btn ghost" type="button" id="addstaff">Add co-organizer</button></div><p class="err" id="serr" role="alert" hidden></p>` : `<p class="small muted">Only the creator can add or remove co-organizers.</p>`}</div>`;
}
const TIERS = { presenting: "Presenting sponsor", gold: "Gold", silver: "Silver", prize: "Prize sponsor" };
function sponsorsCard() {
  const L = D.sponsors || [];
  return `<div class="card"><h2 style="font-size:19px">Sponsors</h2><p class="muted small">Logos and names appear on the contest page, largest tier first. Sponsors can pay you directly; payment never affects who wins.</p>
   ${L.length ? `<div class="list">${L.map((x) => `<div class="rowi"><div style="display:flex;gap:10px;align-items:center">${x.logo ? `<img src="/api/contests/${encodeURIComponent(slug)}/sponsors?id=${esc(x.id)}" alt="" style="width:48px;height:36px;object-fit:contain">` : ""}<div><b>${esc(x.name)}</b><br><span class="small muted">${esc(TIERS[x.tier] || "Sponsor")}</span></div></div>${c_sp(x)}</div>`).join("")}</div>` : `<p class="muted">No sponsors yet.</p>`}
   <form id="spform" style="display:grid;gap:10px;margin-top:10px;max-width:520px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px"><input id="sp-name" placeholder="Sponsor name" maxlength="80" aria-label="Sponsor name" style="min-width:0"><select id="sp-tier" aria-label="Tier">${Object.entries(TIERS).map(([k, v]) => `<option value="${k}" ${k === "prize" ? "selected" : ""}>${v}</option>`).join("")}</select></div>
   <input id="sp-url" placeholder="Website (optional)" maxlength="200" aria-label="Sponsor website"><label class="small muted">Logo (optional, JPG, PNG or WebP under 600 KB)<input id="sp-logo" type="file" accept="image/jpeg,image/png,image/webp"></label>
   <p class="err" id="sp-err" role="alert" hidden></p><div><button class="btn ghost" type="submit">Add sponsor</button></div></form></div>`;
}
const c_sp = (x) => `<div class="acts"><button class="btn ghost sm" type="button" data-rmsp="${esc(x.id)}">Remove</button></div>`;
function statsCard() {
  const days = ST.votesByDay.slice(-14), mx = Math.max(1, ...days.map((d) => d.n));
  return `<div class="card"><h2 style="font-size:19px">Activity</h2><div class="stats"><div class="stat"><b>${ST.views}</b><span>Page visits</span></div><div class="stat"><b>${ST.qr}</b><span>From the QR code</span></div><div class="stat"><b>${ST.voters}</b><span>People who voted</span></div></div>
   ${days.length ? `<h3 style="margin-top:14px;font-size:15px">Votes per day</h3><div style="display:grid;gap:4px">${days.map((d) => `<div style="display:grid;grid-template-columns:56px 1fr 30px;gap:8px;align-items:center;font-size:13px"><span class="muted">${esc(fmt(d.day))}</span><div class="rbar"><i style="width:${d.n / mx * 100}%"></i></div><span>${d.n}</span></div>`).join("")}</div>` : `<p class="muted small">Votes per day will show here once voting starts.</p>`}
   ${D.installer ? `<h3 style="margin-top:14px;font-size:15px">Quote requests (${ST.leads.length})</h3>${ST.leads.length ? `<div class="list">${ST.leads.map((l) => `<div class="rowi"><div><b>${esc(l.name)}</b> <span class="small muted">${esc(l.email)}${l.phone ? " · " + esc(l.phone) : ""}</span>${l.note ? `<br><span class="small">${esc(l.note)}</span>` : ""}</div></div>`).join("")}</div>` : `<p class="muted small">None yet.</p>`}` : ""}</div>`;
}

// Invite neighbors by email, and run the contest again next year
function inviteCard() {
  const c = D.contest; if (c.announced || c.status !== "live") return "";
  return `<details class="card" id="invitecard"><summary style="cursor:pointer;font-size:19px;font-weight:600">Invite neighbors by email</summary><p class="muted small">Paste email addresses, one per line (up to 50 at a time). Each person gets a link to enter their home or vote. Only invite people who would expect to hear from you.</p>
   <form id="inviteform" style="display:grid;gap:10px;max-width:560px"><textarea id="iv-list" rows="5" placeholder="neighbor@example.com" aria-label="Email addresses"></textarea><input id="iv-note" maxlength="300" placeholder="Add a short note (optional)" aria-label="Note"><p class="err" id="iv-err" role="alert" hidden></p><div><button class="btn org" type="submit">Send invitations</button></div></form></details>`;
}
function againCard() {
  return `<div class="card"><h2 style="font-size:19px">Run it again</h2><p class="muted small">Starts a new contest with the same rules, categories, prizes, sponsors and judges, and every date a year later. You can edit it before it opens.</p><div><button class="btn ghost" type="button" id="runagain">Run this contest again next year</button></div></div>`;
}

function render() {
  const c = D.contest, url = location.origin + "/c/" + c.slug, short = url.replace(/^https?:\/\//, "");
  const entries = M.entries, waiting = entries.filter((e) => e.status === "pending").length, live = D.entries;
  const votes = live.reduce((n, e) => n + Object.values(e.votes || {}).reduce((x, y) => x + y, 0), 0);
  let qr = ""; try { const q = qrcode(0, "M"); q.addData(url + "?src=qr"); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch {}
  const sw = (label, sub, on, action, onLabel, offLabel) => `<div class="sw"><span>${label}<small>${sub}</small></span><button class="btn ghost sm" type="button" data-act="${action}">${on ? offLabel : onLabel}</button></div>`;
  const pub = c.mode !== "judges", hasJ = c.mode !== "public", both = c.mode === "both", score = c.judgeMethod === "score";
  const jnum = (e, g) => { const v = e.jv && e.jv[g]; return v && typeof v === "object" ? v.avg : v || 0; };
  const jtxt = (e, g) => { const v = e.jv && e.jv[g]; return v && typeof v === "object" ? `${v.avg.toFixed(1)} avg (${v.n}${v.tr ? ", high and low dropped" : ""})` : score ? "No scores" : String(v || 0); };
  const block = (g, kind) => { const isJ = kind === "judge", val = (e) => (isJ ? jnum(e, g) : e.votes?.[g] || 0), L = live.slice().sort((a, b) => val(b) - val(a)), mx = isJ && score ? 10 : Math.max(1, ...L.map(val)), win = new Set((isJ ? (D.jwinners || {})[g] : D.winners[g]) || []);
    return `<div style="display:grid;gap:8px">${both ? `<span class="small muted">${isJ ? "Judges' Choice" : "People's Choice"}</span>` : ""}${L.length ? L.map((e) => `<div style="display:grid;gap:4px"><div style="display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px"><span>${esc(e.name)}</span><span>${isJ ? esc(jtxt(e, g)) : e.votes?.[g] ?? 0}${win.has(e.id) ? " " + CROWN + ' <span class="pill p-ok">Winner</span>' : ""}</span></div><div class="rbar"><i style="width:${val(e) / mx * 100}%"></i></div></div>`).join("") : '<p class="muted small">No approved homes yet.</p>'}</div>`; };
  const prizeOf = (g, k) => (D.prizes || []).find((p) => p.category === g && p.kind === k);
  const results = c.categories.map((g) => `<div style="display:grid;gap:10px"><h3>${esc(g)}</h3>${[pub ? ["public"] : null, hasJ ? ["judge"] : null].filter(Boolean).map(([k]) => (prizeOf(g, k) ? `<p class="small muted" style="margin:0">Prize${both ? " (" + (k === "judge" ? "Judges' Choice" : "People's Choice") + ")" : ""}: ${esc(prizeOf(g, k).prize)}</p>` : "") + block(g, k)).join("")}</div>`).join("");
  // What the winners would be if you announced right now (public votes only; judges' scores are shown in each bar)
  const preview = c.announced || !pub ? "" : `<div class="status ok" style="display:block"><b>If you announced today</b>${c.categories.map((g) => { const ok = live.filter((e) => !e.flagged), top = Math.max(0, ...ok.map((e) => e.votes?.[g] || 0)), w = top ? ok.filter((e) => (e.votes?.[g] || 0) === top).map((e) => e.name) : []; return `<div class="small">${esc(g)}: ${w.length ? esc(w.join(" and ")) + (w.length > 1 ? " (tied, they share the win)" : "") : "no votes yet"}</div>`; }).join("")}<div class="small muted">Ties are shared. Disqualified homes can't win.</div></div>`;
  const judgesCard = () => !hasJ ? "" : `<div class="card"><h2 style="font-size:19px">Judges</h2><p class="muted small">${score ? "Judges score every home 1 to 10 in each category." : "Judges pick a favorite in each category."} They vote separately from the public and can't judge their own home. Invitations are emailed; you can also copy each judge's link.</p>
    ${(J.judges || []).length ? `<div class="list">${J.judges.map((j) => `<div class="rowi"><div><b>${esc(j.email)}</b><br><span class="small muted">${j.joined ? "Signed in" : "Invited"} · ${j.done} of ${j.total} done</span></div><div class="acts"><button class="btn ghost sm" type="button" data-copy="${esc(location.origin + "/c/" + c.slug + "/judge")}">Copy link</button>${c.announced ? "" : `<button class="btn ghost sm" type="button" data-rmjudge="${esc(j.id)}">Remove</button>`}</div></div>`).join("")}</div>` : `<p class="muted">No judges yet.</p>`}
    ${!c.announced && (J.judges || []).some((j) => j.done < j.total) ? `<div style="margin-top:6px"><button class="btn ghost sm" type="button" id="nudgejudges">Remind the judges who have not finished</button></div>` : ""}${c.announced ? "" : `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px"><input id="newjudge" type="email" inputmode="email" placeholder="judge@example.com" style="min-width:0;flex:1 1 200px" aria-label="Judge's email"><button class="btn ghost" type="button" id="addjudge">Add judge</button></div><p class="err" id="jerr" role="alert" hidden></p>`}</div>`;
  $("#app").innerHTML = `${c.status !== "live" ? `<div class="status no"><span><b>Waiting for approval.</b> A person checks new contests, usually within a day. Your link and QR code already work, but the contest isn't on the map and entries are paused until then.</span></div>` : ""}
  <div class="card"><div class="banner"><div class="logo" aria-hidden="true">${esc(initials(c.org))}</div><div><h1>${esc(c.name)}</h1><span>${esc(c.org)} · ${esc(c.city)}</span></div></div>
  <div class="stats"><div class="stat"><b>${entries.length}</b><span>Entries</span></div><div class="stat"><b>${waiting}</b><span>Waiting for you</span></div><div class="stat"><b>${votes}</b><span>Votes</span></div></div>
  ${teamBanner()}
  ${c.announced ? "" : `<ol class="steps" aria-label="Next steps">${[[entries.length > 0, "Share your link or QR code (Share it, below)"], [entries.length > 0 && !waiting, waiting ? `Approve the ${waiting} waiting ${waiting > 1 ? "entries" : "entry"}` : "Approve entries as they arrive"], [votes > 0, "Voting: neighbors vote for their favorites"], [false, "Announce the winners when voting ends"]].map(([d, t]) => `<li class="${d ? "done" : ""}">${d ? "✓ " : ""}${t}</li>`).join("")}</ol>`}
  ${waiting ? `<div class="status no">${waiting} ${waiting > 1 ? "entries need" : "entry needs"} your OK before ${waiting > 1 ? "they appear" : "it appears"} on the map. See Entries below.</div>` : ""}</div>
  <div class="grid2"><div class="card"><h2 style="font-size:19px">Controls</h2><p class="muted small">Dates run entries and voting by themselves. These buttons override them.</p><div>
    <p class="small" style="margin:0 0 6px"><b>Schedule:</b> entries until ${fmt(c.entriesClose)} · voting ${fmt(c.voteStart)} to ${fmt(c.voteEnd)}. <a href="#editcard" id="editdates">Change dates</a></p>
    ${sw("Entries", c.entriesOpen ? `Open until ${fmt(c.entriesClose)}` : "Closed", c.entriesOpen, c.entriesOpen ? "close_entries" : "open_entries", "Open entries", "Close entries")}
    ${c.votingOpen || c.votingPaused ? sw("Voting", c.votingOpen ? `Open until ${fmt(c.voteEnd)}` : "Paused by you", c.votingOpen, c.votingOpen ? "pause_voting" : "resume_voting", "Resume voting", "Pause voting") : `<div class="sw"><span>Voting<small>${c.announced ? "Over" : `Starts ${fmt(c.voteStart)}`}</small></span>${c.announced ? "" : `<button class="btn org sm" type="button" data-act="start_voting">Start now</button>`}</div>`}
    ${sw("Vote counts", c.showCounts ? "Visible to everyone" : "Hidden until winners", c.showCounts, c.showCounts ? "hide_counts" : "show_counts", "Show counts", "Hide counts")}</div></div>
   <div class="card"><h2 style="font-size:19px">Share it</h2><div class="copy"><span>${esc(short)}</span><button class="btn ghost sm" type="button" data-copy="${esc(url)}">Copy link</button></div><div class="poster"><b>${esc(c.name)}</b>${qr}<small>Scan to enter your home. Free.</small></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" type="button" id="printposter">Print entry poster</button><button class="btn ghost sm" type="button" id="printsign">Print yard sign</button></div></div></div>
  ${inviteCard()}${editCard()}
  <div class="card"><h2 style="font-size:19px">Entries</h2>${entries.length ? `<div class="tbl ent"><table><thead><tr><th>Photo</th><th>No.</th><th>Entry</th><th>Address</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>${entries.map((e) => `<tr><td data-l="Photo">${e.photos[0] ? `<img class="thumb" src="${esc(photoUrl(e.photos[0]))}" alt="">` : ""}</td><td data-l="No."><b>${e.entry_no}</b></td><td data-l="Entry">${esc(e.title || e.biz)}</td><td data-l="Address">${esc(e.address)}</td><td data-l="Contact">${esc(e.contact || "")}</td><td data-l="Status">${e.status === "approved" ? '<span class="pill p-ok">On the map</span>' : e.status === "declined" ? '<span class="pill p-no">Declined</span>' : '<span class="pill p-wait">Needs your OK</span>'}</td><td>${e.dq ? '<span class="pill p-wait">Removed at close</span> ' : ""}${e.status === "approved" && !c.announced ? `<button class="btn ghost sm" data-entry="${e.dq ? "unflag" : "flag"}:${e.id}" type="button">${e.dq ? "Undo flag" : "Disqualify at close"}</button>` : ""}${e.status === "declined" && e.photos.length ? `<button class="btn ghost sm" data-entry="restore:${e.id}" type="button">Undo decline</button>` : ""}${e.status === "pending" ? `<div class="actions"><button class="btn org sm" data-entry="approve:${e.id}" type="button">Approve</button><button class="btn bad sm" data-entry="decline:${e.id}" type="button">Decline</button></div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No entries yet. Share the link or print the poster to get started.</p>`}</div>
  ${judgesCard()}
  <div class="card"><h2 style="font-size:19px">Results${c.announced ? " (announced)" : " so far"}</h2>${preview}${results}<div class="actions"><a class="btn ghost" href="/api/contests/${encodeURIComponent(slug)}/export">Download results (spreadsheet)</a><button class="btn org" type="button" data-act="announce" ${c.announced || c.status !== "live" ? "disabled" : ""}>${c.announced ? "Winners announced" : "Close voting and announce winners"}</button></div><p class="small muted">You always see the full tally, even when it is hidden from the public. Announcing ends voting, locks the final results exactly as they are, shows everyone the winners and emails every entrant. Tied homes share the win.</p></div>
  ${pub ? `<details class="card" id="votecard"><summary style="cursor:pointer;font-size:19px;font-weight:600">Review individual votes <span class="small muted" style="font-weight:400">(${V.votes.length}${V.votes.some((v) => v.flags.length) ? ", " + V.votes.filter((v) => v.flags.length).length + " flagged" : ""})</span></summary><p class="muted small">Throwaway emails can't sign in. Suspicious patterns are flagged here, and you can void any vote. A voided vote stops counting right away and you can restore it${V.locked ? ". Results are locked now" : ""}.</p>${V.votes.length ? `<div class="tbl"><table><thead><tr><th>Voter</th><th>Vote</th><th>When</th><th></th></tr></thead><tbody>${V.votes.map((v) => `<tr><td${v.voided ? ' style="text-decoration:line-through"' : ""}>${esc(v.email)}</td><td>${esc(v.category)} → ${esc(v.entry)}${v.flags.length ? `<br><span class="pill p-wait">Flagged</span> <span class="small muted">${esc(v.flags[0])}</span>` : ""}${v.voided ? ' <span class="pill p-no">Voided</span>' : ""}</td><td class="small muted">${esc(v.at)}</td><td>${V.locked ? "" : `<button class="btn ghost sm" data-void="${esc(v.id)}:${v.voided ? 0 : 1}" type="button">${v.voided ? "Restore" : "Void"}</button>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No votes yet.</p>`}</details>` : ""}
  ${teamCard()}${statsCard()}${sponsorsCard()}${staffCard()}${againCard()}`;
  const ivf = $("#inviteform"); if (ivf) ivf.onsubmit = async (ev) => { ev.preventDefault(); const er = $("#iv-err"); er.hidden = true; const r = await asj("invite", "POST", { emails: $("#iv-list").value, note: $("#iv-note").value }), j = await r.json().catch(() => ({})); if (!r.ok) { er.textContent = j.error || "That didn't send."; er.hidden = false; return; } toast(`Sent ${j.sent} of ${j.count} invitation${j.count === 1 ? "" : "s"}.`); $("#iv-list").value = ""; };
  const ra = $("#runagain"); if (ra) ra.onclick = async () => { if (!ra.dataset.sure) { ra.dataset.sure = "1"; ra.textContent = "Tap again to create next year's contest"; return; } ra.disabled = true; const r = await fetch(`/api/contests/${encodeURIComponent(slug)}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "clone" }) }), j = await r.json().catch(() => ({})); if (!r.ok) { ra.disabled = false; toast(j.error || "That didn't work."); return; } toast("New contest created."); location.href = "/c/" + j.slug + "/manage"; };
  const nj = $("#nudgejudges"); if (nj) nj.onclick = async () => { nj.disabled = true; const r = await asj("nudge", "POST"), j = await r.json().catch(() => ({})); nj.disabled = false; toast(r.ok ? `Reminded ${j.sent} judge${j.sent === 1 ? "" : "s"}.` : (j.error || "That didn't work.")); };
  const printSheet = (html, cls) => { const o = document.createElement("div"); o.id = "printsheet"; o.className = cls; o.innerHTML = html; document.body.appendChild(o); document.body.classList.add("printing"); const done = () => { document.body.classList.remove("printing"); o.remove(); removeEventListener("afterprint", done); }; addEventListener("afterprint", done); print(); };
  const pp = $("#printposter"); if (pp) pp.onclick = () => printSheet(document.querySelector(".poster").innerHTML, "");
  const ps = $("#printsign"); if (ps) ps.onclick = () => printSheet(`<div class="big">VOTE!</div><b>${esc(c.name)}</b>${document.querySelector(".poster svg").outerHTML}<small>Scan to vote for your favorite home. Free.</small>`, "sign");
  const asj = (path, method, body) => fetch(`/api/contests/${encodeURIComponent(slug)}/${path}`, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const as = $("#addstaff"); if (as) as.onclick = async () => { const er = $("#serr"); er.hidden = true; const r = await asj("staff", "POST", { email: $("#newstaff").value }), j = await r.json().catch(() => ({})); if (!r.ok) { er.textContent = j.error || "That didn't work."; er.hidden = false; return; } toast("Co-organizer added and emailed."); load(); };
  document.querySelectorAll("[data-rmstaff]").forEach((b) => (b.onclick = async () => { await asj("staff?email=" + encodeURIComponent(b.dataset.rmstaff), "DELETE"); toast("Removed."); load(); }));
  const spf = $("#spform"); if (spf) spf.onsubmit = async (ev) => { ev.preventDefault(); const er = $("#sp-err"); er.hidden = true; const fd = new FormData(); fd.append("name", $("#sp-name").value); fd.append("tier", $("#sp-tier").value); fd.append("url", $("#sp-url").value); const f = $("#sp-logo").files[0]; if (f) fd.append("logo", f); const r = await fetch(`/api/contests/${encodeURIComponent(slug)}/sponsors`, { method: "POST", body: fd }), j = await r.json().catch(() => ({})); if (!r.ok) { er.textContent = j.error || "That didn't save."; er.hidden = false; return; } toast("Sponsor added."); load(); };
  document.querySelectorAll("[data-rmsp]").forEach((b) => (b.onclick = async () => { await asj("sponsors?id=" + encodeURIComponent(b.dataset.rmsp), "DELETE"); toast("Removed."); load(); }));
  const ed = $("#editdates"); if (ed) ed.onclick = (ev) => { ev.preventDefault(); const k = $("#editcard"); k.open = true; k.scrollIntoView({ behavior: "smooth" }); };
  const ef = $("#editform");
  if (ef) {
    const pm = $("#e-pmode"); pm.onchange = () => { $("#e-onewrap").hidden = pm.value !== "one"; $("#e-eachwrap").hidden = pm.value !== "each"; };
    ef.onsubmit = async (ev) => {
      ev.preventDefault(); const er = $("#e-err"); er.hidden = true;
      const prizes = {}; document.querySelectorAll("[data-eprize]").forEach((i) => { if (i.value.trim()) prizes[i.dataset.eprize] = i.value.trim(); });
      const body = { action: "edit", name: $("#e-name").value, org: $("#e-org").value, descr: $("#e-descr").value, closes: $("#e-closes").value, vs: $("#e-vs").value, ve: $("#e-ve").value, approval: $("#e-approval").value, prizeMode: pm.value, prize: $("#e-prize").value, prizes, sponsor: $("#e-sponsor").value, installerName: $("#e-iname").value, installerEmail: $("#e-iemail").value, installerUrl: $("#e-iurl").value, rules: $("#e-rules").value };
      if (!$("#e-cats").disabled) body.cats = $("#e-cats").value.split("\n").map((x) => x.trim()).filter(Boolean);
      const r = await fetch(`/api/contests/${encodeURIComponent(slug)}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }), j = await r.json().catch(() => ({}));
      if (!r.ok) { er.textContent = j.error || "That didn't save. Try again."; er.hidden = false; return; }
      toast("Saved."); await load();
    };
  }
  document.querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => {
    if (b.dataset.act === "announce") {
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to confirm. This ends voting."; return; }
      const r = await fetch(`/api/contests/${encodeURIComponent(slug)}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "announce", force: !!b.dataset.force }) }), j = await r.json().catch(() => ({}));
      if (r.status === 409 && j.incomplete) { b.dataset.force = "1"; b.textContent = `${j.incomplete.length} judge${j.incomplete.length === 1 ? " hasn't" : "s haven't"} finished. Tap again to announce anyway.`; return; }
      if (!r.ok) return toast(j.error || "That didn't work. Try again."); toast("Winners announced."); return load();
    }
    act(`/api/contests/${encodeURIComponent(slug)}`, { action: b.dataset.act }, "Done.");
  }));
  const aj = $("#addjudge"); if (aj) aj.onclick = async () => { const v = $("#newjudge").value.trim(), er = $("#jerr"); er.hidden = true; if (!v) return; const r = await fetch(`/api/contests/${encodeURIComponent(slug)}/judges`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ emails: v }) }), j = await r.json().catch(() => ({})); if (!r.ok || !j.added) { er.textContent = j.error || "That email is invalid or already a judge."; er.hidden = false; return; } toast("Judge invited."); load(); };
  document.querySelectorAll("[data-rmjudge]").forEach((b) => (b.onclick = async () => { await fetch(`/api/contests/${encodeURIComponent(slug)}/judges?id=${encodeURIComponent(b.dataset.rmjudge)}`, { method: "DELETE" }); toast("Judge removed."); load(); }));
  document.querySelectorAll("[data-entry]").forEach((b) => (b.onclick = () => { const [a, id] = b.dataset.entry.split(":"); let reason = ""; if (a === "decline") { reason = prompt("Why? This is emailed to the entrant (optional). Leave blank to send no reason.", ""); if (reason === null) return; } act(`/api/contests/${encodeURIComponent(slug)}/entries/${id}`, { action: a, reason }, ({ approve: "Approved. It's on the map, and the entrant was emailed.", restore: "Back in the review list.", decline: "Declined. The entrant was emailed.", flag: "Flagged. It stays on the ballot and is removed from the winners when you announce.", unflag: "Flag removed." })[a]); }));
  document.querySelectorAll("[data-void]").forEach((b) => (b.onclick = () => { const [id, v] = b.dataset.void.split(":"); act(`/api/contests/${encodeURIComponent(slug)}/votes`, { vote_id: id, voided: v === "1" }, v === "1" ? "Vote voided. It no longer counts." : "Vote restored."); }));
  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => { const o = b.textContent; try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select it"; } setTimeout(() => (b.textContent = o), 1500); }));
}
$("#tb").innerHTML = themeBtn(); mountAcct($("#acct")); noteSigninResult(); load();
</script>
</body>
</html>
