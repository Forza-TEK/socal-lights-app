<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Contest dashboard · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261031t">
<link rel="stylesheet" href="/contest.css?v=20261031t">
<style>main{max-width:900px}.thumb{width:56px;height:42px;object-fit:cover;border-radius:8px;background:var(--surface-2);display:block}</style>
</head>
<body>
<div class="hdr"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><span id="tb"></span><span id="acct"></span></div></div>
<div class="crumb wide"><a id="back" href="/">← Contest page</a></div>
<main class="cmain wide">
<div id="app"><p class="loading">Loading your dashboard…</p></div>
</main>
<script src="/vendor/qrcode.js"></script>
<script type="module">
import { me, signIn, noteSigninResult, esc, toast } from "/auth.js?v=20261030a";
import { themeBtn, mountAcct, refreshAcct } from "/addflow.js?v=20261031u";
const $ = (q) => document.querySelector(q), slug = location.pathname.split("/")[2] || "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = (s) => { const [, m, d] = s.split("-").map(Number); return MON[m - 1] + " " + d; };
const initials = (o) => (o.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "EN").toUpperCase();
$("#back").href = "/c/" + slug;
let D = null, M = null, V = null, J = { judges: [] };
const CROWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FBBF24" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14" fill="none"/></svg>';
const photoUrl = (k) => (k.startsWith("p/") ? "/api/photo/" + k : `/api/contests/${encodeURIComponent(slug)}/photo/${k}`);

async function load() {
  const i = await me(true);
  if (!i.user) { $("#app").innerHTML = `<div class="card center"><h2>Organizer sign-in</h2><p class="muted" style="max-width:44ch">Only the person who created this contest can see its entries and results.</p><button class="btn org" id="go" type="button">Sign in</button></div>`; $("#go").onclick = async () => { if (await signIn({ title: "Sign in to manage your contest", next: location.pathname })) { refreshAcct($("#acct")); load(); } }; return; }
  const [a, b, vv, jj] = await Promise.all([fetch(`/api/contests/${encodeURIComponent(slug)}`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/manage`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/votes`, { cache: "no-store" }), fetch(`/api/contests/${encodeURIComponent(slug)}/judges`, { cache: "no-store" })]);
  if (!a.ok || !b.ok || !(D = await a.json()).me.isOwner) { $("#app").innerHTML = `<div class="card center"><h2>This isn't your contest</h2><p class="muted">You're signed in as ${esc(i.user.email)}. Sign in with the email you used to create the contest.</p><a class="btn" href="/">Back to the map</a></div>`; return; }
  M = await b.json(); V = vv.ok ? await vv.json() : { votes: [], locked: false }; J = jj.ok ? await jj.json() : { judges: [] }; document.title = "Dashboard: " + D.contest.name; render();
}

async function act(path, body, okMsg) {
  const r = await fetch(path, { method: path.includes("/entries/") || path.endsWith("/votes") ? "POST" : "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.error || "That didn't work. Try again.");
  if (okMsg) toast(okMsg); await load();
}

function render() {
  const c = D.contest, url = location.origin + "/c/" + c.slug, short = url.replace(/^https?:\/\//, "");
  const entries = M.entries, waiting = entries.filter((e) => e.status === "pending").length, live = D.entries;
  const votes = live.reduce((n, e) => n + Object.values(e.votes || {}).reduce((x, y) => x + y, 0), 0);
  let qr = ""; try { const q = qrcode(0, "M"); q.addData(url + "?src=qr"); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch {}
  const sw = (label, sub, on, action, onLabel, offLabel) => `<div class="sw"><span>${label}<small>${sub}</small></span><button class="btn ghost sm" type="button" data-act="${action}">${on ? offLabel : onLabel}</button></div>`;
  const pub = c.mode !== "judges", hasJ = c.mode !== "public", both = c.mode === "both", score = c.judgeMethod === "score";
  const jnum = (e, g) => { const v = e.jv && e.jv[g]; return v && typeof v === "object" ? v.avg : v || 0; };
  const jtxt = (e, g) => { const v = e.jv && e.jv[g]; return v && typeof v === "object" ? `${v.avg.toFixed(1)} avg (${v.n}${v.tr ? ", high and low dropped" : ""})` : score ? "No scores" : String(v || 0); };
  const block = (g, kind) => { const isJ = kind === "judge", val = (e) => (isJ ? jnum(e, g) : e.votes?.[g] || 0), L = live.slice().sort((a, b) => val(b) - val(a)), mx = isJ && score ? 10 : Math.max(1, ...L.map(val)), win = new Set((isJ ? (D.jwinners || {})[g] : D.winners[g]) || []);
    return `<div style="display:grid;gap:8px">${both ? `<span class="small muted">${isJ ? "Judges' Choice" : "People's Choice"}</span>` : ""}${L.length ? L.map((e) => `<div style="display:grid;gap:4px"><div style="display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px"><span>${esc(e.name)}</span><span>${isJ ? esc(jtxt(e, g)) : e.votes?.[g] ?? 0}${win.has(e.id) ? " " + CROWN + ' <span class="pill p-ok">Winner</span>' : ""}</span></div><div class="rbar"><i style="width:${val(e) / mx * 100}%"></i></div></div>`).join("") : '<p class="muted small">No approved homes yet.</p>'}</div>`; };
  const prizeOf = (g, k) => (D.prizes || []).find((p) => p.category === g && p.kind === k);
  const results = c.categories.map((g) => `<div style="display:grid;gap:10px"><h3>${esc(g)}</h3>${[pub ? ["public"] : null, hasJ ? ["judge"] : null].filter(Boolean).map(([k]) => (prizeOf(g, k) ? `<p class="small muted" style="margin:0">Prize${both ? " (" + (k === "judge" ? "Judges' Choice" : "People's Choice") + ")" : ""}: ${esc(prizeOf(g, k).prize)}</p>` : "") + block(g, k)).join("")}</div>`).join("");
  const judgesCard = () => !hasJ ? "" : `<div class="card"><h2 style="font-size:19px">Judges</h2><p class="muted small">${score ? "Judges score every home 1 to 10 in each category." : "Judges pick a favorite in each category."} They vote separately from the public and can't judge their own home. Invitations are emailed; you can also copy each judge's link.</p>
    ${(J.judges || []).length ? `<div class="list">${J.judges.map((j) => `<div class="rowi"><div><b>${esc(j.email)}</b><br><span class="small muted">${j.joined ? "Signed in" : "Invited"} · ${j.done} of ${j.total} done</span></div><div class="acts"><button class="btn ghost sm" type="button" data-copy="${esc(location.origin + "/c/" + c.slug + "/judge")}">Copy link</button>${c.announced ? "" : `<button class="btn ghost sm" type="button" data-rmjudge="${esc(j.id)}">Remove</button>`}</div></div>`).join("")}</div>` : `<p class="muted">No judges yet.</p>`}
    ${c.announced ? "" : `<div style="display:flex;gap:10px;margin-top:6px"><input id="newjudge" type="email" inputmode="email" placeholder="judge@example.com" style="min-width:0;flex:1" aria-label="Judge's email"><button class="btn ghost" type="button" id="addjudge">Add judge</button></div><p class="err" id="jerr" role="alert" hidden></p>`}</div>`;
  $("#app").innerHTML = `${c.status !== "live" ? `<div class="status no"><span><b>Waiting for approval.</b> A person checks new contests, usually within a day. Your link and QR code already work, but the contest isn't on the map and entries are paused until then.</span></div>` : ""}
  <div class="card"><div class="banner"><div class="logo" aria-hidden="true">${esc(initials(c.org))}</div><div><b>${esc(c.name)}</b><span>${esc(c.org)} · ${esc(c.city)}</span></div></div>
  <div class="stats"><div class="stat"><b>${entries.length}</b><span>Entries</span></div><div class="stat"><b>${waiting}</b><span>Waiting for you</span></div><div class="stat"><b>${votes}</b><span>Votes</span></div></div>
  ${waiting ? `<div class="status no">${waiting} ${waiting > 1 ? "entries need" : "entry needs"} your OK before ${waiting > 1 ? "they appear" : "it appears"} on the map. See Entries below.</div>` : ""}</div>
  <div class="grid2"><div class="card"><h2 style="font-size:19px">Controls</h2><p class="muted small">Dates run entries and voting by themselves. These buttons override them.</p><div>
    ${sw("Entries", c.entriesOpen ? `Open until ${fmt(c.entriesClose)}` : "Closed", c.entriesOpen, c.entriesOpen ? "close_entries" : "open_entries", "Open entries", "Close entries")}
    ${c.votingOpen || c.votingPaused ? sw("Voting", c.votingOpen ? `Open until ${fmt(c.voteEnd)}` : "Paused by you", c.votingOpen, c.votingOpen ? "pause_voting" : "resume_voting", "Resume voting", "Pause voting") : `<div class="sw"><span>Voting<small>${c.announced ? "Over" : `Starts ${fmt(c.voteStart)}`}</small></span></div>`}
    ${c.votingOpen || c.announced ? "" : `<div class="sw"><span>Start voting now<small>Don't wait for ${fmt(c.voteStart)}</small></span><button class="btn org sm" type="button" data-act="start_voting">Start now</button></div>`}
    ${sw("Vote counts", c.showCounts ? "Visible to everyone" : "Hidden until winners", c.showCounts, c.showCounts ? "hide_counts" : "show_counts", "Show counts", "Hide counts")}</div></div>
   <div class="card"><h2 style="font-size:19px">Share it</h2><div class="copy"><span>${esc(short)}</span><button class="btn ghost sm" type="button" data-copy="${esc(url)}">Copy link</button></div><div class="poster"><b>${esc(c.name)}</b>${qr}<small>Scan to enter your home. Free.</small></div></div></div>
  <div class="card"><h2 style="font-size:19px">Entries</h2>${entries.length ? `<div class="tbl"><table><thead><tr><th>Photo</th><th>No.</th><th>Entry</th><th>Address</th><th>Contact</th><th>Status</th><th></th></tr></thead><tbody>${entries.map((e) => `<tr><td>${e.photos[0] ? `<img class="thumb" src="${esc(photoUrl(e.photos[0]))}" alt="">` : ""}</td><td><b>${e.entry_no}</b></td><td>${esc(e.title || e.biz)}</td><td>${esc(e.address)}</td><td>${esc(e.contact || "")}</td><td>${e.status === "approved" ? '<span class="pill p-ok">On the map</span>' : e.status === "declined" ? '<span class="pill p-no">Declined</span>' : '<span class="pill p-wait">Needs your OK</span>'}</td><td>${e.dq ? '<span class="pill p-wait">Removed at close</span> ' : ""}${e.status === "approved" && !c.announced ? `<button class="btn ghost sm" data-entry="${e.dq ? "unflag" : "flag"}:${e.id}" type="button">${e.dq ? "Undo flag" : "Disqualify at close"}</button>` : ""}${e.status === "pending" ? `<div class="actions"><button class="btn org sm" data-entry="approve:${e.id}" type="button">Approve</button><button class="btn bad sm" data-entry="decline:${e.id}" type="button">Decline</button></div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No entries yet. Share the link or print the poster to get started.</p>`}</div>
  ${judgesCard()}
  ${pub ? `<div class="card"><h2 style="font-size:19px">Review votes</h2><p class="muted small">Throwaway emails can't sign in. Suspicious patterns are flagged here, and you can void any vote. A voided vote stops counting right away and you can restore it${V.locked ? ". Results are locked now" : ""}.</p>${V.votes.length ? `<div class="tbl"><table><thead><tr><th>Voter</th><th>Vote</th><th>When</th><th></th></tr></thead><tbody>${V.votes.map((v) => `<tr><td${v.voided ? ' style="text-decoration:line-through"' : ""}>${esc(v.email)}</td><td>${esc(v.category)} → ${esc(v.entry)}${v.flags.length ? `<br><span class="pill p-wait">Flagged</span> <span class="small muted">${esc(v.flags[0])}</span>` : ""}${v.voided ? ' <span class="pill p-no">Voided</span>' : ""}</td><td class="small muted">${esc(v.at)}</td><td>${V.locked ? "" : `<button class="btn ghost sm" data-void="${esc(v.id)}:${v.voided ? 0 : 1}" type="button">${v.voided ? "Restore" : "Void"}</button>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No votes yet.</p>`}</div>` : ""}
  <div class="card"><h2 style="font-size:19px">Results${c.announced ? " (announced)" : " so far"}</h2>${results}<div class="actions"><a class="btn ghost" href="/api/contests/${encodeURIComponent(slug)}/export">Download results (spreadsheet)</a><button class="btn org" type="button" data-act="announce" ${c.announced || c.status !== "live" ? "disabled" : ""}>${c.announced ? "Winners announced" : "Close voting and announce winners"}</button></div><p class="small muted">You always see the full tally, even when it is hidden from the public. Announcing ends voting, locks the final results exactly as they are, shows everyone the winners and emails every entrant. Tied homes share the win.</p></div>`;
  document.querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => {
    if (b.dataset.act === "announce") {
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to confirm. This ends voting."; return; }
      const r = await fetch(`/api/contests/${encodeURIComponent(slug)}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "announce", force: !!b.dataset.force }) }), j = await r.json().catch(() => ({}));
      if (r.status === 409 && j.incomplete) { b.dataset.force = "1"; b.textContent = `${j.incomplete.length} judge${j.incomplete.length === 1 ? " hasn't" : "s haven't"} finished. Tap again to announce anyway.`; return; }
      if (!r.ok) return toast(j.error || "That didn't work. Try again."); toast("Winners announced."); return load();
    }
    act(`/api/contests/${encodeURIComponent(slug)}`, { action: b.dataset.act }, "Done.");
  }));
  const aj = $("#addjudge"); if (aj) aj.onclick = async () => { const v = $("#newjudge").value.trim(), er = $("#jerr"); er.hidden = true; if (!v) return; const r = await fetch(`/api/contests/${encodeURIComponent(slug)}/judges`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ emails: v }) }), j = await r.json().catch(() => ({})); if (!r.ok || !j.added) { er.textContent = j.error || "That email is invalid or already a judge."; er.hidden = false; return; } toast("Judge invited."); load(); };
  document.querySelectorAll("[data-rmjudge]").forEach((b) => (b.onclick = async () => { await fetch(`/api/contests/${encodeURIComponent(slug)}/judges?id=${encodeURIComponent(b.dataset.rmjudge)}`, { method: "DELETE" }); toast("Judge removed."); load(); }));
  document.querySelectorAll("[data-entry]").forEach((b) => (b.onclick = () => { const [a, id] = b.dataset.entry.split(":"); act(`/api/contests/${encodeURIComponent(slug)}/entries/${id}`, { action: a }, ({ approve: "Approved. It's on the map.", decline: "Declined.", flag: "Flagged. It stays on the ballot and is removed from the winners when you announce.", unflag: "Flag removed." })[a]); }));
  document.querySelectorAll("[data-void]").forEach((b) => (b.onclick = () => { const [id, v] = b.dataset.void.split(":"); act(`/api/contests/${encodeURIComponent(slug)}/votes`, { vote_id: id, voided: v === "1" }, v === "1" ? "Vote voided. It no longer counts." : "Vote restored."); }));
  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => { const o = b.textContent; try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select it"; } setTimeout(() => (b.textContent = o), 1500); }));
}
$("#tb").innerHTML = themeBtn(); mountAcct($("#acct")); noteSigninResult(); load();
</script>
</body>
</html>
