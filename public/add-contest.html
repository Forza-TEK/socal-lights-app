<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Create a contest · SoCal Lights</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261101c">
</head>
<body>
<div id="app"></div>
<script src="/vendor/qrcode.js"></script>
<script type="module">
import { run, esc, input, area, select, tile, sumRow, validSite, today, addDays, fmt } from "/addflow.js?v=20261031z";
import { me, signIn } from "/auth.js?v=20261101a";
import { rulesDefault } from "/rules.js";
import { CITY } from "/cities.js";
import { defaultSeason } from "/seasons.js?v=20261101e";
const FREE = new Set(["gmail.com","googlemail.com","hotmail.com","outlook.com","live.com","msn.com","yahoo.com","icloud.com","me.com","aol.com","proton.me","protonmail.com"]);
const DEF = ["Best Overall", "Most Creative", "Best Lights & Music", "Best Traditional"], cities = Object.keys(CITY).sort();
const dflt = () => { let y = new Date().getFullYear(); if (today > y + "-12-10") y++; return { closes: y + "-12-10", vs: y + "-12-11", ve: y + "-12-20" }; };
const d = { name: "Holiday Home Lighting Contest " + dflt().closes.slice(0, 4), org: "", city: "", descr: "Show us your best lights! Enter your home, then neighbors vote for their favorites.", site: "", ...dflt(), cats: [...DEF], on: [...DEF], newcat: "", approval: "manual", counts: "no", oneWin: "no", rules: "", mode: "public", judges: "", method: "pick", prizeMode: "none", prize: "", prizes: {}, sponsor: "", quick: "yes" };
let cur = (await me()).user ? await me() : { user: null };
const hostOf = (s) => { try { return new URL(/^https?:/i.test(s) ? s : "https://" + s).hostname.replace(/^www\./, "").toLowerCase(); } catch { return ""; } };
function trustNow() { if (!cur.user) return ""; const dom = cur.user.email.split("@")[1]; if (FREE.has(dom)) return "free"; if (!d.site.trim()) return "none"; const h = hostOf(d.site); return h && (h === dom || h.endsWith("." + dom) || dom.endsWith("." + h)) ? "match" : "other"; }
const TRUST = { match: "Your email matches your website, so your contest goes live right away.", free: "Gmail, Hotmail and similar addresses can't be matched to an organization, so a person checks your contest first, usually within a day. Your link and QR code work right away.", other: "Your email doesn't match your website, so a person checks your contest first, usually within a day. Your link and QR code work right away.", none: "A person checks your contest first, usually within a day, because you didn't add a website. Your link and QR code work right away." };
const rulesArgs = () => ({ name: d.name, org: d.org, city: d.city, closes: d.closes, vs: d.vs, ve: d.ve, oneWin: d.oneWin === "yes", mode: d.mode, method: d.method, prizeMode: d.prizeMode, prize: d.prize, sponsor: d.sponsor });
const parseJudges = (t) => [...new Set((t || "").split(/[\n,;]+/).map((x) => x.trim()).filter((x) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)))];
const kinds = () => (d.mode === "judges" ? [["judge", "Judges' Choice"]] : d.mode === "both" ? [["public", "People's Choice"], ["judge", "Judges' Choice"]] : [["public", "People's Choice"]]);
const slots = () => d.on.flatMap((c) => kinds().map(([k, l]) => ({ key: c + "|" + k, label: c + (kinds().length > 1 ? " · " + l : "") })));
const catTiles = () => d.cats.map((c) => `<button type="button" class="tile sm" data-a="cat:${esc(c)}" aria-pressed="${d.on.includes(c)}"><b>${esc(c)}</b></button>`).join("");

const steps = [
  { id: "name", sec: "Basics", title: "What's your contest called?", help: "This is the title everyone sees.", body: (x) => input(x, "name", { max: 90 }), check: (x) => (x.name.trim().length < 4 ? "Give your contest a name (at least 4 letters)." : "") },
  { id: "org", sec: "Basics", title: "Who is running it, and where?", help: "A city, school, neighborhood group, HOA, club or business, and the city the homes are in.",
    body: (x) => `${input(x, "org", { label: "Who is running it?", ph: "e.g. Mission Viejo Activities Committee", max: 80 })}${select(x, "city", cities.map((c) => [c, c]), { label: "City", blank: "Choose a city" })}`,
    check: (x) => (x.org.trim().length < 3 ? "Tell us who is running it." : !x.city ? "Choose the city where the homes are." : "") },
  { id: "descr", sec: "Basics", title: "Write a short welcome message", help: "Neighbors read this before they enter. We wrote one for you. Change it if you like.", body: (x) => area(x, "descr", { max: 200 }), check: (x) => (x.descr.trim().length < 20 ? "Write a sentence or two (at least 20 characters)." : "") },
  { id: "site", sec: "Basics", title: "Do you have a website?", help: "If you sign in with an email at this website, your contest goes live right away. Otherwise a person checks it first, usually within a day.",
    body: (x) => input(x, "site", { label: "Your organization's website", ph: "yourorganization.org", mode: "url", opt: true }), check: (x) => (!validSite(x.site) ? "That doesn't look like a website address. Try something like example.org." : "") },
  { id: "dates", sec: "Dates", title: "When does it happen?", help: "We filled in typical dates, so you can just tap Next.",
    body: (x) => `<div class="note">Neighbors can enter now to <b>${fmt(x.closes)}</b>. The community votes <b>${fmt(x.vs)} to ${fmt(x.ve)}</b>.</div>${input(x, "closes", { label: "Last day to enter", type: "date" })}<div class="row2">${input(x, "vs", { label: "Voting starts", type: "date" })}${input(x, "ve", { label: "Voting ends", type: "date" })}</div><div><button class="btn out sm" type="button" data-a="typical">Use typical dates</button></div>`,
    check: (x) => (!x.closes || x.closes < today ? "Pick an entry deadline that hasn't passed yet." : !x.vs || x.vs <= x.closes ? "Voting should start after entries close." : !x.ve || x.ve <= x.vs ? "Voting should end after it starts." : "") },
  { id: "cats", sec: "Rules", title: "Pick your voting categories", help: "Every home competes in every category. Voters pick one favorite home in each. “Best Overall” is a category like any other. Keep at least one.",
    body: (x) => `<div class="tiles g2">${catTiles()}</div><div style="display:flex;gap:10px"><input class="in" id="f-newcat" data-k="newcat" maxlength="30" placeholder="Add your own, like Best Inflatable" value="${esc(x.newcat)}"><button class="btn out" type="button" data-a="addcat">Add</button></div>`, check: (x) => (!x.on.length ? "Keep at least one category." : "") },
  { id: "mode", sec: "Rules", title: "Who can vote?", help: "Public votes and judges' votes are counted separately, so each category can have two awards.", redraw: false,
    body: (x) => `<div class="tiles">${tile(x, "mode", "public", "Everyone", "Anyone with an account can vote, one vote per category. Award: People's Choice.")}${tile(x, "mode", "judges", "Judges only", "Only the judges you invite can vote. Award: Judges' Choice.")}${tile(x, "mode", "both", "Everyone and judges", "The public and your judges both vote, separately. Two awards per category: People's Choice and Judges' Choice. Judges don't vote in the public vote.")}</div>` },
  { id: "judges", sec: "Rules", skip: (x) => x.mode === "public", title: "Invite your judges", help: "Paste one email per line. Each judge gets an invitation with a private link, and they sign in with that email. You can add or remove judges later.",
    body: (x) => `${area(x, "judges", { max: 1500, ph: "judge1@example.com\njudge2@example.com" })}<p class="small muted">${parseJudges(x.judges).length ? parseJudges(x.judges).length + " judge" + (parseJudges(x.judges).length === 1 ? "" : "s") + " ready to invite" : "No judges yet"}</p>`,
    check: (x) => (x.mode === "judges" && !parseJudges(x.judges).length ? "A judges-only contest needs at least one judge." : "") },
  { id: "method", sec: "Rules", skip: (x) => x.mode === "public", title: "How do judges vote?", help: "The public always picks one favorite per category.",
    body: (x) => `<div class="tiles">${tile(x, "method", "pick", "Pick a favorite", "Recommended. Same as the public: each judge picks one home per category. Simple and quick.")}${tile(x, "method", "score", "Score every home", "For formal judging: each judge scores every home from 1 to 10 in each category. The highest average wins. With 5 or more judges, each home's highest and lowest score are dropped.")}</div><div class="hint">Judges are guided to judge on first impression, creativity, theme, craftsmanship and variety of lights, and can recuse themselves from a household they know.</div>` },
  { id: "approval", sec: "Rules", title: "How should new entries be approved?", redraw: false,
    body: (x) => `<div class="tiles">${tile(x, "approval", "manual", "I review each entry first", "Recommended. Nothing appears on the map until you approve it.")}${tile(x, "approval", "auto", "Publish entries right away", "Faster, but you can't screen photos first.")}</div>` },
  { id: "counts", sec: "Rules", skip: (x) => x.mode === "judges", title: "Show vote counts while voting?",
    body: (x) => `<div class="tiles">${tile(x, "counts", "no", "Hide them until I announce winners", "Recommended. Avoids bandwagon voting, where people just vote for whoever is ahead.")}${tile(x, "counts", "yes", "Show running totals", "Builds excitement, but people can see who's ahead.")}</div>` },
  { id: "fair", sec: "Rules", title: "A few fairness rules", help: "These protect your contest from complaints.",
    body: (x) => `<div class="tiles">${tile(x, "oneWin", "no", "A home can win several categories", "Simple. The best home in each category wins, even if it's the same home.")}${tile(x, "oneWin", "yes", "One win per home", "Spreads the awards. A home that wins one category can't win a later one.")}</div><div class="hint"><b>Already protected for you</b><br>One vote per person per category, tied to a verified email. Nobody can vote for their own home. Throwaway email addresses can't be used. You can void suspicious votes, and a disqualification only takes effect when you close voting. ${d.mode === "both" ? "If the public vote ties, the judges' scores decide it, and homes still tied share the win." : "If homes tie, they share the win."}</div>` },
  { id: "prize", sec: "Rules", title: "Is there a prize?", help: "Optional. Prizes are shown on your contest page and with the winners when you announce them.", redraw: true,
    body: (x) => `<div class="tiles">${tile(x, "prizeMode", "none", "No prize", "Winners get a crown and recognition.")}${tile(x, "prizeMode", "one", "One prize for all winners", "The same prize for every award.")}${tile(x, "prizeMode", "each", "A different prize for each award", "Set a prize for each of the " + slots().length + " award" + (slots().length === 1 ? "" : "s") + ".")}</div>${x.prizeMode === "one" ? area(x, "prize", { label: "Prize", ph: "e.g. A $100 gift card for each winner", max: 140 }) : ""}${x.prizeMode === "each" ? slots().map((s) => `<div class="field"><label for="pz-${esc(s.key)}">${esc(s.label)}</label><input class="in" id="pz-${esc(s.key)}" data-prize="${esc(s.key)}" maxlength="100" placeholder="e.g. $100 gift card" value="${esc(x.prizes[s.key] || "")}"></div>`).join("") : ""}${x.prizeMode !== "none" ? input(x, "sponsor", { label: "Provided by", ph: "e.g. Mission Viejo Rotary", opt: true, max: 80 }) : ""}` },
  { id: "rules", sec: "Rules", title: "Official rules", help: "We drafted these for you. Edit anything. People accept them before they enter. If you offer a prize, have a lawyer read them.",
    body: (x) => { if (!x.rules) x.rules = rulesDefault(rulesArgs()); return `<div class="field"><label for="f-rules">Rules</label><textarea class="in" id="f-rules" data-k="rules" maxlength="4000" rows="14" style="min-height:300px">${esc(x.rules)}</textarea></div>`; }, check: (x) => (x.rules.trim().length < 40 ? "Add your rules." : "") },
  { id: "review", sec: "Review", title: "Review your contest", help: "Check everything, then create it. You can change any of this later.", cta: "Create contest", redraw: false,
    body: (x) => `<div class="sum">${sumRow("Contest", esc(x.name), "name")}${sumRow("Run by", `${esc(x.org)}, ${esc(x.city)}`, "org")}${sumRow("Entries", "Now to " + fmt(x.closes), "dates")}${sumRow("Voting", fmt(x.vs) + " to " + fmt(x.ve), "dates")}${sumRow("Categories", x.on.map(esc).join(", "), "cats")}${sumRow("Who votes", x.mode === "public" ? "Everyone" : x.mode === "judges" ? "Judges only (" + parseJudges(x.judges).length + " invited)" : "Everyone and judges (" + parseJudges(x.judges).length + " invited)", "mode")}${x.mode !== "public" ? sumRow("Judges vote", x.method === "score" ? "Score every home 1 to 10" : "Pick a favorite in each category", "method") : ""}${sumRow("Prize", x.prizeMode === "each" ? "A different prize for each award (" + slots().filter((s) => (x.prizes[s.key] || "").trim()).length + " set)" : x.prizeMode === "one" && x.prize.trim() ? esc(x.prize.trim()) : "No prize", "prize")}${sumRow("New entries", x.approval === "manual" ? "You review each one" : "Published right away", "approval")}${x.mode !== "judges" ? sumRow("Vote counts", x.counts === "yes" ? "Visible while voting" : "Hidden until winners", "counts") : ""}${sumRow("Wins", x.oneWin === "yes" ? "One win per home" : "A home can win several categories", "fair")}${sumRow("Rules", "Written. Edit if you like", "rules")}</div><p class="note" id="trust">${trustNow() ? TRUST[trustNow()] : "If you sign in with an email at your organization's website, your contest goes live right away. Otherwise a person checks it first, usually within a day. Either way your link and QR code work immediately."}</p>`,
    submit: async (x, api) => {
      if (!cur.user) { const u = await signIn({ title: "Sign in to create your contest", next: "/add-contest?resume=1" }); if (!u) throw new Error("Sign in to create your contest."); cur = await me(true); }
      const r = await fetch("/api/contests", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: x.name, org: x.org, city: x.city, descr: x.descr, site: x.site, closes: x.closes, vs: x.vs, ve: x.ve, cats: x.on, rule: "cat", approval: x.approval, showCounts: x.counts === "yes", oneWin: x.oneWin === "yes", rules: x.rules, mode: x.mode, judgeMethod: x.method, judges: parseJudges(x.judges), prizeMode: x.prizeMode, prize: x.prize, prizes: x.prizes, sponsor: x.sponsor }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Couldn't create the contest. Please try again.");
      const live = j.status === "live", url = location.origin + "/c/" + j.slug, short = url.replace(/^https?:\/\//, "");
      let qr = ""; try { const q = qrcode(0, "M"); q.addData(url + "?src=qr"); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch {}
      api.finish(`<h1>${live ? "Your contest is live" : "Your contest is almost ready"}</h1><p class="help">${live ? "It's on the map and in the list. Share the link or print the poster and neighbors can start entering." : "A person will check it, usually within a day. Your link and QR code already work, so you can start on flyers. It won't be on the map and entries stay paused until it's approved."}</p>
        <div class="copy"><span>${esc(short)}</span><button class="btn out sm" type="button" data-copy="${esc(url)}">Copy link</button></div><div class="poster"><b>${esc(x.name)}</b>${qr}<small>Scan to enter your home. Free.</small></div>
        <div><h2 style="margin-bottom:6px">What happens next</h2><div class="list"><div><b style="font-weight:500">Share the link or print the poster.</b><br><span class="muted">Put it on flyers, your website, Facebook or the city newsletter.</span></div><div><b style="font-weight:500">Neighbors enter their homes.</b><br><span class="muted">${x.approval === "manual" ? "You review each entry on your dashboard before it goes on the map." : "Entries appear on the map right away."}</span></div><div><b style="font-weight:500">The community votes ${fmt(x.vs)} to ${fmt(x.ve)}.</b><br><span class="muted">You announce the winners from your dashboard.</span></div></div></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="/c/${esc(j.slug)}/manage">Open my dashboard</a><a class="btn out" href="/c/${esc(j.slug)}">See the contest page</a></div>`);
    } },
];
// Quick start: keep the defaults and skip the rules screens. Customize shows every screen.
{
  const i = steps.findIndex((st) => st.id === "dates");
  steps.splice(i + 1, 0, { id: "setup", sec: "Dates", title: "How do you want to set it up?", help: "You can change everything later from your dashboard, so Quick start is a safe choice.", redraw: true,
    body: (x) => `<div class="tiles">${tile(x, "quick", "yes", "Quick start (recommended)", "Public voting, four categories, you approve each entry, and we draft the official rules. About a minute.")}${tile(x, "quick", "no", "Customize everything", "Judges, prizes, categories, vote counts and your own rules.")}</div>` });
  for (const st of steps) if (["cats", "mode", "judges", "method", "approval", "counts", "fair", "prize", "rules"].includes(st.id)) { const old = st.skip; st.skip = (x) => x.quick === "yes" || (old ? old(x) : false); }
}
const api = run({ steps, data: d, persist: "scl-contest-draft", account: { kind: "contest", title: (x) => x.name }, noPersist: ["newcat"], season: (x) => defaultSeason(x.closes), exit: "/add",
  onInput: (k, x) => { if (k === "closes") { if (x.vs <= x.closes) x.vs = addDays(x.closes, 1); if (x.ve <= x.vs) x.ve = addDays(x.vs, 9); for (const f of ["vs", "ve"]) { const el = document.getElementById("f-" + f); if (el) el.value = x[f]; } } },
  actions: {
    typical(_, a) { Object.assign(d, dflt()); a.draw(); },
    cat(c, a) { d.on = d.on.includes(c) ? d.on.filter((x) => x !== c) : [...d.on, c]; a.draw(); },
    addcat(_, a) { const v = d.newcat.trim().slice(0, 30); if (v && !d.cats.includes(v)) { d.cats.push(v); d.on.push(v); } d.newcat = ""; a.draw(); },
  } });
document.addEventListener("input", (e) => { const t = e.target; if (t.matches && t.matches("[data-prize]")) d.prizes[t.dataset.prize] = t.value; });
api.ready.then(() => { if (new URLSearchParams(location.search).get("resume")) api.goto("review"); });
</script>
</body>
</html>
