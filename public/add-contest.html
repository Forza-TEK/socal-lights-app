const api = run({ preview, steps, data: d, persist: "scl-contest-draft", prefill: (x) => { const v = take("contest"); if (!v || !Object.keys(v).length) return false; Object.assign(x, v); return true; }, account: { kind: "contest", title: (x) => x.name }, noPersist: ["newcat", "nl"], after: (s) => { if (s.id === "review") reviewNote(); }, season: (x) => defaultSeason(x.closes), exit: "/add",
  onInput: (k, x) => { if (k === "closes") { if (x.vs <= x.closes) x.vs = addDays(x.closes, 1); if (x.ve <= x.vs) x.ve = addDays(x.vs, 9); for (const f of ["vs", "ve"]) { const el = document.getElementById("f-" + f); if (el) el.value = x[f]; } } },
  actions: {
    typical(_, a) { Object.assign(d, dflt()); a.draw(); },
    cat(c, a) { d.on = d.on.includes(c) ? d.on.filter((x) => x !== c) : [...d.on, c]; a.draw(); },
    addcat(_, a) { const v = d.newcat.trim().slice(0, 30); if (v && !d.cats.includes(v)) { d.cats.push(v); d.on.push(v); } d.newcat = ""; a.draw(); },
  } });
document.addEventListener("input", (e) => { const t = e.target; if (t.matches && t.matches("[data-prize]")) d.prizes[t.dataset.prize] = t.value; });
api.ready.then(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("resume")) api.goto("review");
  const back = q.get("pass");
  if (back === "cancelled") { api.err("Payment cancelled. Nothing was charged and your contest details are saved. Tap Create contest to try again."); return; }
  if (back !== "paid") return;
  // Back from Stripe: the payment reaches us by webhook a moment later. Wait for the pass to show, then create the contest with the details kept in this browser.
  history.replaceState(null, "", "/add-contest?resume=1");
  const box = passBox(); if (box) box.innerHTML = `<p class="note" role="status">Payment received. Setting up your pass and creating your contest…</p>`;
  for (let i = 0; i < 20; i++) {
    const v = await entitlement().catch(() => null);
    if (v && v.canCreate) { api.next(); return; }
    await new Promise((go) => setTimeout(go, 1500));
  }
  if (passBox()) passBox().innerHTML = `<p class="note" role="status">Your payment is still being confirmed. Wait a minute, then tap Create contest. You will not be charged again.</p>`;
});
