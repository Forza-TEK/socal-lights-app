<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Claim your event · SoCal Lights</title>
<meta name="description" content="Claim your event on SoCal Lights to edit it, add photos and a ticket link.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>try{var t=(function(d){var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"numeric",hour12:false,timeZoneName:"short"}).formatToParts(d),g=function(k){for(var i=0;i<p.length;i++)if(p[i].type==k)return p[i].value},m=g("hour")%24*60+ +g("minute"),n=713+(g("timeZoneName")=="PDT"?60:0),H=(12+2.1*Math.sin(6.2832*(Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)-80)/365))*30;return m<n-H||m>=n+H?"dark":"light"})(new Date()),o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/tokens.css?v=20261124a">
<link rel="stylesheet" href="/addflow.css?v=20261128a">
<link rel="stylesheet" href="/info.css?v=20261128a">
<style>
.cl{max-width:560px;margin:28px auto 48px;display:grid;gap:14px}.cl h1,.cl p{margin:0}
.cl .ev{padding:16px;border-radius:14px;background:var(--surface,#fff);border:1.5px solid var(--line,#d9d2c8)}.cl .ev b{display:block;font-size:18px}
.cl .go{min-height:48px;padding:0 26px;border-radius:12px;border:0;background:var(--season,#c8324f);color:#fff;font:700 16px var(--font,inherit);cursor:pointer;justify-self:start}
:root[data-theme="dark"] .cl .go{color:#0b0d12}
.cl .go[disabled]{opacity:.6;cursor:default}.cl .err{color:#b3261e;font-weight:600}
.cl .ok{padding:16px;border-radius:14px;background:var(--surface,#fff);border:1.5px solid var(--line,#d9d2c8)}.cl ul{margin:0;padding-left:20px;display:grid;gap:6px}
</style>
<script src="/hit.js?v=20261107a" defer></script>
</head>
<body>
<div class="hdr" role="banner"><a class="brand" href="/" aria-label="SoCal Lights home"><img class="mark" src="/img/badge-160.webp" width="40" height="40" alt=""><span class="wm">SoCal <b>Lights</b></span></a><div class="hright"><a class="maplink" href="/" aria-label="Open the map"><span class="long">Open the map</span><span class="short">Map</span></a></div></div>
<main>
<div class="cl" id="box"><p>Loading…</p></div>
</main>
<script type="module">
import { me, signIn } from "/auth.js?v=20261116a";
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const id = (new URLSearchParams(location.search).get("event") || "").slice(0, 60), box = $("box");
const mdy = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? `${m[2]}/${m[3]}/${m[1]}` : ""; };
async function main() {
  if (!id) { box.innerHTML = '<h1>Claim your event</h1><p>Open your event on the <a href="/">map</a> and choose <b>Is this your event? Claim it</b> at the bottom of its card.</p>'; return; }
  const r = await fetch("/api/events/" + encodeURIComponent(id)); const ev = r.ok ? await r.json().catch(() => null) : null;
  if (!ev || !ev.n) { box.innerHTML = '<h1>We couldn\'t find that event</h1><p>It may have ended or been removed. <a href="/">Back to the map</a>.</p>'; return; }
  const u = (await me()).user;
  const card = `<div class="ev"><b>${esc(ev.n)}</b><span class="meta">${esc(ev.city || "")} · ${mdy(ev.s)}${ev.e !== ev.s ? " to " + mdy(ev.e) : ""}</span></div>`;
  box.innerHTML = `<h1>Claim your event</h1>${card}<p>Claiming proves this event is yours. Once it is approved you can <b>edit its details, add your ticket link, upload up to 4 photos and a short video</b>, and feature it on the map. It is free.</p>
    <p class="meta">If your email address is at your event's own website we approve it right away. Otherwise a person reviews it, usually within a day or two, and we email you.</p>${u ? `<p class="meta">Signed in as <b>${esc(u.email)}</b>.</p>` : ""}
    <p class="err" id="err" role="alert" hidden></p><button class="go" id="go" type="button">${u ? "Claim this event" : "Sign in to claim"}</button>`;
  $("go").onclick = async () => {
    const go = $("go"), er = $("err"); er.hidden = true;
    if (!u) { if (await signIn({ title: "Sign in to claim your event", next: location.pathname + location.search })) location.reload(); return; }
    go.disabled = true;
    try {
      const x = await fetch("/api/me/claims", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event_id: id }) }), j = await x.json().catch(() => ({}));
      if (!x.ok) throw new Error(j.error || "That didn't work. Please try again.");
      box.innerHTML = j.status === "approved"
        ? `<h1>It's yours to manage</h1>${card}<div class="ok"><p>Your claim is approved. Open <b>Events</b> in Your profile and choose <b>Edit</b> to:</p><ul><li>change the details and add your <b>ticket link</b></li><li>add up to 4 <b>photos</b> and a short <b>video</b></li></ul></div><p><a class="go" style="display:inline-grid;place-items:center;text-decoration:none" href="/profile#events">Open Your profile</a></p>`
        : `<h1>We got your claim</h1>${card}<div class="ok"><p>A person will look it over, usually within a day or two, and email you at <b>${esc(u.email)}</b>. When it is approved the event appears under <b>Events</b> in Your profile, ready to edit.</p></div><p><a href="/">Back to the map</a></p>`;
    } catch (e) { er.textContent = e.message; er.hidden = false; go.disabled = false; }
  };
}
main().catch(() => { box.innerHTML = '<h1>Something went wrong</h1><p>Please try again, or write to <a href="mailto:info@socallights.app">info@socallights.app</a>.</p>'; });
</script>
<script src="/footer.js?v=20261118a" defer></script>
</body>
</html>
