<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Show your lights · SoCal Lights</title>
<meta name="description" content="Put your Halloween or holiday display on the SoCal Lights map. It's free.">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/addflow.css?v=20261031b">
</head>
<body>
<div id="app"></div>
<script type="module">
import { run, ts, esc, input, area, select, tile, check, photoField, sumRow, validSite, isEmail, PRIV, today } from "/addflow.js?v=20261031b";
import { SEASONS, defaultSeason } from "/seasons.js?v=20261029d";
import { CITY } from "/cities.js";
const qs = new URLSearchParams(location.search), cities = Object.keys(CITY).sort();
const d = { kind: "homeowner", biz: "", web: "", phone: "", area: "", perm: false, season: SEASONS[qs.get("s")] ? qs.get("s") : defaultSeason(today), title: "", desc: "", street: "", city: "", zip: "", where: "", photos: [], email: "" };
const pro = (x) => x.kind === "installer";
await ts.init();

const steps = [
  { id: "kind", sec: "About you", title: "Who's posting?", help: "Homeowners and professional installers can both show their lights on the map.", redraw: true,
    body: (x) => `<div class="tiles">${tile(x, "kind", "homeowner", "A homeowner", "It's my house, and I decorated it.")}${tile(x, "kind", "installer", "A professional installer", "I installed this display for a customer, or it's a showcase of my work.")}</div>` },
  { id: "name", sec: "About you", title: (x) => (pro(x) ? "What's your business called?" : "What name should we show?"),
    help: (x) => (pro(x) ? "Families will see this with a way to ask for a quote." : "For example, The Garcia family. It appears as “Posted by”."),
    body: (x) => input(x, "biz", { max: 80, ph: pro(x) ? "e.g. Glow Pros Lighting" : "e.g. The Garcia family", ac: "name" }),
    check: (x) => (x.biz.trim().length < 2 ? "Add the name to show." : "") },
  { id: "biz", sec: "About you", skip: (x) => !pro(x), title: "How can people reach you?", help: "A website or a phone number, so families can ask for a quote.",
    body: (x) => `${input(x, "web", { label: "Website", ph: "yourbusiness.com", max: 200, type: "text", mode: "url", opt: true })}${input(x, "phone", { label: "Phone for quotes", max: 80, ac: "tel", type: "tel", opt: true })}${input(x, "area", { label: "Service area", ph: "e.g. Orange and Los Angeles counties", max: 120, opt: true })}${check(x, "perm", "I have the homeowner's permission to show this address.")}`,
    check: (x) => (!validSite(x.web) ? "That doesn't look like a website address. Try something like yourbusiness.com." : !x.web.trim() && !x.phone.trim() ? "Add a website or a phone number." : !x.perm ? "Please confirm you have the homeowner's permission to show this address." : "") },
  { id: "season", sec: "Your display", title: "Which season is this display for?", help: "It shows up under that season on the map.", redraw: true,
    body: (x) => `<div class="tiles g2">${Object.entries(SEASONS).map(([k, v]) => tile(x, "season", k, esc(v.label), "", true)).join("")}</div>` },
  { id: "about", sec: "Your display", title: "Tell us about the display", help: "A name for it, and a few sentences about what makes it special.",
    body: (x) => `${input(x, "title", { label: "Display name", max: 90, ph: "e.g. Music-synced rooftop show" })}${area(x, "desc", { label: pro(x) ? "About this installation" : "About this house", max: 1200, ph: "What you installed, how many lights, what makes it special" })}`,
    check: (x) => (x.title.trim().length < 3 ? "Give the display a name." : x.desc.trim().length < 10 ? "Add a sentence or two about it." : "") },
  { id: "addr", sec: "Location", title: "Where is it?", help: "The pin goes on this address and visitors see it, so they can drive by.",
    body: (x) => `${input(x, "street", { label: "Street address", max: 120, ac: "address-line1", ph: "e.g. 27 Via Alicia", addr: true })}<div class="row2">${select(x, "city", cities.map((c) => [c, c]), { label: "City", blank: "Choose a city", ac: "address-level2" })}${input(x, "zip", { label: "ZIP", max: 5, mode: "numeric", ac: "postal-code", ph: "92692" })}</div>`,
    check: (x) => (!x.street.trim() ? "Add your street address." : !x.city ? "Choose the city." : !/^\d{5}$/.test(x.zip.trim()) ? "The ZIP code needs 5 digits." : "") },
  { id: "where", sec: "Location", title: "Any tips for visitors?", help: "Best nights to come, where to park.",
    body: (x) => input(x, "where", { max: 120, ph: "e.g. Visible from Main St on weekend nights", label: "Tips", opt: true }) },
  { id: "photos", sec: "Photos", title: "Add photos", help: "Photos help families find the right house. You can skip this and add them later by email.", body: (x) => photoField(x) },
  { id: "review", sec: "Review", title: "Check everything, then send it", help: "It goes live after a quick review.", cta: "Send for review",
    body: (x) => `<div class="sum">${sumRow("Posting as", pro(x) ? "A professional installer" : "A homeowner", "kind")}${sumRow("Name", esc(x.biz), "name")}${sumRow("Season", esc(SEASONS[x.season].label), "season")}${sumRow("Display", esc(x.title), "about")}${sumRow("Address", `${esc(x.street)}, ${esc(x.city)} ${esc(x.zip)}`, "addr")}${sumRow("Photos", String(x.photos.length), "photos")}</div>
      ${input(x, "email", { label: `Your email <small>${PRIV}. Only the site owner sees it.</small>`, type: "email", mode: "email", ac: "email", max: 120 })}<div id="ts"></div>`,
    check: (x) => (!isEmail(x.email) ? "Enter your email so we can reach you if something needs fixing." : ""),
    submit: async (x, api) => {
      const fd = new FormData(), set = { kind: x.kind, biz: x.biz.trim(), email: x.email.trim(), title: x.title.trim(), season: x.season, street: x.street.trim(), city: x.city, state: "CA", zip: x.zip.trim(), where: x.where.trim(), desc: x.desc.trim() };
      if (pro(x)) Object.assign(set, { web: x.web.trim(), phone: x.phone.trim(), area: x.area.trim(), permission: "1" });
      for (const [k, v] of Object.entries(set)) fd.append(k, v);
      x.photos.forEach((p, i) => fd.append("photos", p.blob, `photo-${i + 1}.jpg`));
      fd.append("cf-turnstile-response", ts.token());
      const r = await fetch("/api/submit", { method: "POST", body: fd }), j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Couldn't send that. Try again in a moment.");
      api.finish(`<h1>Thanks! You're in review.</h1><p class="help">The site owner will look it over and publish it to the map. They may email you with questions.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="/">Back to the map</a><a class="btn out" href="/add-house">Add another</a></div>`);
    } },
];
run({ steps, data: d, persist: "scl-house-draft", noPersist: ["photos", "email"], season: (x) => x.season, addr: { cities }, after: (s) => { if (s.id === "review") ts.mount(); } });
</script>
</body>
</html>
