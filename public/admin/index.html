<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SoCal Lights Admin</title>
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<script>try{var h=new Date().getHours(),t=h>=18||h<6?"dark":"light",o=localStorage.getItem("socal-theme"),u=+localStorage.getItem("socal-theme-until")||0;if(o&&u>Date.now())t=o;document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
<style>
  body{overflow:auto;background:var(--bg)}
  .wrap{max-width:1000px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
  header h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
  .tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs button{border:0;background:none;border-bottom:2.5px solid transparent;padding:10px 12px;font-weight:700;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--bulb)}
  .cards{display:grid;gap:14px}
  .acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
  .acard h3{margin:0;font-size:18px}
  .pics{display:flex;gap:8px;overflow-x:auto}
  .pics a img{height:120px;width:auto;border-radius:8px;display:block}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tablewrap{overflow-x:auto}
  #pick{height:260px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
</style>
</head>
<body class="admin">
<div class="wrap">
  <div class="ahead">
    <a class="abrand" href="/" aria-label="SoCal Lights home"><img src="/img/badge-160.webp" width="40" height="40" alt=""><span>SoCal <b>Lights</b></span></a>
    <div class="aright"><span class="meta" id="who">Checking sign-in…</span><a class="btn ghost" href="/">View site</a><span id="tb"></span></div>
  </div>
  <h1 style="margin-bottom:18px">Admin</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-pending" aria-selected="true">Waiting for review <span class="tag" id="nPending">0</span></button>
    <button type="button" role="tab" id="tab-approved" aria-selected="false">Published houses <span class="tag" id="nApproved">0</span></button>
    <button type="button" role="tab" id="tab-subs" aria-selected="false">Submitted events <span class="tag" id="nSubs">0</span></button>
    <button type="button" role="tab" id="tab-contests" aria-selected="false">Contests <span class="tag" id="nContests">0</span></button>
    <button type="button" role="tab" id="tab-events" aria-selected="false">Events <span class="tag" id="nEvents">0</span></button>
    <button type="button" role="tab" id="tab-overlaps" aria-selected="false">Replaced records <span class="tag" id="nOverlaps">0</span></button>
    <button type="button" role="tab" id="tab-installers" aria-selected="false">Installers <span class="tag" id="nInstallers">0</span></button>
    <button type="button" role="tab" id="tab-users" aria-selected="false">Users <span class="tag" id="nUsers">0</span></button>
    <button type="button" role="tab" id="tab-data" aria-selected="false">Data check</button>
    <button type="button" role="tab" id="tab-log" aria-selected="false">Activity log</button>
  </div>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div class="modal" id="modal" hidden></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
import { themeBtn } from "/addflow.js?v=20261102b";
import { defaultSeason } from "/seasons.js?v=20261029d";
document.getElementById("tb").innerHTML = themeBtn();
document.documentElement.dataset.season = defaultSeason(new Date(Date.now() - 8 * 3600_000).toISOString().slice(0, 10));
</script>
<script type="module" src="/admin/admin.js?v=20261101b"></script>
</body>
</html>
